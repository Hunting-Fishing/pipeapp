plugins {
   id "com.android.application"
   id "kotlin-android"
   id "dev.flutter.flutter-gradle-plugin"
   id "com.google.gms.google-services"  // Google Services plugin
   id "com.google.firebase.crashlytics"

}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseSigningFields = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def releaseSigningConfigured = keystorePropertiesFile.exists() &&
    releaseSigningFields.every { field ->
        keystoreProperties[field]?.toString()?.trim()
    }
def releaseStoreFile = releaseSigningConfigured
    ? file(keystoreProperties['storeFile'])
    : null
releaseSigningConfigured = releaseSigningConfigured && releaseStoreFile.exists()

android {
    // This identifier already matches the installed Firebase registrations.
    // Store enrollment must approve any future identifier migration first.
    namespace = "Pipe.Buyerapp"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    defaultConfig {
        applicationId = "Pipe.Buyerapp"
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

   signingConfigs {
       release {
           keyAlias = keystoreProperties['keyAlias']
           keyPassword = keystoreProperties['keyPassword']
           storeFile = releaseStoreFile
           storePassword = keystoreProperties['storePassword']
       }
   }

    buildTypes {
        release {
            // Never create a production-looking artifact with the debug key.
            // A repository-excluded, complete key.properties file activates
            // release signing. The task-graph guard below rejects every
            // release build when that configuration is incomplete.
            signingConfig = releaseSigningConfigured ? signingConfigs.release : null
            proguardFiles = [getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro']
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def appReleaseTaskRequested = graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains('release')
    }
    if (appReleaseTaskRequested && !releaseSigningConfigured) {
        throw new GradleException(
            'Android release signing is not configured. Add android/key.properties ' +
            'with storeFile, storePassword, keyAlias, and keyPassword, and ensure ' +
            'the referenced keystore exists.'
        )
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
