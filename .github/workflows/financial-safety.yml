name: Financial Safety

on:
  pull_request:
    paths:
      - "firebase/functions/**"
      - "firebase/firestore.rules"
      - "firebase/firestore.indexes.json"
      - "tool/release_manifest.mjs"
      - "tool/release_manifest_test.mjs"
      - "tool/function_parity.mjs"
      - "tool/function_parity_test.mjs"
      - ".github/workflows/financial-safety.yml"
  push:
    branches:
      - main
    paths:
      - "firebase/functions/**"
      - "firebase/firestore.rules"
      - "firebase/firestore.indexes.json"
      - "tool/release_manifest.mjs"
      - "tool/release_manifest_test.mjs"
      - "tool/function_parity.mjs"
      - "tool/function_parity_test.mjs"
      - ".github/workflows/financial-safety.yml"

permissions:
  contents: read

concurrency:
  group: financial-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: Financial backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0

      - name: Install Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Restore Functions dependencies
        run: npm ci --prefix firebase/functions

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --prefix firebase/functions

      - name: Lint Functions
        run: npm run lint --prefix firebase/functions

      - name: Run Functions checks and unit tests
        env:
          PIPE_ENFORCE_APP_CHECK: "false"
        run: npm run check --prefix firebase/functions

      - name: Test release inventory controls
        run: >
          node --test
          tool/release_manifest_test.mjs
          tool/function_parity_test.mjs
