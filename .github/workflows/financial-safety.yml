name: Financial Safety - Manual

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this financial verification run is needed
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: financial-safety-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: Financial backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Restore Functions dependencies
        run: npm ci --prefix firebase/functions

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --prefix firebase/functions

      - name: Lint Functions
        run: npm run lint --prefix firebase/functions

      - name: Run Functions checks and unit tests
        env:
          PIPE_ENFORCE_APP_CHECK: "false"
        run: npm run check --prefix firebase/functions

      - name: Test release inventory controls
        run: >
          node --test
          tool/release_manifest_test.mjs
          tool/function_parity_test.mjs

      - name: Record manual financial gate
        run: |
          echo "Financial Safety runs only by explicit workflow dispatch." >> "$GITHUB_STEP_SUMMARY"
