name: Build signed mobile release candidates

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Controlled Firebase environment compiled into both candidates
        required: true
        type: choice
        options:
          - staging
          - production
      release_sha:
        description: Full 40-character commit SHA already contained in main
        required: true
        type: string
      build_name:
        description: Semantic application version, for example 1.0.0
        required: true
        type: string
      build_number:
        description: Positive store build number
        required: true
        type: string
      enable_remote_diagnostics:
        description: Enable reviewed native Crashlytics collection in this candidate
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ inputs.target_environment }}-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate controlled release input
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}

    steps:
      - name: Check out exact release source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify release identity and main ancestry
        id: release
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release_sha must be a lowercase full Git commit SHA." >&2
            exit 1
          }
          [[ "$BUILD_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "build_name must be a semantic version such as 1.0.0." >&2
            exit 1
          }
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "build_number must be a positive integer." >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || {
            echo "The checked-out commit does not match release_sha." >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo "Release candidates may only be built from commits contained in main." >&2
            exit 1
          }
          [[ -z "$(git status --porcelain)" ]] || {
            echo "Release source is not clean." >&2
            exit 1
          }
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "## Mobile release candidate preflight"
            echo ""
            echo "- Environment: \`${{ inputs.target_environment }}\`"
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Version: \`$BUILD_NAME+$BUILD_NUMBER\`"
            echo "- Source: exact commit contained in \`main\`"
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Build signed Android AAB
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ format('mobile-release-{0}', inputs.target_environment) }}
    env:
      PIPE_ENV: ${{ inputs.target_environment }}
      PIPE_RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      PIPE_FIREBASE_API_KEY: ${{ vars.PIPE_FIREBASE_API_KEY }}
      PIPE_FIREBASE_AUTH_DOMAIN: ${{ vars.PIPE_FIREBASE_AUTH_DOMAIN }}
      PIPE_FIREBASE_PROJECT_ID: ${{ vars.PIPE_FIREBASE_PROJECT_ID }}
      PIPE_FIREBASE_STORAGE_BUCKET: ${{ vars.PIPE_FIREBASE_STORAGE_BUCKET }}
      PIPE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.PIPE_FIREBASE_MESSAGING_SENDER_ID }}
      PIPE_FIREBASE_WEB_APP_ID: ${{ vars.PIPE_FIREBASE_WEB_APP_ID }}
      PIPE_FIREBASE_MEASUREMENT_ID: ${{ vars.PIPE_FIREBASE_MEASUREMENT_ID }}
      PIPE_PUBLIC_SUPPORT_EMAIL: ${{ vars.PIPE_PUBLIC_SUPPORT_EMAIL }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      MOBILE_RELEASE_ENVIRONMENT_GUARD: ${{ secrets.MOBILE_RELEASE_ENVIRONMENT_GUARD }}

    steps:
      - name: Check out exact release source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 0

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install Java toolchain
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate environment and Android signing inputs
        shell: bash
        run: |
          set -euo pipefail
          required_variables=(
            PIPE_FIREBASE_API_KEY
            PIPE_FIREBASE_AUTH_DOMAIN
            PIPE_FIREBASE_PROJECT_ID
            PIPE_FIREBASE_STORAGE_BUCKET
            PIPE_FIREBASE_MESSAGING_SENDER_ID
            PIPE_FIREBASE_WEB_APP_ID
            PIPE_PUBLIC_SUPPORT_EMAIL
          )
          required_secrets=(
            ANDROID_UPLOAD_KEYSTORE_BASE64
            ANDROID_UPLOAD_STORE_PASSWORD
            ANDROID_UPLOAD_KEY_ALIAS
            ANDROID_UPLOAD_KEY_PASSWORD
            MOBILE_RELEASE_ENVIRONMENT_GUARD
          )
          missing=()
          for name in "${required_variables[@]}" "${required_secrets[@]}"; do
            val="$(eval echo "\"\$$name\"" | tr -d '[:space:]')"
            if [[ -z "$val" ]]; then
              missing+=("$name")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing required Android configuration: ${missing[*]}" >&2
            {
              echo "### ❌ Missing Required Environment Values"
              echo "The following values are missing in environment \`mobile-release-$PIPE_ENV\`:"
              for item in "${missing[@]}"; do
                echo "- \`$item\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          GUARD="$(echo -n "${MOBILE_RELEASE_ENVIRONMENT_GUARD:-}" | tr -d '[:space:]')"
          if [[ "$GUARD" != "mobile-release-$PIPE_ENV" ]]; then
            echo "The protected mobile release environment guard does not match the selected environment." >&2
            {
              echo "### ❌ Environment Guard Mismatch"
              echo "Expected: \`mobile-release-$PIPE_ENV\`"
              echo "Got: \`$GUARD\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$PIPE_ENV" == "production" && "$PIPE_FIREBASE_PROJECT_ID" != "flutter-flow-pipe" ]]; then
            echo "Production candidates must target flutter-flow-pipe." >&2
            exit 1
          fi
          if [[ "$PIPE_ENV" == "staging" && "$PIPE_FIREBASE_PROJECT_ID" == "flutter-flow-pipe" ]]; then
            echo "Staging candidates cannot target the production Firebase project." >&2
            exit 1
          fi

      - name: Restore dependencies and signing material
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          chmod 600 "$RUNNER_TEMP/upload-keystore.jks"
          STORE_PASS="$(echo -n "$ANDROID_UPLOAD_STORE_PASSWORD" | tr -d '\r\n')"
          KEY_ALIAS="$(echo -n "$ANDROID_UPLOAD_KEY_ALIAS" | tr -d '\r\n')"
          KEY_PASS="$(echo -n "$ANDROID_UPLOAD_KEY_PASSWORD" | tr -d '\r\n')"
          printf '%s' "$STORE_PASS" > "$RUNNER_TEMP/store_password"
          chmod 600 "$RUNNER_TEMP/store_password"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload-keystore.jks"
            printf 'storePassword=%s\n' "$STORE_PASS"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASS"
          } > android/key.properties
          chmod 600 android/key.properties
          echo "=== key.properties written (passwords redacted) ==="
          cat android/key.properties | sed 's/Password=.*/Password=****/'
          keytool -list \
            -keystore "$RUNNER_TEMP/upload-keystore.jks" \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" -v 2>&1 | head -15
          echo "Keystore alias verified."


      - name: Build and verify signed Android candidate
        shell: bash
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          REMOTE_DIAGNOSTICS: ${{ inputs.enable_remote_diagnostics }}
        run: |
          set -euo pipefail
          flutter build appbundle \
            --release \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER" \
            --dart-define="PIPE_ENV=$PIPE_ENV" \
            --dart-define="PIPE_RELEASE_SHA=$PIPE_RELEASE_SHA" \
            --dart-define="PIPE_FIREBASE_API_KEY=$PIPE_FIREBASE_API_KEY" \
            --dart-define="PIPE_FIREBASE_AUTH_DOMAIN=$PIPE_FIREBASE_AUTH_DOMAIN" \
            --dart-define="PIPE_FIREBASE_PROJECT_ID=$PIPE_FIREBASE_PROJECT_ID" \
            --dart-define="PIPE_FIREBASE_STORAGE_BUCKET=$PIPE_FIREBASE_STORAGE_BUCKET" \
            --dart-define="PIPE_FIREBASE_MESSAGING_SENDER_ID=$PIPE_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define="PIPE_FIREBASE_WEB_APP_ID=$PIPE_FIREBASE_WEB_APP_ID" \
            --dart-define="PIPE_FIREBASE_MEASUREMENT_ID=$PIPE_FIREBASE_MEASUREMENT_ID" \
            --dart-define="PIPE_PUBLIC_SUPPORT_EMAIL=$PIPE_PUBLIC_SUPPORT_EMAIL" \
            --dart-define=PIPE_APP_CHECK_REQUIRED=true \
            --dart-define="PIPE_REMOTE_DIAGNOSTICS_ENABLED=$REMOTE_DIAGNOSTICS"

          source_aab=build/app/outputs/bundle/release/app-release.aab
          [[ -s "$source_aab" ]] || {
            echo "The Android App Bundle was not produced." >&2
            exit 1
          }
          # AAB signing verification.
          # NOTE: jarsigner is a JAR/APK v1 tool and ALWAYS returns exit code 4 on AAB files,
          # even when the AAB is correctly signed with v2/v3 APK Signature Schemes.
          # The correct check is to verify that Gradle embedded signing metadata (META-INF)
          # inside the AAB zip, then use keytool to inspect the signing certificate.
          signing_files="$(unzip -l "$source_aab" | grep -c 'META-INF/' || true)"
          if [[ "$signing_files" -lt 2 ]]; then
            echo "Android App Bundle has no signing metadata — release signing was not applied by Gradle." >&2
            echo "--- key.properties (passwords redacted) ---" >&2
            cat android/key.properties | sed 's/Password=.*/Password=****/' >&2 || true
            {
              echo "### ❌ Android AAB Unsigned"
              echo "The AAB contains no META-INF signing files."
              echo "Verify all four secrets in the \`mobile-release-production\` environment:"
              echo "- \`ANDROID_UPLOAD_KEYSTORE_BASE64\`"
              echo "- \`ANDROID_UPLOAD_STORE_PASSWORD\`"
              echo "- \`ANDROID_UPLOAD_KEY_ALIAS\`"
              echo "- \`ANDROID_UPLOAD_KEY_PASSWORD\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "AAB signing metadata verified: $signing_files META-INF entries found."
          artifact_dir=build/release-candidate/android
          mkdir -p "$artifact_dir"
          candidate="$artifact_dir/pipe-buyer-$PIPE_RELEASE_SHA-$BUILD_NUMBER.aab"
          cp "$source_aab" "$candidate"
          # Extract the signing certificate from the AAB and record it for audit.
          unzip -p "$candidate" 'META-INF/*.RSA' 2>/dev/null \
            | keytool -printcert \
            > "$artifact_dir/android-public-certificate.txt" 2>&1 || \
          unzip -p "$candidate" 'META-INF/*.DSA' 2>/dev/null \
            | keytool -printcert \
            > "$artifact_dir/android-public-certificate.txt" 2>&1 || \
          echo "Note: Could not extract DER certificate; AAB may use v2-only signing." \
            > "$artifact_dir/android-public-certificate.txt"
          # Record the full list of signing files for audit purposes.
          unzip -l "$candidate" | grep 'META-INF/' \
            > "$artifact_dir/android-signature-verification.txt"
          sha256sum "$candidate" > "$candidate.sha256"


          CANDIDATE_PATH="$candidate" node <<'NODE'
          const fs = require('node:fs');
          const metadata = {
            schemaVersion: 1,
            candidateId: 'android-aab',
            platform: 'android',
            applicationId: 'Pipe.Buyerapp',
            environment: process.env.PIPE_ENV,
            builtFromSha: process.env.PIPE_RELEASE_SHA,
            versionName: process.env.BUILD_NAME,
            buildNumber: process.env.BUILD_NUMBER,
            signatureVerified: true,
            storeValidated: false,
            artifactFile: process.env.CANDIDATE_PATH.split('/').pop(),
            workflowRunUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          };
          fs.writeFileSync(
            'build/release-candidate/android/candidate-metadata.json',
            `${JSON.stringify(metadata, null, 2)}\n`,
          );
          NODE
          {
            echo "## Signed Android candidate"
            echo ""
            echo "- Commit: \`$PIPE_RELEASE_SHA\`"
            echo "- Version: \`$BUILD_NAME+$BUILD_NUMBER\`"
            echo "- Application ID: \`Pipe.Buyerapp\`"
            echo "- Signature: verified via META-INF signing manifest ($signing_files entries)"
            echo "- Store validation: not performed by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Remove Android signing material
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

      - name: Retain signed Android candidate evidence
        if: success()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: signed-android-${{ needs.preflight.outputs.release_sha }}-${{ inputs.build_number }}
          path: build/release-candidate/android
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  ios:
    name: Build signed Apple IPA
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 45
    environment:
      name: ${{ format('mobile-release-{0}', inputs.target_environment) }}
    env:
      PIPE_ENV: ${{ inputs.target_environment }}
      PIPE_RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      PIPE_FIREBASE_API_KEY: ${{ vars.PIPE_FIREBASE_API_KEY }}
      PIPE_FIREBASE_AUTH_DOMAIN: ${{ vars.PIPE_FIREBASE_AUTH_DOMAIN }}
      PIPE_FIREBASE_PROJECT_ID: ${{ vars.PIPE_FIREBASE_PROJECT_ID }}
      PIPE_FIREBASE_STORAGE_BUCKET: ${{ vars.PIPE_FIREBASE_STORAGE_BUCKET }}
      PIPE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.PIPE_FIREBASE_MESSAGING_SENDER_ID }}
      PIPE_FIREBASE_WEB_APP_ID: ${{ vars.PIPE_FIREBASE_WEB_APP_ID }}
      PIPE_FIREBASE_MEASUREMENT_ID: ${{ vars.PIPE_FIREBASE_MEASUREMENT_ID }}
      PIPE_PUBLIC_SUPPORT_EMAIL: ${{ vars.PIPE_PUBLIC_SUPPORT_EMAIL }}
      IOS_DEVELOPMENT_TEAM: ${{ vars.IOS_DEVELOPMENT_TEAM }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
      MOBILE_RELEASE_ENVIRONMENT_GUARD: ${{ secrets.MOBILE_RELEASE_ENVIRONMENT_GUARD }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}


    steps:
      - name: Check out exact release source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 0

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Validate environment and Apple signing inputs
        shell: bash
        run: |
          set -euo pipefail
          required_variables=(
            PIPE_FIREBASE_API_KEY
            PIPE_FIREBASE_AUTH_DOMAIN
            PIPE_FIREBASE_PROJECT_ID
            PIPE_FIREBASE_STORAGE_BUCKET
            PIPE_FIREBASE_MESSAGING_SENDER_ID
            PIPE_FIREBASE_WEB_APP_ID
            PIPE_PUBLIC_SUPPORT_EMAIL
            IOS_DEVELOPMENT_TEAM
          )
          required_secrets=(
            IOS_DISTRIBUTION_CERTIFICATE_BASE64
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
            IOS_PROVISIONING_PROFILE_BASE64
            IOS_EXPORT_OPTIONS_PLIST_BASE64
            MOBILE_RELEASE_ENVIRONMENT_GUARD
          )
          missing=()
          for name in "${required_variables[@]}" "${required_secrets[@]}"; do
            val="$(eval echo "\"\$$name\"" | tr -d '[:space:]')"
            if [[ -z "$val" ]]; then
              missing+=("$name")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing required Apple configuration: ${missing[*]}" >&2
            {
              echo "### ❌ Missing Required Environment Values for Apple Build"
              echo "The following values are missing in environment \`mobile-release-$PIPE_ENV\`:"
              for item in "${missing[@]}"; do
                echo "- \`$item\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          GUARD="$(echo -n "${MOBILE_RELEASE_ENVIRONMENT_GUARD:-}" | tr -d '[:space:]')"
          if [[ "$GUARD" != "mobile-release-$PIPE_ENV" ]]; then
            echo "The protected mobile release environment guard does not match the selected environment." >&2
            {
              echo "### ❌ Environment Guard Mismatch"
              echo "Expected: \`mobile-release-$PIPE_ENV\`"
              echo "Got: \`$GUARD\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          TEAM="$(echo -n "${IOS_DEVELOPMENT_TEAM:-}" | tr -d '[:space:]')"
          if [[ ! "$TEAM" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "IOS_DEVELOPMENT_TEAM must be a ten-character Apple team ID (got: '$TEAM')." >&2
            exit 1
          fi
          if [[ "$PIPE_ENV" == "production" && "$PIPE_FIREBASE_PROJECT_ID" != "flutter-flow-pipe" ]]; then
            echo "Production candidates must target flutter-flow-pipe." >&2
            exit 1
          fi
          if [[ "$PIPE_ENV" == "staging" && "$PIPE_FIREBASE_PROJECT_ID" == "flutter-flow-pipe" ]]; then
            echo "Staging candidates cannot target the production Firebase project." >&2
            exit 1
          fi

      - name: Install signing material and build Apple candidate
        shell: bash
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          REMOTE_DIAGNOSTICS: ${{ inputs.enable_remote_diagnostics }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/distribution.p12"
          profile_path="$RUNNER_TEMP/distribution.mobileprovision"
          profile_plist="$RUNNER_TEMP/distribution-profile.plist"
          export_options_path="$RUNNER_TEMP/ExportOptions.plist"
          keychain_path="$RUNNER_TEMP/pipe-buyer-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | tr -d '[:space:]' | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | tr -d '[:space:]' | /usr/bin/base64 -D > "$profile_path"
          printf '%s' "$IOS_EXPORT_OPTIONS_PLIST_BASE64" | tr -d '[:space:]' | /usr/bin/base64 -D > "$export_options_path"
          chmod 600 "$certificate_path" "$profile_path" "$export_options_path"

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          profile_app="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          [[ "$profile_team" == "$IOS_DEVELOPMENT_TEAM" ]] || {
            echo "Provisioning profile team does not match IOS_DEVELOPMENT_TEAM." >&2
            exit 1
          }
          [[ "$profile_app" == "$IOS_DEVELOPMENT_TEAM.Pipe.Buyerapp" ]] || {
            echo "Provisioning profile does not authorize Pipe.Buyerapp." >&2
            exit 1
          }
          export_team="$(/usr/libexec/PlistBuddy -c 'Print :teamID' "$export_options_path")"
          export_style="$(/usr/libexec/PlistBuddy -c 'Print :signingStyle' "$export_options_path")"
          export_profile="$(/usr/libexec/PlistBuddy -c 'Print :provisioningProfiles:Pipe.Buyerapp' "$export_options_path")"
          [[ "$export_team" == "$IOS_DEVELOPMENT_TEAM" ]] || {
            echo "ExportOptions team does not match IOS_DEVELOPMENT_TEAM." >&2
            exit 1
          }
          [[ "$export_style" == "manual" ]] || {
            echo "ExportOptions must use explicit manual signing." >&2
            exit 1
          }
          [[ "$export_profile" == "$profile_name" ]] || {
            echo "ExportOptions does not name the installed Pipe.Buyerapp profile." >&2
            exit 1
          }

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain_path" | grep -Eq '1\) [0-9A-F]{40}' || {
            echo "No valid Apple code-signing identity was imported." >&2
            exit 1
          }
          profile_destination="$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          mkdir -p "$(dirname "$profile_destination")"
          cp "$profile_path" "$profile_destination"
          printf '%s' "$profile_destination" > "$RUNNER_TEMP/pipe-buyer-profile-path.txt"
          printf '%s' "$keychain_path" > "$RUNNER_TEMP/pipe-buyer-keychain-path.txt"

          flutter config --enable-swift-package-manager
          flutter pub get
          # IMPORTANT: Do NOT set FLUTTER_XCODE_* environment variables for code signing.
          # Those variables propagate signing settings to ALL targets in the workspace, including
          # Swift Package dependencies (geolocator, firebase_core, GTMAppAuth, google_sign_in, etc.)
          # that cannot accept a provisioning profile. Xcode will error:
          #   "[package] does not support provisioning profiles ... has been manually specified."
          # The export-options-plist passed to flutter build ipa handles signing for the Runner target.
          flutter build ipa \
            --release \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER" \
            --export-options-plist="$export_options_path" \
            --dart-define="PIPE_ENV=$PIPE_ENV" \
            --dart-define="PIPE_RELEASE_SHA=$PIPE_RELEASE_SHA" \
            --dart-define="PIPE_FIREBASE_API_KEY=$PIPE_FIREBASE_API_KEY" \
            --dart-define="PIPE_FIREBASE_AUTH_DOMAIN=$PIPE_FIREBASE_AUTH_DOMAIN" \
            --dart-define="PIPE_FIREBASE_PROJECT_ID=$PIPE_FIREBASE_PROJECT_ID" \
            --dart-define="PIPE_FIREBASE_STORAGE_BUCKET=$PIPE_FIREBASE_STORAGE_BUCKET" \
            --dart-define="PIPE_FIREBASE_MESSAGING_SENDER_ID=$PIPE_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define="PIPE_FIREBASE_WEB_APP_ID=$PIPE_FIREBASE_WEB_APP_ID" \
            --dart-define="PIPE_FIREBASE_MEASUREMENT_ID=$PIPE_FIREBASE_MEASUREMENT_ID" \
            --dart-define="PIPE_PUBLIC_SUPPORT_EMAIL=$PIPE_PUBLIC_SUPPORT_EMAIL" \
            --dart-define=PIPE_APP_CHECK_REQUIRED=true \
            --dart-define="PIPE_REMOTE_DIAGNOSTICS_ENABLED=$REMOTE_DIAGNOSTICS"


          ipa_count="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d ' ')"
          [[ "$ipa_count" == "1" ]] || {
            echo "Expected exactly one exported IPA; found $ipa_count." >&2
            exit 1
          }
          source_ipa="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' | head -n 1)"
          artifact_dir=build/release-candidate/ios
          unpacked="$RUNNER_TEMP/pipe-buyer-ipa"
          mkdir -p "$artifact_dir" "$unpacked"
          candidate="$artifact_dir/pipe-buyer-$PIPE_RELEASE_SHA-$BUILD_NUMBER.ipa"
          cp "$source_ipa" "$candidate"
          unzip -q "$candidate" -d "$unpacked"
          app_count="$(find "$unpacked/Payload" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
          [[ "$app_count" == "1" ]] || {
            echo "Expected exactly one signed application in the IPA." >&2
            exit 1
          }
          app_path="$(find "$unpacked/Payload" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")"
          bundle_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")"
          [[ "$bundle_id" == "Pipe.Buyerapp" ]] || {
            echo "Exported IPA has the wrong application identifier." >&2
            exit 1
          }
          [[ "$bundle_version" == "$BUILD_NAME" && "$bundle_build" == "$BUILD_NUMBER" ]] || {
            echo "Exported IPA version does not match the requested release." >&2
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "$app_path" \
            2> "$artifact_dir/ios-signature-verification.txt"
          echo 'codesign verification passed.' >> "$artifact_dir/ios-signature-verification.txt"
          codesign -dv --verbose=4 "$app_path" \
            2>> "$artifact_dir/ios-signature-verification.txt"
          shasum -a 256 "$candidate" > "$candidate.sha256"
          CANDIDATE_PATH="$candidate" node <<'NODE'
          const fs = require('node:fs');
          const metadata = {
            schemaVersion: 1,
            candidateId: 'ios-ipa',
            platform: 'ios',
            applicationId: 'Pipe.Buyerapp',
            environment: process.env.PIPE_ENV,
            builtFromSha: process.env.PIPE_RELEASE_SHA,
            versionName: process.env.BUILD_NAME,
            buildNumber: process.env.BUILD_NUMBER,
            signatureVerified: true,
            storeValidated: false,
            artifactFile: process.env.CANDIDATE_PATH.split('/').pop(),
            workflowRunUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          };
          fs.writeFileSync(
            'build/release-candidate/ios/candidate-metadata.json',
            `${JSON.stringify(metadata, null, 2)}\n`,
          );
          NODE
          {
            echo "## Signed Apple candidate"
            echo ""
            echo "- Commit: \`$PIPE_RELEASE_SHA\`"
            echo "- Version: \`$BUILD_NAME+$BUILD_NUMBER\`"
            echo "- Store validation: not performed by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed IPA to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${APP_STORE_CONNECT_KEY_ID:-}" || -z "${APP_STORE_CONNECT_ISSUER_ID:-}" || -z "${APP_STORE_CONNECT_API_KEY_P8:-}" ]]; then
            echo "App Store Connect API key secrets not fully configured; skipping automated upload."
            exit 0
          fi
          # Write the p8 private key to the directory that both altool and
          # iTMSTransporter search: ~/.private_keys/AuthKey_<KEY_ID>.p8
          mkdir -p ~/.private_keys
          p8_file="$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > "$p8_file"
          chmod 600 "$p8_file"

          candidate_ipa="$(find build/release-candidate/ios -name '*.ipa' | head -n 1)"
          [[ -n "$candidate_ipa" ]] || { echo 'No signed IPA found for upload.' >&2; exit 1; }
          echo "Uploading $candidate_ipa to App Store Connect..."

          # xcrun altool was REMOVED in Xcode 16 (macOS 15 runner).
          # The official Apple replacement is iTMSTransporter, which ships with
          # /Applications/Transporter.app on all macOS GitHub runners.
          TRANSPORTER="/Applications/Transporter.app/Contents/itms/bin/iTMSTransporter"
          if [[ -x "$TRANSPORTER" ]]; then
            "$TRANSPORTER" -m upload \
              -f "$candidate_ipa" \
              -apiKey "$APP_STORE_CONNECT_KEY_ID" \
              -apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
              -v eXtreme
          elif xcrun altool --version > /dev/null 2>&1; then
            # Fallback: Xcode < 16 (altool still present but deprecated)
            xcrun altool --upload-app \
              -t ios \
              -f "$candidate_ipa" \
              --apiKey "$APP_STORE_CONNECT_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          else
            echo 'Neither iTMSTransporter nor xcrun altool is available on this runner.' >&2
            exit 1
          fi

          rm -f "$p8_file"
          echo "Successfully uploaded $candidate_ipa to App Store Connect!"
          {
            echo ""
            echo "### 🚀 App Store Connect Upload"
            echo "- Status: **Successfully uploaded to App Store Connect!**"
            echo "- The build will appear in your [App Store Connect](https://appstoreconnect.apple.com) dashboard under **TestFlight / Builds** in a few minutes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove Apple signing material

        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/pipe-buyer-profile-path.txt" ]]; then
            rm -f "$(cat "$RUNNER_TEMP/pipe-buyer-profile-path.txt")"
          fi
          if [[ -f "$RUNNER_TEMP/pipe-buyer-keychain-path.txt" ]]; then
            security delete-keychain "$(cat "$RUNNER_TEMP/pipe-buyer-keychain-path.txt")" || true
          fi
          rm -f \
            "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/distribution.mobileprovision" \
            "$RUNNER_TEMP/distribution-profile.plist" \
            "$RUNNER_TEMP/ExportOptions.plist" \
            "$RUNNER_TEMP/pipe-buyer-profile-path.txt" \
            "$RUNNER_TEMP/pipe-buyer-keychain-path.txt"

      - name: Retain signed Apple candidate evidence
        # Run always so the IPA is preserved as a downloadable artifact even
        # when the App Store Connect upload step fails — allowing manual upload
        # via Transporter on a Mac without rerunning the entire build.
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: signed-ios-${{ needs.preflight.outputs.release_sha }}-${{ inputs.build_number }}
          path: build/release-candidate/ios
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
