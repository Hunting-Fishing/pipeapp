name: Validate Stripe Key API Mode

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-stripe-key-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Stripe credential account and mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_PROJECT_ID: flutter-flow-pipe
      EXPECTED_STRIPE_ACCOUNT: acct_1U2QmKDkO07WMXyR

    steps:
      - name: Install Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.25.0 --no-audit --no-fund

      - name: Validate Stripe credential privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          firebase functions:secrets:access STRIPE_SECRET_KEY \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" | tail -n 1 > .stripe-key
          node <<'NODE'
          const fs = require('node:fs');
          const key = fs.readFileSync('.stripe-key', 'utf8').trim();
          async function stripe(path) {
            const response = await fetch(`https://api.stripe.com${path}`, {
              headers: {Authorization: `Bearer ${key}`},
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(`Stripe API validation failed on ${path} (${response.status}).`);
            return payload;
          }
          (async () => {
            const [account, balance] = await Promise.all([
              stripe('/v1/account'),
              stripe('/v1/balance'),
            ]);
            if (String(account.id || '') !== process.env.EXPECTED_STRIPE_ACCOUNT) {
              throw new Error('Firebase Stripe credential belongs to a different Stripe account.');
            }
            const live = balance.livemode === true;
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `Stripe account: **verified**\nStripe API mode: **${live ? 'LIVE' : 'TEST'}**\n`,
            );
            if (!live) throw new Error('Firebase STRIPE_SECRET_KEY authenticates in Stripe TEST mode, not LIVE mode.');
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Remove local key file
        if: always()
        shell: bash
        run: rm -f .stripe-key
