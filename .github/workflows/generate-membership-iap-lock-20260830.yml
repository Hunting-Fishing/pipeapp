name: Generate Membership IAP Lock 2026-08-30

on:
  push:
    branches:
      - repair/membership-tier-migration-20260830
    paths:
      - '.github/workflows/generate-membership-iap-lock-20260830.yml'
      - 'pubspec.yaml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Generate deterministic Flutter dependency files
        run: flutter pub get
      - name: Verify only approved generated files changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | awk '{print $2}' | sort)
          expected=(
            "macos/Flutter/GeneratedPluginRegistrant.swift"
            "pubspec.lock"
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Expected generated changes:\n%s\n' "${expected[*]}"
            printf 'Actual generated changes:\n%s\n' "${changed[*]}"
            exit 1
          fi
          git diff --check -- "${expected[@]}"
      - name: Commit exact generated dependency files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Pipe Buyer Release Bot"
          git config user.email "103216816+Hunting-Fishing@users.noreply.github.com"
          git add pubspec.lock macos/Flutter/GeneratedPluginRegistrant.swift
          git commit -m "Lock native membership billing dependencies"
          git push origin HEAD:repair/membership-tier-migration-20260830
