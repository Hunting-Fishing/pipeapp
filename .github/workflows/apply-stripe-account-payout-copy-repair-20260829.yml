name: Apply Stripe Account Payout Copy Repair 2026-08-29

on:
  push:
    branches:
      - repair/stripe-integration-closure-20260829
    paths:
      - '.github/workflows/apply-stripe-account-payout-copy-repair-20260829.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7.0.0
        with:
          ref: repair/stripe-integration-closure-20260829
          fetch-depth: 0

      - name: Restore Account source before surgical repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout origin/main -- lib/marketplace/marketplace_account_hub.dart

      - name: Apply exact payout copy repair
        run: python3 tool/repair_stripe_account_payout_copy_20260829.py

      - name: Validate repaired source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "Seller Payout Setup" lib/marketplace/marketplace_account_hub.dart
          grep -Fq "Pipe Buyer does not store your bank account details" lib/marketplace/marketplace_account_hub.dart
          if grep -Fq "ACH / Wire escrow releases" lib/marketplace/marketplace_account_hub.dart; then
            echo '::error::Stale payout/escrow copy remains.'
            exit 1
          fi
          changed_lines="$(git diff --numstat -- lib/marketplace/marketplace_account_hub.dart | awk '{print $1 + $2}')"
          test -n "$changed_lines"
          if [ "$changed_lines" -gt 8 ]; then
            echo "::error::Account copy repair changed $changed_lines lines; expected a surgical copy-only diff."
            git diff -- lib/marketplace/marketplace_account_hub.dart
            exit 1
          fi

      - name: Commit validated copy repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/marketplace/marketplace_account_hub.dart; then
            echo '::error::Expected payout copy repair produced no change.'
            exit 1
          fi
          git config user.name 'Pipe Buyer Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/marketplace/marketplace_account_hub.dart
          git commit -m 'Keep seller payout copy repair surgical'
          git push origin HEAD
