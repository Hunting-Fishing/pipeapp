name: Deploy verified Firebase release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub Environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production
      commit_sha:
        description: Full verified commit SHA to deploy
        required: true
        type: string
      app_check_mode:
        description: App Check rollout stage for this exact release
        required: true
        default: disabled
        type: choice
        options:
          - disabled
          - observe
          - enforce

permissions:
  contents: read

concurrency:
  group: firebase-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}

    env:
      PIPE_ENV: ${{ inputs.environment }}
      PIPE_RELEASE_SHA: ${{ inputs.commit_sha }}
      PIPE_FIREBASE_API_KEY: ${{ vars.PIPE_FIREBASE_API_KEY }}
      PIPE_FIREBASE_AUTH_DOMAIN: ${{ vars.PIPE_FIREBASE_AUTH_DOMAIN }}
      PIPE_FIREBASE_PROJECT_ID: ${{ vars.PIPE_FIREBASE_PROJECT_ID }}
      PIPE_FIREBASE_STORAGE_BUCKET: ${{ vars.PIPE_FIREBASE_STORAGE_BUCKET }}
      PIPE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.PIPE_FIREBASE_MESSAGING_SENDER_ID }}
      PIPE_FIREBASE_WEB_APP_ID: ${{ vars.PIPE_FIREBASE_WEB_APP_ID }}
      PIPE_FIREBASE_MEASUREMENT_ID: ${{ vars.PIPE_FIREBASE_MEASUREMENT_ID }}
      PIPE_PUBLIC_SUPPORT_EMAIL: ${{ vars.PIPE_PUBLIC_SUPPORT_EMAIL }}
      PIPE_DEPLOY_ENVIRONMENT_GUARD: ${{ secrets.PIPE_DEPLOY_ENVIRONMENT_GUARD }}
      PIPE_APP_CHECK_WEB_RECAPTCHA_KEY: ${{ vars.PIPE_APP_CHECK_WEB_RECAPTCHA_KEY }}
      PIPE_FIREBASE_WEB_PUSH_VAPID_KEY: ${{ vars.PIPE_FIREBASE_WEB_PUSH_VAPID_KEY }}
      PIPE_APP_CHECK_MODE: ${{ inputs.app_check_mode }}
      PIPE_APP_CHECK_REQUIRED: ${{ inputs.app_check_mode == 'disabled' && 'false' || 'true' }}
      PIPE_REMOTE_DIAGNOSTICS_ENABLED: "true"
      PIPE_ENFORCE_APP_CHECK: ${{ inputs.app_check_mode == 'enforce' && 'true' || 'false' }}
      FUNCTIONS_DISCOVERY_TIMEOUT: "30000"
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Validate release input
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PIPE_RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::commit_sha must be a full 40-character Git SHA."
            exit 1
          fi
          required=(
            PIPE_FIREBASE_API_KEY
            PIPE_FIREBASE_AUTH_DOMAIN
            PIPE_FIREBASE_PROJECT_ID
            PIPE_FIREBASE_STORAGE_BUCKET
            PIPE_FIREBASE_MESSAGING_SENDER_ID
            PIPE_FIREBASE_WEB_APP_ID
            PIPE_PUBLIC_SUPPORT_EMAIL
            PIPE_DEPLOY_ENVIRONMENT_GUARD
            FIREBASE_TOKEN
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured in the $PIPE_ENV GitHub Environment."
              exit 1
            fi
          done
          if [[ "$PIPE_DEPLOY_ENVIRONMENT_GUARD" != "$PIPE_ENV" ]]; then
            echo "::error::The protected deployment environment guard does not match $PIPE_ENV."
            exit 1
          fi
          case "$PIPE_APP_CHECK_MODE" in
            disabled|observe|enforce) ;;
            *)
              echo "::error::Unsupported App Check mode: $PIPE_APP_CHECK_MODE"
              exit 1
              ;;
          esac
          if [[ "$PIPE_APP_CHECK_MODE" != "disabled" && -z "$PIPE_APP_CHECK_WEB_RECAPTCHA_KEY" ]]; then
            echo "::error::PIPE_APP_CHECK_WEB_RECAPTCHA_KEY is required in observe and enforce modes."
            exit 1
          fi
          if [[ "$PIPE_ENV" == "production" && "$PIPE_FIREBASE_PROJECT_ID" != "flutter-flow-pipe" ]]; then
            echo "::error::Production releases are approved only for flutter-flow-pipe."
            exit 1
          fi
          if [[ "$PIPE_ENV" == "staging" && "$PIPE_FIREBASE_PROJECT_ID" == "flutter-flow-pipe" ]]; then
            echo "::error::Staging cannot deploy to the production Firebase project."
            exit 1
          fi
          if [[ "$PIPE_ENV" == "production" && "$PIPE_APP_CHECK_MODE" == "disabled" ]]; then
            echo "::warning::App Check is disabled for this production release. Set app_check_mode to enforce before public launch."
          fi

      - name: Check out exact release commit
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Confirm checked-out source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$PIPE_RELEASE_SHA" ]]; then
            echo "::error::Checked out $actual_sha instead of $PIPE_RELEASE_SHA."
            exit 1
          fi
          if [[ "$PIPE_ENV" == "production" ]]; then
            git fetch origin main
            if ! git merge-base --is-ancestor "$PIPE_RELEASE_SHA" origin/main; then
              echo "::error::Production releases must use a commit contained in origin/main."
              exit 1
            fi
          fi

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install Java toolchain
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install Functions Node runtime
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Restore Flutter dependencies
        run: flutter pub get

      - name: Analyze application and tests
        run: dart analyze lib test

      - name: Run Flutter tests
        run: flutter test

      - name: Test release manifest controls
        run: node --test tool/release_manifest_test.mjs

      - name: Test deployed Function parity controls
        run: node --test tool/function_parity_test.mjs

      - name: Restore and validate Functions
        run: |
          npm ci --prefix firebase/functions
          npm run lint --prefix firebase/functions
          npm run check --prefix firebase/functions
          npm ci --prefix firebase/agent-functions
          npm run lint --prefix firebase/agent-functions
          npm run check --prefix firebase/agent-functions

      - name: Restore Firestore rules tests
        run: npm ci --prefix firebase/rules-tests

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.25.0

      - name: Test Firestore security rules
        run: >
          firebase emulators:exec
          --project demo-pipe-buyer-rules
          --config firebase.json
          --only firestore,storage
          "npm test --prefix firebase/rules-tests"

      - name: Test authenticated callable workflows and retries
        env:
          PIPE_ENFORCE_APP_CHECK: "false"
        run: >
          firebase emulators:exec
          --project demo-pipe-buyer-integration
          --config firebase.json
          --only auth,firestore,functions,storage
          "node firebase/functions/integration/callable_integration.mjs"

      - name: Build exact web release
        shell: bash
        run: |
          set -euo pipefail
          worker_path="web/firebase-messaging-sw.js"
          restore_worker() {
            git restore --source=HEAD --worktree -- "$worker_path"
          }
          trap restore_worker EXIT
          node tool/configure_firebase_messaging_worker.mjs \
            --output "$worker_path" \
            --api-key "$PIPE_FIREBASE_API_KEY" \
            --auth-domain "$PIPE_FIREBASE_AUTH_DOMAIN" \
            --project-id "$PIPE_FIREBASE_PROJECT_ID" \
            --storage-bucket "$PIPE_FIREBASE_STORAGE_BUCKET" \
            --messaging-sender-id "$PIPE_FIREBASE_MESSAGING_SENDER_ID" \
            --app-id "$PIPE_FIREBASE_WEB_APP_ID"
          flutter build web \
            --release \
            --dart-define=PIPE_ENV="$PIPE_ENV" \
            --dart-define=PIPE_RELEASE_SHA="$PIPE_RELEASE_SHA" \
            --dart-define=PIPE_FIREBASE_API_KEY="$PIPE_FIREBASE_API_KEY" \
            --dart-define=PIPE_FIREBASE_AUTH_DOMAIN="$PIPE_FIREBASE_AUTH_DOMAIN" \
            --dart-define=PIPE_FIREBASE_PROJECT_ID="$PIPE_FIREBASE_PROJECT_ID" \
            --dart-define=PIPE_FIREBASE_STORAGE_BUCKET="$PIPE_FIREBASE_STORAGE_BUCKET" \
            --dart-define=PIPE_FIREBASE_MESSAGING_SENDER_ID="$PIPE_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=PIPE_FIREBASE_WEB_APP_ID="$PIPE_FIREBASE_WEB_APP_ID" \
            --dart-define=PIPE_FIREBASE_MEASUREMENT_ID="$PIPE_FIREBASE_MEASUREMENT_ID" \
            --dart-define=PIPE_PUBLIC_SUPPORT_EMAIL=$PIPE_PUBLIC_SUPPORT_EMAIL \
            --dart-define=PIPE_APP_CHECK_WEB_RECAPTCHA_KEY="$PIPE_APP_CHECK_WEB_RECAPTCHA_KEY" \
            --dart-define=PIPE_APP_CHECK_REQUIRED="$PIPE_APP_CHECK_REQUIRED" \
            --dart-define=PIPE_FIREBASE_WEB_PUSH_VAPID_KEY="$PIPE_FIREBASE_WEB_PUSH_VAPID_KEY" \
            --dart-define=PIPE_REMOTE_DIAGNOSTICS_ENABLED="$PIPE_REMOTE_DIAGNOSTICS_ENABLED"
          restore_worker
          trap - EXIT
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            echo "::error::Release preparation modified repository source."
            exit 1
          fi

      - name: Confirm web notification worker
        run: >
          test -s build/web/firebase-messaging-sw.js

      - name: Record exact release manifest
        shell: bash
        run: |
          set -euo pipefail
          node tool/release_manifest.mjs \
            --environment "$PIPE_ENV" \
            --release-sha "$PIPE_RELEASE_SHA" \
            --firebase-project "$PIPE_FIREBASE_PROJECT_ID" \
            --app-check-mode "$PIPE_APP_CHECK_MODE" \
            --output build/release-manifest.json \
            --require-web
          {
            echo "## Verified release manifest"
            echo ""
            echo '```json'
            cat build/release-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm Firebase CI token is available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_TOKEN:-}" ]]; then
            echo "::error::FIREBASE_TOKEN secret is not configured. Run 'npx firebase-tools login:ci' locally and add the token as a GitHub secret named FIREBASE_TOKEN."
            exit 1
          fi
          echo "Firebase CI token is present."

      - name: Deploy explicitly selected Firebase project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          firebase deploy \
            --project "$PIPE_FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --config firebase.json \
            --only auth,hosting,functions,firestore:rules,firestore:indexes,storage \
            --message "Pipe Buyer $PIPE_ENV $PIPE_RELEASE_SHA workflow ${{ github.run_id }}" \
            --force \
            --non-interactive 2>&1 | tee build/firebase-deploy.log

      - name: Prove deployed Function parity
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list \
            --project "$PIPE_FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --json > build/deployed-functions.json
          node tool/function_parity.mjs \
            --manifest build/release-manifest.json \
            --inventory build/deployed-functions.json \
            --project "$PIPE_FIREBASE_PROJECT_ID" \
            --codebase marketplace \
            --output build/function-parity-marketplace.json
          node tool/function_parity.mjs \
            --manifest build/release-manifest.json \
            --inventory build/deployed-functions.json \
            --project "$PIPE_FIREBASE_PROJECT_ID" \
            --codebase functions \
            --output build/function-parity-agent.json
          {
            echo "## Firebase Function parity"
            echo ""
            echo "### Marketplace"
            echo '```json'
            cat build/function-parity-marketplace.json
            echo '```'
            echo ""
            echo "### Administrative agent"
            echo '```json'
            cat build/function-parity-agent.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record release identity
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Firebase release"
            echo ""
            echo "- Environment: \`$PIPE_ENV\`"
            echo "- Commit: \`$PIPE_RELEASE_SHA\`"
            echo "- Firebase project: \`$PIPE_FIREBASE_PROJECT_ID\`"
            echo "- App Check mode: \`$PIPE_APP_CHECK_MODE\`"
            echo "- Workflow run: \`${{ github.run_id }}\`"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain Firebase deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: firebase-release-evidence-${{ inputs.environment }}-${{ inputs.commit_sha }}-${{ github.run_id }}
          path: |
            build/release-manifest.json
            build/firebase-deploy.log
            build/deployed-functions.json
            build/function-parity-marketplace.json
            build/function-parity-agent.json
          if-no-files-found: warn
          retention-days: 30

  visual-acceptance:
    name: Visual acceptance ${{ inputs.environment }}
    needs: deploy
    runs-on: windows-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}

    env:
      PIPE_FIREBASE_PROJECT_ID: ${{ vars.PIPE_FIREBASE_PROJECT_ID }}
      PIPE_DEPLOY_ENVIRONMENT_GUARD: ${{ secrets.PIPE_DEPLOY_ENVIRONMENT_GUARD }}
      PIPE_APP_CHECK_WEB_DEBUG_TOKEN: ${{ secrets.PIPE_APP_CHECK_WEB_DEBUG_TOKEN }}

    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Verify deployed mobile and desktop rendering
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PIPE_FIREBASE_PROJECT_ID)) {
            throw 'PIPE_FIREBASE_PROJECT_ID is not configured.'
          }
          if ($env:PIPE_DEPLOY_ENVIRONMENT_GUARD -ne '${{ inputs.environment }}') {
            throw 'The protected deployment environment guard does not match the selected environment.'
          }
          if ([string]::IsNullOrWhiteSpace($env:PIPE_APP_CHECK_WEB_DEBUG_TOKEN)) {
            throw 'PIPE_APP_CHECK_WEB_DEBUG_TOKEN is not configured in the selected GitHub Environment.'
          }
          $url = if ('${{ inputs.environment }}' -eq 'production') {
            'https://www.pipebuyer.com'
          } else {
            "https://$($env:PIPE_FIREBASE_PROJECT_ID).web.app"
          }
          foreach ($path in @('/about', '/privacy', '/terms')) {
            $publicUrl = "$($url.TrimEnd('/'))$path"
            $response = Invoke-WebRequest -Uri $publicUrl -UseBasicParsing
            if ($response.StatusCode -ne 200) {
              throw "Public release page $publicUrl returned HTTP $($response.StatusCode)."
            }
            if ($response.Content -notmatch 'Pipe Buyer') {
              throw "Public release page $publicUrl does not identify Pipe Buyer."
            }
          }
          .\tool\web_visual_smoke.ps1 `
            -Url $url `
            -ScreenshotPath 'build/acceptance/mobile-390x844.png' `
            -ViewportWidth 390 `
            -ViewportHeight 844
          .\tool\web_visual_smoke.ps1 `
            -Url $url `
            -ScreenshotPath 'build/acceptance/desktop-1440x1000.png' `
            -ViewportWidth 1440 `
            -ViewportHeight 1000
          @(
            '## Web visual acceptance',
            '',
            "- URL: ``$url``",
            '- App Check: registered CI debug token injected only into the headless browser',
            '- Public pages: `/about`, `/privacy`, and `/terms` returned HTTP 200',
            '- Mobile viewport: `390x844`',
            '- Desktop viewport: `1440x1000`',
            '- Result: rendered with no browser exceptions'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Retain visual acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-acceptance-${{ inputs.environment }}-${{ github.run_id }}
          path: build/acceptance/*.png
          if-no-files-found: warn
          retention-days: 30
