name: Verify Release 3 Dispatch Context Messaging

on:
  push:
    branches:
      - feature/release-3-dispatch-context-messaging-20260902
    paths:
      - .github/workflows/verify-release3-dispatch-context-messaging-20260902.yml

permissions:
  contents: write

jobs:
  verify:
    name: Verify Dispatch job and quote messaging
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FUNCTIONS_DISCOVERY_TIMEOUT: "30000"

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7.0.0
        with:
          ref: feature/release-3-dispatch-context-messaging-20260902
          fetch-depth: 0

      - name: Syntax-check temporary patch tool before mutation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = 'tool/apply_release3_dispatch_context_messaging_20260902.py'
          compile(Path(path).read_text(encoding='utf-8'), path, 'exec')
          PY

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install Functions Node runtime
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            firebase/functions/package-lock.json
            firebase/agent-functions/package-lock.json

      - name: Apply guarded Dispatch messaging integration
        run: python3 tool/apply_release3_dispatch_context_messaging_20260902.py

      - name: Verify exact durable mutation scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          allowed=(
            docs/DISPATCH_RELEASE3_JOB_QUOTE_MESSAGING.md
            firebase/functions/communication_commands.js
            firebase/functions/index.js
            firebase/functions/integration/callable_integration.mjs
            firebase/functions/test/dispatch_context_messaging_contract.test.js
            lib/marketplace/marketplace_actions_repository.dart
            lib/marketplace/marketplace_dispatch_messaging.dart
            lib/marketplace/marketplace_dispatch_page.dart
            lib/marketplace/marketplace_dispatch_transaction.dart
            test/marketplace_dispatch_job_quote_messaging_test.dart
          )
          if [[ ${#changed[@]} -ne ${#allowed[@]} ]]; then
            printf 'Unexpected Dispatch messaging changes:\n%s\n' "${changed[*]}"
            exit 1
          fi
          for required in "${allowed[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$required" || {
              echo "Missing expected Dispatch messaging change: $required"
              exit 1
            }
          done

      - name: Format generated Dart files
        run: >
          dart format
          lib/marketplace/marketplace_dispatch_messaging.dart
          test/marketplace_dispatch_job_quote_messaging_test.dart

      - name: Verify generated Dart formatting is stable
        run: >
          dart format --output=none --set-exit-if-changed
          lib/marketplace/marketplace_dispatch_messaging.dart
          test/marketplace_dispatch_job_quote_messaging_test.dart

      - name: Restore Flutter dependencies with one infrastructure retry
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get || {
            echo 'First pub get failed; retrying once for registry transport errors.'
            sleep 5
            flutter pub get
          }

      - name: Analyze application and tests
        run: dart analyze lib test

      - name: Run focused Dispatch messaging test
        run: flutter test test/marketplace_dispatch_job_quote_messaging_test.dart

      - name: Run full Flutter regression
        run: >
          flutter test
          --dart-define=PIPE_ENV=continuous-integration
          --dart-define=PIPE_RELEASE_SHA=${{ github.sha }}

      - name: Restore and validate Marketplace Functions
        run: |
          npm ci --prefix firebase/functions
          node --test firebase/functions/test/dispatch_context_messaging_contract.test.js
          npm run lint --prefix firebase/functions
          npm run check --prefix firebase/functions

      - name: Restore and validate administrative Functions
        run: |
          npm ci --prefix firebase/agent-functions
          npm run lint --prefix firebase/agent-functions
          npm run check --prefix firebase/agent-functions

      - name: Run repository release-contract tests
        run: >
          node --test
          tool/oauth_branding_test.mjs
          tool/release_manifest_test.mjs
          tool/function_parity_test.mjs
          tool/phase1_acceptance_test.mjs
          tool/prepare_phase1_acceptance_test.mjs
          tool/configure_firebase_messaging_worker_test.mjs

      - name: Check source diff formatting
        run: git diff --check

      - name: Commit verified Dispatch messaging slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pipe Buyer Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            docs/DISPATCH_RELEASE3_JOB_QUOTE_MESSAGING.md \
            firebase/functions/communication_commands.js \
            firebase/functions/index.js \
            firebase/functions/integration/callable_integration.mjs \
            firebase/functions/test/dispatch_context_messaging_contract.test.js \
            lib/marketplace/marketplace_actions_repository.dart \
            lib/marketplace/marketplace_dispatch_messaging.dart \
            lib/marketplace/marketplace_dispatch_page.dart \
            lib/marketplace/marketplace_dispatch_transaction.dart \
            test/marketplace_dispatch_job_quote_messaging_test.dart
          if git diff --cached --quiet; then
            echo '::error::Dispatch messaging verification produced no durable changes.'
            exit 1
          fi
          git commit -m 'Release 3: add Dispatch job and quote messaging'
          git push origin HEAD:feature/release-3-dispatch-context-messaging-20260902
