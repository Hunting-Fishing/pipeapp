name: Apply Marketplace Payment Flow Repair 2026-08-29

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Apply and validate payment flow repair
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Apply deterministic repair
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/repair_marketplace_payments_20260829.py
          dart format \
            lib/marketplace/marketplace_secure_payment.dart \
            lib/marketplace/marketplace_messages_page.dart \
            lib/marketplace/marketplace_auction_settlement.dart

      - name: Validate Functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix firebase/functions
          npm audit --omit=dev --audit-level=high --prefix firebase/functions
          npm run lint --prefix firebase/functions
          npm run check --prefix firebase/functions

      - name: Validate Flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo '::error::Repair produced no changes.'
            exit 1
          fi
          git config user.name 'Pipe Buyer Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            firebase/functions/payment_readiness_admin.js \
            firebase/functions/pending_tax_policy.js \
            firebase/functions/stripe_marketplace_commands.js \
            firebase/functions/stripe_checkout_commands.js \
            firebase/functions/stripe_webhook.js \
            firebase/functions/marketplace_payment_lifecycle.js \
            firebase/functions/bootstrap.js \
            firebase/functions/test/stripe_checkout_readiness.test.js \
            firebase/functions/test/payment_readiness_admin.test.js \
            firebase/functions/test/pending_tax_policy.test.js \
            firebase/functions/test/marketplace_payment_lifecycle.test.js \
            lib/marketplace/marketplace_secure_payment.dart \
            lib/marketplace/marketplace_messages_page.dart \
            lib/marketplace/marketplace_auction_settlement.dart
          git commit -m 'Repair marketplace checkout and Timed Buying settlement flow'
          git push origin HEAD
