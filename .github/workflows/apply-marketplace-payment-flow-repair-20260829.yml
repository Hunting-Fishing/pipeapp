name: Apply Marketplace Payment Flow Repair 2026-08-29

on:
  push:
    branches:
      - fix/marketplace-payment-flow-20260829
    paths:
      - ".github/workflows/apply-marketplace-payment-flow-repair-20260829.yml"

permissions:
  contents: write

jobs:
  repair:
    name: Validate paid completion gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/marketplace-payment-flow-20260829
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Apply server-side completion gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/repair_marketplace_payments_20260829_completion_gate.py

      - name: Validate Functions
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix firebase/functions
          npm audit --omit=dev --audit-level=high --prefix firebase/functions
          npm run lint --prefix firebase/functions
          npm run check --prefix firebase/functions

      - name: Validate Flutter application
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze lib test
          flutter test

      - name: Commit validated completion gate
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo '::error::Completion gate produced no changes.'
            exit 1
          fi
          git config user.name 'Pipe Buyer Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            firebase/functions/marketplace_command_policy.js \
            firebase/functions/marketplace_commands.js \
            firebase/functions/test/marketplace_command_policy.test.js
          git commit -m 'Require payment before marketplace completion'
          git push origin HEAD
