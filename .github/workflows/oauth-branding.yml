name: OAuth Branding

on:
  pull_request:
    paths:
      - 'web/**'
      - 'firebase.json'
      - 'lib/main.dart'
      - 'tool/oauth_branding_test.mjs'
      - '.github/workflows/oauth-branding.yml'
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'firebase.json'
      - 'lib/main.dart'
      - 'tool/oauth_branding_test.mjs'
      - '.github/workflows/oauth-branding.yml'

permissions:
  contents: read

jobs:
  verify-branding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0
      - name: Use Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
      - name: Simulate Google OAuth branding checks
        run: node --test tool/oauth_branding_test.mjs
