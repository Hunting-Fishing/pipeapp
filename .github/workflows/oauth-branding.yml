name: OAuth Branding - Manual

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this branding verification run is needed
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-branding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
      - name: Simulate Google OAuth branding checks
        run: node --test tool/oauth_branding_test.mjs
      - name: Record manual branding gate
        run: |
          echo "OAuth Branding runs only by explicit workflow dispatch." >> "$GITHUB_STEP_SUMMARY"
