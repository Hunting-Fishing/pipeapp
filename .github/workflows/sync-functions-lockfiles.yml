name: Sync Functions lockfiles

on:
  push:
    branches:
      - fix/admin-claims-security-gate
    paths:
      - firebase/functions/package.json
      - firebase/agent-functions/package.json

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7.0.0
        with:
          ref: fix/admin-claims-security-gate

      - name: Install Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            firebase/functions/package-lock.json
            firebase/agent-functions/package-lock.json

      - name: Regenerate lockfiles from reviewed manifests
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix firebase/functions
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix firebase/agent-functions

      - name: Commit synchronized lockfiles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- firebase/functions/package-lock.json firebase/agent-functions/package-lock.json; then
            echo "Lockfiles already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase/functions/package-lock.json firebase/agent-functions/package-lock.json
          git commit -m "build: synchronize Functions security lockfiles"
          git push origin HEAD:fix/admin-claims-security-gate
