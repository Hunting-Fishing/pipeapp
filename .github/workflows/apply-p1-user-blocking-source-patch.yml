name: Apply P1 user blocking source patch

on:
  push:
    branches:
      - feature/p1-user-blocking-build-plan-20260901
    paths:
      - 'tool/apply_p1_user_blocking_patch.mjs'
      - '.github/workflows/apply-p1-user-blocking-source-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: feature/p1-user-blocking-build-plan-20260901
          fetch-depth: 0
      - name: Apply exact source anchors
        run: node tool/apply_p1_user_blocking_patch.mjs
      - name: Commit generated source changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Source patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase/functions/index.js lib/marketplace/marketplace_actions_repository.dart lib/marketplace/marketplace_messages_page.dart
          git commit -m "Wire marketplace user blocking into messaging"
          git push origin HEAD:feature/p1-user-blocking-build-plan-20260901
