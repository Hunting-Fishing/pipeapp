name: Callable Safety - Manual

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this emulator verification run is needed
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: callable-safety-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  callable-emulator:
    name: Authenticated callable emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0

      - name: Install Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            firebase/functions/package-lock.json
            firebase/agent-functions/package-lock.json

      - name: Install Java 21
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Functions dependencies
        run: |
          npm ci --prefix firebase/functions
          npm ci --prefix firebase/agent-functions

      - name: Prepare emulator-only payment secrets
        shell: bash
        run: |
          cat > firebase/functions/.secret.local <<'EOF'
          STRIPE_SECRET_KEY=sk_test_pipe_buyer_emulator_only
          STRIPE_SECRET_PRODUCTION=sk_test_pipe_buyer_production_binding_emulator_only
          STRIPE_WEBHOOK_SECRET=whsec_pipe_buyer_emulator_only
          EOF

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.25.0 --no-audit --no-fund

      - name: Run authenticated callable integration
        shell: bash
        env:
          PIPE_ENFORCE_APP_CHECK: "false"
        run: |
          set -o pipefail
          firebase emulators:exec \
            --project demo-pipe-buyer-integration \
            --config firebase.json \
            --only auth,firestore,functions,storage \
            "node firebase/functions/integration/callable_integration.mjs" \
            2>&1 | tee callable-integration.log

      - name: Upload callable integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: callable-integration-log
          path: callable-integration.log
          if-no-files-found: warn
          retention-days: 3

      - name: Record manual emulator gate
        run: |
          echo "Callable Safety runs only by explicit workflow dispatch." >> "$GITHUB_STEP_SUMMARY"
