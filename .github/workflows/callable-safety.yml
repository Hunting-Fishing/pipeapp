name: Callable Safety

on:
  pull_request:
    paths:
      - "firebase/functions/**"
      - "firebase/firestore.rules"
      - "firebase/storage.rules"
      - "firebase.json"
      - ".github/workflows/callable-safety.yml"
  push:
    branches:
      - main
    paths:
      - "firebase/functions/**"
      - "firebase/firestore.rules"
      - "firebase/storage.rules"
      - "firebase.json"
      - ".github/workflows/callable-safety.yml"

permissions:
  contents: read

concurrency:
  group: callable-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  callable-emulator:
    name: Authenticated callable emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0

      - name: Install Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Install Java 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Functions dependencies
        run: npm ci --prefix firebase/functions

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.25.0 --no-audit --no-fund

      - name: Run authenticated callable integration
        shell: bash
        env:
          PIPE_ENFORCE_APP_CHECK: "false"
        run: |
          set -o pipefail
          firebase emulators:exec \
            --project demo-pipe-buyer-integration \
            --config firebase.json \
            --only auth,firestore,functions,storage \
            "node firebase/functions/integration/callable_integration.mjs" \
            2>&1 | tee callable-integration.log

      - name: Upload callable integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: callable-integration-log
          path: callable-integration.log
          if-no-files-found: warn
          retention-days: 7
