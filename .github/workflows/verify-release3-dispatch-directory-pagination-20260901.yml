name: Verify Release 3 Dispatch Directory pagination

on:
  push:
    branches:
      - feature/release-3-dispatch-directory-pagination-20260901
    paths:
      - .github/workflows/verify-release3-dispatch-directory-pagination-20260901.yml

permissions:
  contents: write

jobs:
  verify:
    name: Build and verify Directory pagination
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FUNCTIONS_DISCOVERY_TIMEOUT: "30000"

    steps:
      - name: Check out Release 3 Directory branch
        uses: actions/checkout@v7.0.0
        with:
          ref: feature/release-3-dispatch-directory-pagination-20260901
          fetch-depth: 0

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install Functions Node runtime
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            firebase/functions/package-lock.json
            firebase/agent-functions/package-lock.json

      - name: Apply guarded Directory pagination integration
        run: python3 tool/apply_release3_dispatch_directory_pagination_20260901.py

      - name: Repair formatter-sensitive Directory source contract
        run: python3 tool/repair_release3_dispatch_projection_contract_20260901.py

      - name: Format bounded Release 3 files
        run: >
          dart format
          lib/marketplace/marketplace_dispatch_directory.dart
          test/marketplace_dispatch_directory_projection_query_test.dart
          test/dispatch_directory_projection_source_contract_test.dart

      - name: Verify mutation scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          allowed=(
            lib/marketplace/marketplace_dispatch_directory.dart
            test/marketplace_dispatch_directory_projection_query_test.dart
            test/dispatch_directory_projection_source_contract_test.dart
          )
          if [[ ${#changed[@]} -ne ${#allowed[@]} ]]; then
            printf 'Unexpected Release 3 changes:\n%s\n' "${changed[*]}"
            exit 1
          fi
          for required in "${allowed[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$required" || {
              echo "Missing expected Release 3 change: $required"
              exit 1
            }
          done

      - name: Restore Flutter dependencies
        run: flutter pub get

      - name: Analyze application and tests
        run: dart analyze lib test

      - name: Run focused Dispatch Directory tests
        run: >
          flutter test
          test/marketplace_dispatch_directory_projection_query_test.dart
          test/marketplace_dispatch_directory_test.dart
          test/dispatch_directory_projection_source_contract_test.dart

      - name: Run full Flutter regression
        run: >
          flutter test
          --dart-define=PIPE_ENV=continuous-integration
          --dart-define=PIPE_RELEASE_SHA=${{ github.sha }}

      - name: Run repository release-contract tests
        run: >
          node --test
          tool/oauth_branding_test.mjs
          tool/release_manifest_test.mjs
          tool/function_parity_test.mjs
          tool/phase1_acceptance_test.mjs
          tool/prepare_phase1_acceptance_test.mjs
          tool/configure_firebase_messaging_worker_test.mjs

      - name: Restore Functions dependencies
        run: |
          npm ci --prefix firebase/functions
          npm ci --prefix firebase/agent-functions

      - name: Validate Functions
        run: |
          npm run lint --prefix firebase/functions
          npm run check --prefix firebase/functions
          npm run lint --prefix firebase/agent-functions
          npm run check --prefix firebase/agent-functions

      - name: Check source diff formatting
        run: git diff --check

      - name: Commit verified Directory pagination slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pipe Buyer Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            lib/marketplace/marketplace_dispatch_directory.dart \
            test/marketplace_dispatch_directory_projection_query_test.dart \
            test/dispatch_directory_projection_source_contract_test.dart
          if git diff --cached --quiet; then
            echo "::error::Directory pagination verification produced no source changes."
            exit 1
          fi
          git commit -m 'Release 3: paginate Dispatch Directory results'
          git push origin HEAD:feature/release-3-dispatch-directory-pagination-20260901
