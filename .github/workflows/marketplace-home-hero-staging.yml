name: Marketplace home hero staging preview

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'lib/marketplace/marketplace_home_welcome.dart'
      - 'lib/marketplace/marketplace_home_hero_assets.dart'
      - 'test/marketplace_home_hero_responsive_test.dart'
      - 'assets/images/marketplace_home_hero_desktop.jpg'
      - 'assets/images/marketplace_home_hero_mobile.jpg'
      - 'docs/repairs/marketplace-home-background-hero.md'
      - '.github/workflows/marketplace-home-hero-staging.yml'

permissions:
  contents: read

concurrency:
  group: marketplace-home-hero-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Flutter validation
    if: github.event.pull_request.head.ref == 'feature/home-background-hero'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Restore Flutter dependencies
        run: flutter pub get

      - name: Format hero sources for validation
        run: >
          dart format
          lib/marketplace/marketplace_home_welcome.dart
          lib/marketplace/marketplace_home_hero_assets.dart
          test/marketplace_home_hero_responsive_test.dart

      - name: Analyze application and tests
        run: dart analyze lib test

      - name: Run Flutter tests
        run: flutter test

      - name: Retain responsive hero renders
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: marketplace-home-hero-widget-renders-${{ github.event.pull_request.head.sha }}
          path: build/acceptance/marketplace-home-hero-*.png
          if-no-files-found: warn
          retention-days: 14

  deploy-staging:
    name: Deploy staging hosting preview
    needs: validate
    if: github.event.pull_request.head.ref == 'feature/home-background-hero'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      PIPE_ENV: staging
      PIPE_RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
      PIPE_FIREBASE_API_KEY: ${{ vars.PIPE_FIREBASE_API_KEY }}
      PIPE_FIREBASE_AUTH_DOMAIN: ${{ vars.PIPE_FIREBASE_AUTH_DOMAIN }}
      PIPE_FIREBASE_PROJECT_ID: ${{ vars.PIPE_FIREBASE_PROJECT_ID }}
      PIPE_FIREBASE_STORAGE_BUCKET: ${{ vars.PIPE_FIREBASE_STORAGE_BUCKET }}
      PIPE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.PIPE_FIREBASE_MESSAGING_SENDER_ID }}
      PIPE_FIREBASE_WEB_APP_ID: ${{ vars.PIPE_FIREBASE_WEB_APP_ID }}
      PIPE_FIREBASE_MEASUREMENT_ID: ${{ vars.PIPE_FIREBASE_MEASUREMENT_ID }}
      PIPE_PUBLIC_SUPPORT_EMAIL: ${{ vars.PIPE_PUBLIC_SUPPORT_EMAIL }}
      PIPE_APP_CHECK_WEB_RECAPTCHA_KEY: ${{ vars.PIPE_APP_CHECK_WEB_RECAPTCHA_KEY }}
      PIPE_FIREBASE_WEB_PUSH_VAPID_KEY: ${{ vars.PIPE_FIREBASE_WEB_PUSH_VAPID_KEY }}
      PIPE_DEPLOY_ENVIRONMENT_GUARD: ${{ secrets.PIPE_DEPLOY_ENVIRONMENT_GUARD }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Validate staging environment
        shell: bash
        run: |
          set -euo pipefail
          required=(
            PIPE_FIREBASE_API_KEY
            PIPE_FIREBASE_AUTH_DOMAIN
            PIPE_FIREBASE_PROJECT_ID
            PIPE_FIREBASE_STORAGE_BUCKET
            PIPE_FIREBASE_MESSAGING_SENDER_ID
            PIPE_FIREBASE_WEB_APP_ID
            PIPE_PUBLIC_SUPPORT_EMAIL
            PIPE_DEPLOY_ENVIRONMENT_GUARD
            FIREBASE_TOKEN
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured in the staging GitHub Environment."
              exit 1
            fi
          done
          if [[ "$PIPE_DEPLOY_ENVIRONMENT_GUARD" != "staging" ]]; then
            echo "::error::The protected deployment environment guard is not staging."
            exit 1
          fi
          if [[ "$PIPE_FIREBASE_PROJECT_ID" == "flutter-flow-pipe" ]]; then
            echo "::error::Staging preview cannot deploy to the production Firebase project."
            exit 1
          fi

      - name: Check out exact PR head
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install Node runtime
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Restore Flutter dependencies
        run: flutter pub get

      - name: Build exact staging web preview
        shell: bash
        run: |
          set -euo pipefail
          worker_path="web/firebase-messaging-sw.js"
          restore_worker() {
            git restore --source=HEAD --worktree -- "$worker_path"
          }
          trap restore_worker EXIT
          node tool/configure_firebase_messaging_worker.mjs \
            --output "$worker_path" \
            --api-key "$PIPE_FIREBASE_API_KEY" \
            --auth-domain "$PIPE_FIREBASE_AUTH_DOMAIN" \
            --project-id "$PIPE_FIREBASE_PROJECT_ID" \
            --storage-bucket "$PIPE_FIREBASE_STORAGE_BUCKET" \
            --messaging-sender-id "$PIPE_FIREBASE_MESSAGING_SENDER_ID" \
            --app-id "$PIPE_FIREBASE_WEB_APP_ID"
          flutter build web \
            --release \
            --dart-define=PIPE_ENV="$PIPE_ENV" \
            --dart-define=PIPE_RELEASE_SHA="$PIPE_RELEASE_SHA" \
            --dart-define=PIPE_FIREBASE_API_KEY="$PIPE_FIREBASE_API_KEY" \
            --dart-define=PIPE_FIREBASE_AUTH_DOMAIN="$PIPE_FIREBASE_AUTH_DOMAIN" \
            --dart-define=PIPE_FIREBASE_PROJECT_ID="$PIPE_FIREBASE_PROJECT_ID" \
            --dart-define=PIPE_FIREBASE_STORAGE_BUCKET="$PIPE_FIREBASE_STORAGE_BUCKET" \
            --dart-define=PIPE_FIREBASE_MESSAGING_SENDER_ID="$PIPE_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=PIPE_FIREBASE_WEB_APP_ID="$PIPE_FIREBASE_WEB_APP_ID" \
            --dart-define=PIPE_FIREBASE_MEASUREMENT_ID="$PIPE_FIREBASE_MEASUREMENT_ID" \
            --dart-define=PIPE_PUBLIC_SUPPORT_EMAIL="$PIPE_PUBLIC_SUPPORT_EMAIL" \
            --dart-define=PIPE_APP_CHECK_WEB_RECAPTCHA_KEY="$PIPE_APP_CHECK_WEB_RECAPTCHA_KEY" \
            --dart-define=PIPE_APP_CHECK_REQUIRED=false \
            --dart-define=PIPE_FIREBASE_WEB_PUSH_VAPID_KEY="$PIPE_FIREBASE_WEB_PUSH_VAPID_KEY" \
            --dart-define=PIPE_REMOTE_DIAGNOSTICS_ENABLED=true
          restore_worker
          trap - EXIT

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.25.0

      - name: Deploy hosting only to staging
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --project "$PIPE_FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --config firebase.json \
            --only hosting \
            --message "Marketplace hero staging preview $PIPE_RELEASE_SHA" \
            --non-interactive

  hosting-smoke:
    name: Staging hosting and app-shell smoke
    needs: deploy-staging
    if: github.event.pull_request.head.ref == 'feature/home-background-hero'
    runs-on: windows-latest
    timeout-minutes: 12
    environment: staging
    env:
      PIPE_FIREBASE_PROJECT_ID: ${{ vars.PIPE_FIREBASE_PROJECT_ID }}
      PIPE_DEPLOY_ENVIRONMENT_GUARD: ${{ secrets.PIPE_DEPLOY_ENVIRONMENT_GUARD }}
      PIPE_APP_CHECK_WEB_DEBUG_TOKEN: ${{ secrets.PIPE_APP_CHECK_WEB_DEBUG_TOKEN }}

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify deployed staging app shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PIPE_FIREBASE_PROJECT_ID)) {
            throw 'PIPE_FIREBASE_PROJECT_ID is not configured.'
          }
          if ($env:PIPE_DEPLOY_ENVIRONMENT_GUARD -ne 'staging') {
            throw 'The protected deployment environment guard is not staging.'
          }
          # This feature preview is built with PIPE_APP_CHECK_REQUIRED=false.
          # A debug token is optional here; if configured, the smoke script can use it.
          # The root route is auth-gated, so these screenshots prove hosting/app-shell
          # health only. Hero pixels are verified in the Firebase-free widget tests.
          $url = "https://$($env:PIPE_FIREBASE_PROJECT_ID).web.app"
          .\tool\web_visual_smoke.ps1 `
            -Url $url `
            -ScreenshotPath 'build/acceptance/staging-shell-mobile-390x844.png' `
            -ViewportWidth 390 `
            -ViewportHeight 844
          .\tool\web_visual_smoke.ps1 `
            -Url $url `
            -ScreenshotPath 'build/acceptance/staging-shell-desktop-1440x1000.png' `
            -ViewportWidth 1440 `
            -ViewportHeight 1000

      - name: Retain staging app-shell screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: marketplace-home-hero-staging-shell-${{ github.event.pull_request.head.sha }}
          path: build/acceptance/staging-shell-*.png
          if-no-files-found: warn
          retention-days: 14
