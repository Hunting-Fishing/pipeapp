name: Ops patch visual acceptance App Check gating

on:
  push:
    branches:
      - fix/visual-acceptance-app-check-mode
    paths:
      - .github/workflows/ops-patch-visual-acceptance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: fix/visual-acceptance-app-check-mode
          fetch-depth: 0

      - name: Patch deploy workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/deploy.yml')
          text = path.read_text()
          marker = '  visual-acceptance:\n'
          if marker not in text:
              raise SystemExit('visual acceptance job was not found')

          head, visual = text.split(marker, 1)

          mode_line = "      PIPE_APP_CHECK_MODE: $" + "{{ inputs.app_check_mode }}\n"
          if '      PIPE_APP_CHECK_MODE:' not in visual:
              guard_prefix = '      PIPE_DEPLOY_ENVIRONMENT_GUARD:'
              guard_at = visual.find(guard_prefix)
              if guard_at < 0:
                  raise SystemExit('visual acceptance environment guard was not found')
              insert_at = visual.find('\n', guard_at) + 1
              if insert_at <= 0:
                  raise SystemExit('visual acceptance environment guard line is malformed')
              visual = visual[:insert_at] + mode_line + visual[insert_at:]

          old_guard = '''          if ([string]::IsNullOrWhiteSpace($env:PIPE_APP_CHECK_WEB_DEBUG_TOKEN)) {\n            throw 'PIPE_APP_CHECK_WEB_DEBUG_TOKEN is not configured in the selected GitHub Environment.'\n          }\n'''
          new_guard = '''          if ($env:PIPE_APP_CHECK_MODE -ne 'disabled' -and\n              [string]::IsNullOrWhiteSpace($env:PIPE_APP_CHECK_WEB_DEBUG_TOKEN)) {\n            throw 'PIPE_APP_CHECK_WEB_DEBUG_TOKEN is required when App Check is observe or enforce.'\n          }\n'''
          if old_guard not in visual:
              raise SystemExit('visual acceptance debug-token guard did not match expected source')
          visual = visual.replace(old_guard, new_guard, 1)

          old_summary = "            '- App Check: registered CI debug token injected only into the headless browser',\n"
          new_summary = '''            $(if ($env:PIPE_APP_CHECK_MODE -eq 'disabled') {\n              '- App Check: disabled for this release; no CI debug token required'\n            } else {\n              '- App Check: registered CI debug token injected only into the headless browser'\n            }),\n'''
          if old_summary not in visual:
              raise SystemExit('visual acceptance summary line did not match expected source')
          visual = visual.replace(old_summary, new_summary, 1)

          path.write_text(head + marker + visual)

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- .github/workflows/deploy.yml
          git config user.name "366 Industries"
          git config user.email "103216816+Hunting-Fishing@users.noreply.github.com"
          git add .github/workflows/deploy.yml
          git commit -m "Fix visual acceptance App Check gating"
          git push origin HEAD:fix/visual-acceptance-app-check-mode
