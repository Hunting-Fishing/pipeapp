name: Verify Release 2 Wanted journey guidance

on:
  push:
    branches:
      - feature/release-2-wanted-journey-guidance-20260901
    paths:
      - .github/workflows/verify-release2-wanted-journey-20260901.yml

permissions:
  contents: write

jobs:
  verify:
    name: Build and verify Wanted journey guidance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FUNCTIONS_DISCOVERY_TIMEOUT: "30000"

    steps:
      - name: Check out Wanted journey branch
        uses: actions/checkout@v7.0.0
        with:
          ref: feature/release-2-wanted-journey-guidance-20260901
          fetch-depth: 0

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install Functions Node runtime
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            firebase/functions/package-lock.json
            firebase/agent-functions/package-lock.json

      - name: Apply guarded Wanted journey integration
        run: python3 tool/apply_release2_wanted_journey_guidance_20260901.py

      - name: Format only bounded Wanted journey files
        run: >
          dart format
          lib/marketplace/marketplace_journey_status.dart
          test/marketplace_journey_status_test.dart

      - name: Verify mutation scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          allowed=(
            lib/marketplace/marketplace_journey_status.dart
            lib/marketplace/marketplace_account_hub.dart
            test/marketplace_journey_status_test.dart
          )
          if [[ ${#changed[@]} -ne ${#allowed[@]} ]]; then
            printf 'Unexpected Wanted journey changes:\n%s\n' "${changed[*]}"
            exit 1
          fi
          for required in "${allowed[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$required" || {
              echo "Missing expected Wanted journey change: $required"
              exit 1
            }
          done

      - name: Restore Flutter dependencies
        run: flutter pub get

      - name: Analyze application and tests
        run: dart analyze lib test

      - name: Run focused Wanted journey tests
        run: >
          flutter test
          test/marketplace_journey_status_test.dart
          test/wanted_ads_contract_test.dart
          test/marketplace_listing_status_test.dart

      - name: Run full Flutter regression
        run: >
          flutter test
          --dart-define=PIPE_ENV=continuous-integration
          --dart-define=PIPE_RELEASE_SHA=${{ github.sha }}

      - name: Run repository release-contract tests
        run: >
          node --test
          tool/oauth_branding_test.mjs
          tool/release_manifest_test.mjs
          tool/function_parity_test.mjs
          tool/phase1_acceptance_test.mjs
          tool/prepare_phase1_acceptance_test.mjs
          tool/configure_firebase_messaging_worker_test.mjs

      - name: Restore Functions dependencies
        run: |
          npm ci --prefix firebase/functions
          npm ci --prefix firebase/agent-functions

      - name: Validate Functions
        run: |
          npm run lint --prefix firebase/functions
          npm run check --prefix firebase/functions
          npm run lint --prefix firebase/agent-functions
          npm run check --prefix firebase/agent-functions

      - name: Check source diff formatting
        run: git diff --check

      - name: Commit verified Wanted journey slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pipe Buyer Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            lib/marketplace/marketplace_journey_status.dart \
            lib/marketplace/marketplace_account_hub.dart \
            test/marketplace_journey_status_test.dart
          if git diff --cached --quiet; then
            echo "::error::Wanted journey verification produced no source changes."
            exit 1
          fi
          git commit -m 'Release 2: clarify Wanted next actions'
          git push origin HEAD:feature/release-2-wanted-journey-guidance-20260901
