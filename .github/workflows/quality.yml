name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      FUNCTIONS_DISCOVERY_TIMEOUT: "30000"

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
          pub-cache-path: "${{ runner.temp }}/pub-cache"

      - name: Install Java toolchain
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Functions Node runtime
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            firebase/functions/package-lock.json
            firebase/agent-functions/package-lock.json
            firebase/rules-tests/package-lock.json

      - name: Restore Flutter dependencies
        run: flutter pub get

      - name: Validate PowerShell release and autonomous tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'tool/verify.ps1',
            'tool/web_visual_smoke.ps1',
            'tool/phase1_safe_default_rehearsal.ps1',
            'tool/autonomous_build.ps1',
            'tool/autonomous_build_v2.ps1',
            'tool/autonomous_process.ps1',
            'tool/autonomous_project.ps1',
            'tool/autonomous_fingerprint.ps1',
            'tool/autonomous_graduation.ps1',
            'tool/autonomous_guard.ps1',
            'tool/autonomous_builder_self_test.ps1',
            'tool/autonomous_guard_test.ps1',
            'tool/autonomous_recovery.ps1',
            'tool/autonomous_recovery_test.ps1',
            'tool/autonomous_runtime_fault_test.ps1',
            'tool/autonomous_reviewer_fault_test.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $details = ($parseErrors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell syntax failed for $script`: $details"
            }
          }

      - name: Test autonomous governance contracts
        shell: pwsh
        run: |
          .\tool\autonomous_builder_self_test.ps1 -ProjectRoot (Get-Location).Path
          .\tool\autonomous_guard_test.ps1
          .\tool\autonomous_recovery_test.ps1

      - name: Test autonomous compatibility engine
        run: node --test tool/autonomous_compatibility_test.mjs

      - name: Prevent PR route or Function export loss
        run: >
          node tool/autonomous_compatibility.mjs
          .
          ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Analyze application and tests
        run: dart analyze lib test

      - name: Run Flutter tests
        run: >
          flutter test
          --dart-define=PIPE_ENV=continuous-integration
          --dart-define=PIPE_RELEASE_SHA=${{ github.sha }}

      - name: Test OAuth branding contract
        run: node --test tool/oauth_branding_test.mjs

      - name: Test release manifest controls
        run: node --test tool/release_manifest_test.mjs

      - name: Test deployed Function parity controls
        run: node --test tool/function_parity_test.mjs

      - name: Test Phase 1 acceptance evidence controls
        run: >
          node --test
          tool/phase1_acceptance_test.mjs
          tool/prepare_phase1_acceptance_test.mjs
          tool/configure_firebase_messaging_worker_test.mjs

      - name: Build Android ARM64 debug artifact
        run: >
          flutter build apk
          --debug
          --target-platform android-arm64
          --dart-define=PIPE_ENV=continuous-integration
          --dart-define=PIPE_RELEASE_SHA=${{ github.sha }}
          --dart-define=PIPE_APP_CHECK_REQUIRED=true

      - name: Restore Functions dependencies
        run: |
          npm ci --prefix firebase/functions
          npm ci --prefix firebase/agent-functions

      - name: Audit Functions runtime dependencies
        run: |
          npm audit --omit=dev --audit-level=high --prefix firebase/functions
          npm audit --omit=dev --audit-level=high --prefix firebase/agent-functions

      - name: Validate Functions and jurisdiction policies
        run: |
          npm run lint --prefix firebase/functions
          npm run check --prefix firebase/functions
          npm run lint --prefix firebase/agent-functions
          npm run check --prefix firebase/agent-functions

      - name: Restore Firestore rules-test dependencies
        run: npm ci --prefix firebase/rules-tests

      - name: Audit Firestore rules-test dependencies
        run: npm audit --omit=dev --audit-level=high --prefix firebase/rules-tests

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.25.0 --no-audit --no-fund

      - name: Test Firestore and Storage security rules
        run: >
          firebase emulators:exec
          --project demo-pipe-buyer-rules
          --config firebase.json
          --only firestore,storage
          "npm test --prefix firebase/rules-tests"

      - name: Prepare emulator-only payment secrets
        shell: pwsh
        run: |
          @'
          STRIPE_SECRET_KEY=sk_test_pipe_buyer_emulator_only
          STRIPE_SECRET_PRODUCTION=sk_test_pipe_buyer_production_binding_emulator_only
          STRIPE_WEBHOOK_SECRET=whsec_pipe_buyer_emulator_only
          '@ | Set-Content -Path firebase/functions/.secret.local

      - name: Test authenticated callable workflows and retries
        env:
          PIPE_ENFORCE_APP_CHECK: "false"
        run: >
          firebase emulators:exec
          --project demo-pipe-buyer-integration
          --config firebase.json
          --only auth,firestore,functions,storage
          "node firebase/functions/integration/callable_integration.mjs"

      - name: Build production web artifact
        run: >
          flutter build web
          --release
          --dart-define=PIPE_ENV=continuous-integration
          --dart-define=PIPE_RELEASE_SHA=${{ github.sha }}

      - name: Record verified release manifest
        run: >
          node tool/release_manifest.mjs
          --environment continuous-integration
          --release-sha ${{ github.sha }}
          --output build/release-manifest.json
          --require-web

  ios-compile:
    name: Compile iOS release target
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Restore Flutter dependencies
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get

      - name: Compile unsigned iOS release target
        run: >
          flutter build ios
          --release
          --no-codesign
          --dart-define=PIPE_ENV=continuous-integration
          --dart-define=PIPE_RELEASE_SHA=${{ github.sha }}
          --dart-define=PIPE_APP_CHECK_REQUIRED=true

      - name: Verify compiled application bundle
        shell: bash
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          {
            echo "## iOS compile evidence"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Target: \`iphoneos\` release"
            echo "- Output: \`build/ios/iphoneos/Runner.app\`"
            echo "- Signing: intentionally disabled; this is compile evidence, not a distributable candidate"
          } >> "$GITHUB_STEP_SUMMARY"
