name: Merge Release 2 Wanted journey

on:
  push:
    branches:
      - ops/merge-release2-wanted-20260901
    paths:
      - .github/workflows/merge-release2-wanted-20260901.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Squash merge exact Wanted PR head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: 5b1c76b7482c68a8a3065a1e47881da3f900469e
        run: |
          set -euo pipefail
          current_head="$(gh api repos/${{ github.repository }}/pulls/171 --jq .head.sha)"
          if [[ "$current_head" != "$EXPECTED_HEAD" ]]; then
            echo "::error::PR #171 moved from $EXPECTED_HEAD to $current_head"
            exit 1
          fi
          gh api --method PUT repos/${{ github.repository }}/pulls/171/merge \
            -f sha="$EXPECTED_HEAD" \
            -f merge_method=squash \
            -f commit_title='Release 2: clarify Wanted next actions (#171)' \
            -f commit_message='Wanted/RFQ journey-closure slice. Verification run 33500644883 passed analyzer, focused Wanted tests, full Flutter regression, release contracts, Functions validation, and diff checks.' \
            --jq '{merged, message, sha}'
