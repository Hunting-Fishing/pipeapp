name: Apply profile primary community remediation

on:
  push:
    branches:
      - profile-primary-community-persistence

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile branch
        uses: actions/checkout@v7.0.0
        with:
          ref: profile-primary-community-persistence
          fetch-depth: 0

      - name: Apply profile remediation
        run: python tool/apply_profile_primary_community.py

      - name: Commit production changes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "366 Industries"
          git config user.email "103216816+Hunting-Fishing@users.noreply.github.com"
          git rm tool/apply_profile_primary_community.py
          git rm .github/workflows/apply_profile_primary_community.yml
          git add lib test firebase
          git diff --cached --check
          git commit -m "Fix profile community persistence and feedback"
          git push origin HEAD:profile-primary-community-persistence
