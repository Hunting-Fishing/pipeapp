name: Read Stripe seller onboarding error

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostic/stripe-seller-onboarding-400-20260829
    paths:
      - ".github/workflows/read-stripe-seller-onboarding-error-20260829.yml"

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect recent onboarding failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_PROJECT_ID: flutter-flow-pipe
    steps:
      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.25.0 --no-audit --no-fund

      - name: Read sanitized seller onboarding errors
        shell: bash
        run: |
          set -euo pipefail
          set +e
          firebase functions:log \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --only createStripeSellerOnboardingLink \
            --lines 300 > full-function-log.txt 2>&1
          log_status=$?
          set -e
          grep -E "Stripe marketplace request failed|Stripe seller onboarding link failed|accounts_v2|failed-precondition|400" full-function-log.txt \
            | tail -n 50 \
            | tee onboarding-error.txt || true
          echo "Firebase log command exit code: $log_status"
          if [[ ! -s onboarding-error.txt ]]; then
            echo "No matching sanitized onboarding error lines found. Showing only Firebase CLI diagnostic lines:"
            grep -E "Error:|error|failed|not found|permission" full-function-log.txt | tail -n 20 || true
          fi
