name: Merge verified Release 1

on:
  push:
    branches:
      - ops/merge-release1-20260901
    paths:
      - .github/workflows/merge-release1-20260901.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Squash merge verified Release 1
    runs-on: ubuntu-latest
    steps:
      - name: Merge PR 168 at exact verified head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: b6650e5add9d6661d8dc3500c3652ba2ad713b82
        run: |
          set -euo pipefail
          current_head="$(gh api repos/${{ github.repository }}/pulls/168 --jq .head.sha)"
          if [[ "$current_head" != "$EXPECTED_HEAD" ]]; then
            echo "::error::PR #168 moved from $EXPECTED_HEAD to $current_head"
            exit 1
          fi
          gh api \
            --method PUT \
            repos/${{ github.repository }}/pulls/168/merge \
            -f sha="$EXPECTED_HEAD" \
            -f merge_method=squash \
            -f commit_title='Release 1: simplify Pipe Buyer entry flow (#168)' \
            -f commit_message='Verified Release 1 simple entry flow. Final validation run 33492537413 passed analyzer, full Flutter suite, repository release-contract tests, and both Functions codebases.' \
            --jq '{merged, message, sha}'
