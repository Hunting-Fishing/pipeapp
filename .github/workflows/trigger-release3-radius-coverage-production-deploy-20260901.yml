name: Trigger Release 3 Radius Coverage production deploy

on:
  push:
    branches:
      - ops/deploy-release3-radius-coverage-8bdb619d
    paths:
      - .github/workflows/trigger-release3-radius-coverage-production-deploy-20260901.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch protected production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml \
            --repo Hunting-Fishing/pipeapp \
            --ref main \
            -f environment=production \
            -f commit_sha=8bdb619d7dcadcd6eb4a052cde27c14e0fb6340d \
            -f app_check_mode=enforce
