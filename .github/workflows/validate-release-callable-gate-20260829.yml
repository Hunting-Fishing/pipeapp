name: Validate release callable gate 2026-08-29

on:
  push:
    branches:
      - fix/release-callable-gate-20260829

permissions:
  contents: write

concurrency:
  group: release-callable-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7.0.0
        with:
          ref: fix/release-callable-gate-20260829
          fetch-depth: 0

      - name: Apply deterministic integration repair
        run: python3 tool/repair_callable_payment_gate_20260829.py

      - name: Install Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            firebase/functions/package-lock.json
            firebase/agent-functions/package-lock.json

      - name: Install Java 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Functions dependencies
        run: |
          npm ci --prefix firebase/functions
          npm ci --prefix firebase/agent-functions

      - name: Validate Functions
        run: |
          npm run lint --prefix firebase/functions
          npm run check --prefix firebase/functions
          npm test --prefix firebase/functions

      - name: Prepare emulator-only payment secrets
        shell: bash
        run: |
          cat > firebase/functions/.secret.local <<'EOF'
          STRIPE_SECRET_KEY=sk_test_pipe_buyer_emulator_only
          STRIPE_SECRET_PRODUCTION=sk_test_pipe_buyer_production_binding_emulator_only
          STRIPE_WEBHOOK_SECRET=whsec_pipe_buyer_emulator_only
          EOF

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.25.0 --no-audit --no-fund

      - name: Run authenticated callable integration
        shell: bash
        env:
          PIPE_ENFORCE_APP_CHECK: "false"
        run: |
          set -o pipefail
          firebase emulators:exec \
            --project demo-pipe-buyer-integration \
            --config firebase.json \
            --only auth,firestore,functions,storage \
            "node firebase/functions/integration/callable_integration.mjs" \
            2>&1 | tee callable-integration.log

      - name: Commit validated integration repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- firebase/functions/integration/callable_integration.mjs; then
            echo "Integration repair is already committed."
            exit 0
          fi
          git config user.name "Pipe Buyer Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add firebase/functions/integration/callable_integration.mjs
          git commit -m "Align callable integration with payment completion gate"
          git push origin HEAD:fix/release-callable-gate-20260829

      - name: Upload callable integration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-callable-gate-log
          path: callable-integration.log
          if-no-files-found: warn
          retention-days: 3
