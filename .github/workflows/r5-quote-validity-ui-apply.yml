name: R5 Quote V2 B2 UI apply

on:
  push:
    branches:
      - feature/r5-dispatch-provider-inbox-20260911

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/r5-dispatch-provider-inbox-20260911

      - name: Parse guarded UI transform
        run: node --check tool/apply_r5_quote_validity_ui.mjs

      - name: Apply guarded UI transform
        run: node tool/apply_r5_quote_validity_ui.mjs

      - name: Verify patch whitespace
        run: git diff --check

      - name: Commit UI integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/marketplace/marketplace_dispatch_page.dart
          if git diff --cached --quiet; then
            echo "UI already integrated."
            exit 0
          fi
          git commit -m "Integrate Quote V2 B2 cancellation and validity UI"
          git push origin HEAD:feature/r5-dispatch-provider-inbox-20260911
