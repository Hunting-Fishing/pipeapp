name: Dispatch canonical P1 production release 2026-09-01

on:
  push:
    branches:
      - feature/p1-user-blocking-build-plan-20260901

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-p1-production-release-20260901
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch verified production release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical Firebase production workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 0dd8f9c4ab69868b4b8fc8e6cb2c05dbf1ca80de
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f environment=production \
            -f commit_sha="$RELEASE_SHA" \
            -f app_check_mode=enforce
          {
            echo "Dispatched production release for: $RELEASE_SHA"
            echo "App Check mode: enforce"
          } >> "$GITHUB_STEP_SUMMARY"
