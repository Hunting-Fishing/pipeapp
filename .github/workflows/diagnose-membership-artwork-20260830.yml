name: Validate Membership Firebase Lazy Repair

on:
  push:
    branches:
      - diagnose/membership-artwork-20260830

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact repair source
        uses: actions/checkout@v7.0.0
        with:
          ref: 9d74b969c5f42e37473d3679e78b159a992ffeb3

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Restore Flutter dependencies
        run: flutter pub get

      - name: Analyze application and tests
        run: dart analyze lib test

      - name: Run repaired regression tests
        run: >
          flutter test
          test/marketplace_command_client_test.dart
          test/membership_plan_artwork_responsive_test.dart
          test/marketplace_subscription_native_billing_contract_test.dart
          test/marketplace_subscription_billing_policy_test.dart
          --reporter expanded
          --concurrency=1
          --dart-define=PIPE_ENV=continuous-integration
          --dart-define=PIPE_RELEASE_SHA=9d74b969c5f42e37473d3679e78b159a992ffeb3

      - name: Run full Flutter suite
        run: >
          flutter test
          --dart-define=PIPE_ENV=continuous-integration
          --dart-define=PIPE_RELEASE_SHA=9d74b969c5f42e37473d3679e78b159a992ffeb3
