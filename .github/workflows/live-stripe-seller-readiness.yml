name: Live Stripe seller readiness

on:
  workflow_dispatch:
  push:
    branches:
      - acceptance/live-stripe-seller-readiness-20260829
    paths:
      - ".github/workflows/live-stripe-seller-readiness.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify connected seller readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_PROJECT_ID: flutter-flow-pipe
      EXPECTED_STRIPE_ACCOUNT: acct_1U2QmKDkO07WMXyR

    steps:
      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.25.0 --no-audit --no-fund

      - name: Read live Stripe seller readiness
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          firebase functions:secrets:access STRIPE_SECRET_PRODUCTION \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" | tail -n 1 > .stripe-key

          node <<'NODE'
          const fs = require('node:fs');
          const key = fs.readFileSync('.stripe-key', 'utf8').trim();
          const expected = process.env.EXPECTED_STRIPE_ACCOUNT;

          async function stripe(path) {
            const response = await fetch(`https://api.stripe.com${path}`, {
              headers: {
                Authorization: `Bearer ${key}`,
                'Stripe-Version': '2026-08-26.dahlia',
              },
            });
            const payload = await response.json();
            if (!response.ok) {
              throw new Error(`Stripe read failed (${response.status}) for ${path}.`);
            }
            return payload;
          }

          async function listRecipientAccounts() {
            const accounts = [];
            let nextPath = '/v2/core/accounts?' + new URLSearchParams({
              limit: '100',
              'applied_configurations[0]': 'recipient',
            }).toString();
            while (nextPath) {
              const page = await stripe(nextPath);
              const data = Array.isArray(page.data) ? page.data : [];
              const expanded = await Promise.all(data.map((account) => {
                const qs = new URLSearchParams({
                  'include[0]': 'configuration.recipient',
                  'include[1]': 'defaults',
                  'include[2]': 'requirements',
                });
                return stripe(`/v2/core/accounts/${encodeURIComponent(account.id)}?${qs}`);
              }));
              accounts.push(...expanded);
              nextPath = String(page.next_page_url || '');
            }
            return accounts;
          }

          (async () => {
            const [platform, balance, accounts] = await Promise.all([
              stripe('/v1/account'),
              stripe('/v1/balance'),
              listRecipientAccounts(),
            ]);

            if (String(platform.id || '') !== expected) {
              throw new Error('Production Stripe secret does not belong to the expected Pipe Buyer platform account.');
            }
            if (balance.livemode !== true) {
              throw new Error('Production Stripe credential is not live mode.');
            }

            const summaries = accounts.map((account) => {
              const requirements = account.requirements || {};
              const recipient = account.configuration && account.configuration.recipient || {};
              const stripeBalance = recipient.capabilities && recipient.capabilities.stripe_balance || {};
              const transfer = stripeBalance.stripe_transfers || {};
              const responsibilities = account.defaults && account.defaults.responsibilities || {};
              const currentlyDue = Array.isArray(requirements.currently_due) ? requirements.currently_due.length : 0;
              const pastDue = Array.isArray(requirements.past_due) ? requirements.past_due.length : 0;
              const pendingVerification = Array.isArray(requirements.pending_verification) ? requirements.pending_verification.length : 0;
              const recipientConfigured = account.object === 'v2.core.account' &&
                Array.isArray(account.applied_configurations) &&
                account.applied_configurations.includes('recipient') &&
                account.dashboard === 'express' &&
                responsibilities.fees_collector === 'application' &&
                responsibilities.losses_collector === 'application';
              const transfersActive = transfer.status === 'active';
              const ready = recipientConfigured && transfersActive &&
                currentlyDue === 0 &&
                pastDue === 0;
              return {
                ready,
                recipientConfigured,
                transfersActive,
                currentlyDue,
                pastDue,
                pendingVerification,
              };
            });

            const readyCount = summaries.filter((row) => row.ready).length;
            const transferActiveCount = summaries.filter((row) => row.transfersActive).length;
            const pendingRequirementsCount = summaries.filter((row) => row.currentlyDue > 0 || row.pastDue > 0 || row.pendingVerification > 0).length;
            const report = {
              platformLive: true,
              connectedSellerCount: summaries.length,
              transferActiveSellerCount: transferActiveCount,
              readySellerCount: readyCount,
              sellersWithPendingRequirements: pendingRequirementsCount,
            };

            fs.mkdirSync('build/acceptance', {recursive: true});
            fs.writeFileSync('build/acceptance/live-stripe-seller-readiness.json', JSON.stringify(report, null, 2) + '\n');

            const summary = process.env.GITHUB_STEP_SUMMARY;
            fs.appendFileSync(summary,
              `## Live Stripe seller readiness\n\n` +
              `- Platform account verified: \`${expected}\`\n` +
              `- Live mode: \`true\`\n` +
              `- Connected sellers: \`${report.connectedSellerCount}\`\n` +
              `- Transfer-active sellers: \`${report.transferActiveSellerCount}\`\n` +
              `- Fully ready sellers: \`${report.readySellerCount}\`\n` +
              `- Sellers with pending requirements: \`${report.sellersWithPendingRequirements}\`\n` +
              `- Financial mutations: \`none\`\n`);

            console.log(JSON.stringify(report));
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

          rm -f .stripe-key

      - name: Retain sanitized readiness evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: live-stripe-seller-readiness-${{ github.run_id }}
          path: build/acceptance/live-stripe-seller-readiness.json
          retention-days: 30
          if-no-files-found: error
