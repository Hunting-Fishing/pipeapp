name: Bootstrap Stripe Production Webhook

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-stripe-webhook.yml"
      - "firebase/functions/stripe_webhook_event_catalog.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bind and verify Stripe production webhook
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_PROJECT_ID: flutter-flow-pipe
      EXPECTED_STRIPE_ACCOUNT: acct_1U2QmKDkO07WMXyR
      WEBHOOK_URL: https://us-central1-flutter-flow-pipe.cloudfunctions.net/stripeMarketplaceWebhook

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0

      - name: Install Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Restore and validate marketplace Functions
        run: |
          npm ci --prefix firebase/functions
          npm audit --omit=dev --audit-level=high --prefix firebase/functions
          npm run lint --prefix firebase/functions
          npm run check --prefix firebase/functions

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.25.0 --no-audit --no-fund

      - name: Prepare and validate Stripe production credential without logging value
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          firebase functions:secrets:access STRIPE_SECRET_PRODUCTION \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" | tail -n 1 > .stripe-api-key
          if [[ ! -s .stripe-api-key ]]; then
            echo "::error::STRIPE_SECRET_PRODUCTION could not be read from Firebase Secret Manager."
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const key = fs.readFileSync('.stripe-api-key', 'utf8').trim();
          async function stripe(path) {
            const response = await fetch(`https://api.stripe.com${path}`, {
              headers: {Authorization: `Bearer ${key}`},
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(`Stripe credential validation failed (${response.status}).`);
            return payload;
          }
          (async () => {
            const [account, balance] = await Promise.all([stripe('/v1/account'), stripe('/v1/balance')]);
            if (String(account.id || '') !== process.env.EXPECTED_STRIPE_ACCOUNT) {
              throw new Error('Firebase STRIPE_SECRET_PRODUCTION does not belong to the Pipe Buyer Stripe account.');
            }
            if (balance.livemode !== true) {
              throw new Error('Firebase STRIPE_SECRET_PRODUCTION is not a LIVE-mode credential.');
            }
            console.log('Pipe Buyer live Stripe production credential verified.');
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Resolve Stripe webhook endpoint and signing secret
        id: endpoint
        shell: bash
        run: |
          set -euo pipefail
          if firebase functions:secrets:get STRIPE_WEBHOOK_SECRET \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --json > /dev/null 2>&1; then
            firebase functions:secrets:access STRIPE_WEBHOOK_SECRET \
              --project "$FIREBASE_PROJECT_ID" \
              --token "$FIREBASE_TOKEN" | tail -n 1 > .stripe-webhook-secret
            HAS_SECRET=true
          else
            HAS_SECRET=false
          fi
          export HAS_SECRET
          node <<'NODE'
          const fs = require('node:fs');
          const {STRIPE_WEBHOOK_EVENTS: events} = require('./firebase/functions/stripe_webhook_event_catalog');
          const key = fs.readFileSync('.stripe-api-key', 'utf8').trim();
          const webhookUrl = process.env.WEBHOOK_URL;
          const auth = {Authorization: `Bearer ${key}`, 'Stripe-Version': '2026-06-24.dahlia'};
          const description = 'Pipe Buyer production marketplace, subscription, refund, and dispute webhook';
          async function stripe(path, options = {}) {
            const response = await fetch(`https://api.stripe.com${path}`, {
              ...options,
              headers: {...auth, ...(options.headers || {})},
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(`Stripe request failed (${response.status}).`);
            return payload;
          }
          (async () => {
            const listed = await stripe('/v1/webhook_endpoints?limit=100');
            const matches = (listed.data || []).filter((item) => item.url === webhookUrl);
            let endpoint;
            let created = false;

            if (process.env.HAS_SECRET === 'true') {
              if (matches.length !== 1) {
                throw new Error(
                  `Expected exactly one Pipe Buyer webhook endpoint while a signing secret exists; found ${matches.length}. Refusing automatic delete/recreate.`,
                );
              }
              endpoint = matches[0];
              if (endpoint.livemode !== true) throw new Error('Existing webhook endpoint is not live-mode.');
              // Keep the established endpoint enabled with its established event
              // set while the backward-compatible new handler is deployed.
            } else {
              if (matches.length !== 0) {
                throw new Error(
                  'A Pipe Buyer webhook endpoint exists but Firebase has no matching signing secret. Refusing automatic replacement; reconcile the secret manually.',
                );
              }
              const form = new URLSearchParams();
              form.set('url', webhookUrl);
              form.set('description', description);
              form.set('api_version', '2026-06-24.dahlia');
              form.set('connect', 'false');
              for (const event of events) form.append('enabled_events[]', event);
              endpoint = await stripe('/v1/webhook_endpoints', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: form.toString(),
              });
              created = true;
              if (endpoint.livemode !== true) throw new Error('Stripe created a non-live webhook endpoint.');
              if (!String(endpoint.secret || '').startsWith('whsec_')) {
                throw new Error('Stripe did not return a webhook signing secret at creation.');
              }
              fs.writeFileSync('.stripe-webhook-secret', String(endpoint.secret), {mode: 0o600});

              // Stripe creates endpoints enabled. With no prior endpoint there is
              // no live webhook path to preserve, so immediately hold this new
              // endpoint until its signing secret is deployed and probed.
              const hold = new URLSearchParams();
              hold.set('disabled', 'true');
              endpoint = await stripe(`/v1/webhook_endpoints/${encodeURIComponent(endpoint.id)}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: hold.toString(),
              });
              if (endpoint.status !== 'disabled') {
                throw new Error('New Stripe webhook endpoint could not be held for verification.');
              }
            }

            if (!String(endpoint.id || '').startsWith('we_')) {
              throw new Error('Stripe returned an invalid webhook endpoint id.');
            }
            fs.writeFileSync('.stripe-webhook-endpoint-id', String(endpoint.id), {mode: 0o600});
            fs.writeFileSync('.stripe-webhook-created', created ? 'true' : 'false', {mode: 0o600});
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
          endpoint_id="$(cat .stripe-webhook-endpoint-id)"
          created="$(cat .stripe-webhook-created)"
          echo "endpoint_id=$endpoint_id" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"
          if [[ "$created" == "true" ]]; then
            echo "New Stripe endpoint created and held disabled pending verification: $endpoint_id" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Existing Stripe endpoint preserved during handler deployment: $endpoint_id" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Store Stripe webhook signing secret in Firebase Secret Manager
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s .stripe-webhook-secret ]]; then
            echo "::error::Webhook signing secret file is unavailable."
            exit 1
          fi
          firebase functions:secrets:set STRIPE_WEBHOOK_SECRET \
            --data-file .stripe-webhook-secret \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive > /dev/null
          echo "STRIPE_WEBHOOK_SECRET configured in Firebase Secret Manager." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy webhook function only
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --config firebase.json \
            --only functions:marketplace:stripeMarketplaceWebhook \
            --message "Pipe Buyer Stripe webhook $GITHUB_SHA" \
            --non-interactive

      - name: Verify signed webhook round trip
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const secret = fs.readFileSync('.stripe-webhook-secret', 'utf8').trim();
          const timestamp = Math.floor(Date.now() / 1000);
          const payload = JSON.stringify({
            id: `evt_pipebuyer_readiness_${Date.now()}`,
            object: 'event',
            type: 'pipebuyer.production_readiness.probe',
            data: {object: {id: 'pipebuyer_readiness_probe'}},
          });
          const signature = crypto.createHmac('sha256', secret)
            .update(`${timestamp}.${payload}`)
            .digest('hex');
          (async () => {
            const response = await fetch(process.env.WEBHOOK_URL, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Stripe-Signature': `t=${timestamp},v1=${signature}`,
              },
              body: payload,
            });
            const text = await response.text();
            if (!response.ok || !['OK', 'Already processed'].includes(text.trim())) {
              throw new Error(`Signed webhook probe failed with HTTP ${response.status}.`);
            }
            console.log('Signed webhook probe passed.');
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Synchronize approved events and enable verified Stripe endpoint
        shell: bash
        run: |
          set -euo pipefail
          export ENDPOINT_ID="${{ steps.endpoint.outputs.endpoint_id }}"
          node <<'NODE'
          const fs = require('node:fs');
          const {STRIPE_WEBHOOK_EVENTS: events} = require('./firebase/functions/stripe_webhook_event_catalog');
          const key = fs.readFileSync('.stripe-api-key', 'utf8').trim();
          const description = 'Pipe Buyer production marketplace, subscription, refund, and dispute webhook';
          const form = new URLSearchParams();
          form.set('disabled', 'false');
          form.set('description', description);
          for (const event of events) form.append('enabled_events[]', event);
          (async () => {
            const response = await fetch(
              `https://api.stripe.com/v1/webhook_endpoints/${encodeURIComponent(process.env.ENDPOINT_ID)}`,
              {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${key}`,
                  'Stripe-Version': '2026-06-24.dahlia',
                  'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: form.toString(),
              },
            );
            const payload = await response.json();
            const expected = [...events].sort();
            const actual = Array.isArray(payload.enabled_events) ? [...payload.enabled_events].sort() : [];
            const eventsMatch = expected.length === actual.length &&
              expected.every((event, index) => event === actual[index]);
            if (!response.ok || payload.status !== 'enabled' || payload.livemode !== true || !eventsMatch) {
              throw new Error(`Stripe endpoint event synchronization failed (${response.status}).`);
            }
            console.log('Stripe production webhook endpoint enabled with verified event catalog.');
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
          echo "Stripe webhook endpoint event catalog expanded only after deployed-handler verification." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local credential files
        if: always()
        shell: bash
        run: |
          rm -f .stripe-api-key .stripe-webhook-secret .stripe-webhook-endpoint-id .stripe-webhook-created
