name: Dispatch Release 2 production

on:
  push:
    branches:
      - ops/deploy-release2-d1022172
    paths:
      - .github/workflows/dispatch-release2-production-20260901.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch canonical protected production release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy.yml for exact Release 2 SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: d102217292785bfb5cb76977f019cc9866b93ae0
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches \
            -f ref=main \
            -f 'inputs[environment]=production' \
            -f "inputs[commit_sha]=$RELEASE_SHA" \
            -f 'inputs[app_check_mode]=enforce'
          echo "Dispatched canonical production release for $RELEASE_SHA"
