name: Apply Dispatch fee recipient clarification

on:
  push:
    branches:
      - release/clarify-dispatch-fee-recipient
    paths:
      - .github/workflows/apply-dispatch-fee-recipient-clarification.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/clarify-dispatch-fee-recipient
          fetch-depth: 0
      - name: Apply guarded wording update
        run: python tool/apply_dispatch_fee_recipient_clarification.py
      - name: Commit corrected wording
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/marketplace/marketplace_dispatch_onboarding.dart test/marketplace_dispatch_onboarding_test.dart
          git diff --cached --check
          git commit -m "Clarify Pipebuddy Dispatch fee recipient"
          git push origin HEAD:release/clarify-dispatch-fee-recipient
