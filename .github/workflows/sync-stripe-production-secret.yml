name: Sync Stripe Production Secret

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-stripe-production-secret.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Validate and sync Pipe Buyer live Stripe secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_PROJECT_ID: flutter-flow-pipe
      EXPECTED_STRIPE_ACCOUNT: acct_1U2QmKDkO07WMXyR
      STRIPE_PRODUCTION_VALUE: ${{ secrets.STRIPE_SECRET_PRODUCTION }}

    steps:
      - name: Install Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.25.0 --no-audit --no-fund

      - name: Validate GitHub production Stripe secret privately
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${STRIPE_PRODUCTION_VALUE:-}" ]]; then
            echo "::error::GitHub production secret STRIPE_SECRET_PRODUCTION is not configured."
            exit 1
          fi
          umask 077
          printf '%s' "$STRIPE_PRODUCTION_VALUE" > .stripe-production-key
          node <<'NODE'
          const fs = require('node:fs');
          const key = fs.readFileSync('.stripe-production-key', 'utf8').trim();
          async function stripe(path) {
            const response = await fetch(`https://api.stripe.com${path}`, {
              headers: {Authorization: `Bearer ${key}`},
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(`Stripe production credential validation failed (${response.status}).`);
            return payload;
          }
          (async () => {
            const [account, balance] = await Promise.all([
              stripe('/v1/account'),
              stripe('/v1/balance'),
            ]);
            if (String(account.id || '') !== process.env.EXPECTED_STRIPE_ACCOUNT) {
              throw new Error('GitHub STRIPE_SECRET_PRODUCTION belongs to a different Stripe account.');
            }
            if (balance.livemode !== true) {
              throw new Error('GitHub STRIPE_SECRET_PRODUCTION is not LIVE mode.');
            }
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              'GitHub STRIPE_SECRET_PRODUCTION: **Pipe Buyer LIVE account verified**\n',
            );
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Write production Stripe secret to Firebase Secret Manager
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:secrets:set STRIPE_SECRET_PRODUCTION \
            --data-file .stripe-production-key \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive > /dev/null
          echo "Firebase STRIPE_SECRET_PRODUCTION updated from verified GitHub production secret." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local credential file
        if: always()
        shell: bash
        run: rm -f .stripe-production-key
