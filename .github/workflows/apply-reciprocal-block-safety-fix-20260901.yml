name: Apply reciprocal Marketplace block safety fix 2026-09-01

on:
  push:
    branches:
      - feature/p1-user-blocking-build-plan-20260901

permissions:
  contents: write

concurrency:
  group: reciprocal-block-safety-fix-20260901
  cancel-in-progress: false

jobs:
  patch:
    name: Patch reciprocal block safety edge case
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7.0.0
        with:
          ref: feature/p1-user-blocking-build-plan-20260901

      - name: Install Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Restore Functions dependencies
        run: npm ci --prefix firebase/functions

      - name: Apply exact reciprocal-block repair
        shell: python
        run: |
          from pathlib import Path

          page = Path("lib/marketplace/marketplace_messages_page.dart")
          source = page.read_text(encoding="utf-8")

          replacements = {
              "enabled: !_blockBusy && !_blockedMe,": "enabled: !_blockBusy,",
              "if (_blockBusy || _blockedMe) return;": "if (_blockBusy) return;",
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}; found {count}")
              source = source.replace(old, new, 1)
          page.write_text(source, encoding="utf-8")

          test_file = Path("firebase/functions/test/marketplace_user_blocking_contract.test.js")
          tests = test_file.read_text(encoding="utf-8")
          marker = 'test("client permits reciprocal blocking when the other member blocked first"'
          if marker not in tests:
              tests += r'''

          test("client permits reciprocal blocking when the other member blocked first", () => {
            const messages = fs.readFileSync(
                require.resolve("../../../lib/marketplace/marketplace_messages_page.dart"),
                "utf8",
            );
            assert.match(messages, /enabled:\s*!_blockBusy,/);
            assert.match(messages, /if \(_blockBusy\) return;/);
            assert.doesNotMatch(
                messages,
                /enabled:\s*!_blockBusy\s*&&\s*!_blockedMe/,
            );
            assert.doesNotMatch(
                messages,
                /if\s*\(_blockBusy\s*\|\|\s*_blockedMe\)\s*return/,
            );
          });
          '''
              test_file.write_text(tests, encoding="utf-8")

      - name: Run user-blocking contract test
        run: node --test firebase/functions/test/marketplace_user_blocking_contract.test.js

      - name: Verify patch is limited to intended files
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          expected=$'firebase/functions/test/marketplace_user_blocking_contract.test.js\nlib/marketplace/marketplace_messages_page.dart'
          if [[ "$changed" != "$expected" ]]; then
            echo "::error::Unexpected patch scope"
            exit 1
          fi
          git diff --check

      - name: Commit reciprocal-block repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase/functions/test/marketplace_user_blocking_contract.test.js lib/marketplace/marketplace_messages_page.dart
          git commit -m "Allow reciprocal Marketplace blocking"
          git push origin HEAD:feature/p1-user-blocking-build-plan-20260901
