name: Formal Fast Gate

on:
  push:
    branches:
      - design/formal-beautification-foundation
  pull_request:
    branches:
      - design/formal-beautification-foundation

permissions:
  contents: read

concurrency:
  group: formal-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out formal branch source
        uses: actions/checkout@v7

      - name: Install pinned Node runtime
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Restore Firebase Functions dependencies
        run: npm ci --prefix firebase/functions

      - name: Restore Flutter dependencies
        run: flutter pub get

      - name: Validate JavaScript and demo-auth control syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find tool -maxdepth 1 -type f \( -name '*.mjs' -o -name '*.cjs' \) -print0)
          node --check firebase/functions/scripts/verify_formal_demo_auth_passwords.mjs
          node --check firebase/functions/scripts/ensure_formal_demo_auth.js
          node --check firebase/functions/dispatch_credential_monitor.js
          node --check firebase/functions/index.js
          node --check firebase/functions/notification_delivery_policy.js

      - name: Validate every Pipe Buyer PowerShell tool control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(Get-ChildItem -LiteralPath tool -Filter '*.ps1' -File -Recurse)
          if ($scripts.Count -eq 0) {
            throw 'No PowerShell tools found under tool/.'
          }
          $foreignControlPattern = '(?mi)^\s*(elif|fi|then)\b'
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              $details = ($parseErrors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell parse failed for $($script.FullName): $details"
            }
            $raw = Get-Content -LiteralPath $script.FullName -Raw
            $foreignMatch = [regex]::Match($raw, $foreignControlPattern)
            if ($foreignMatch.Success) {
              throw "PowerShell control contains foreign shell keyword '$($foreignMatch.Groups[1].Value)' in $($script.FullName)."
            }
            $badCommands = @(
              $ast.FindAll({
                param($node)
                if ($node -isnot [System.Management.Automation.Language.CommandAst]) { return $false }
                $name = $node.GetCommandName()
                return $name -in @('elif', 'fi')
              }, $true)
            )
            if ($badCommands.Count -gt 0) {
              throw "PowerShell control would execute invalid shell command '$($badCommands[0].GetCommandName())' in $($script.FullName)."
            }
          }
          Write-Host "PowerShell tools validated: $($scripts.Count)"

      - name: Dispatch credential reminder policy
        run: |
          node --test firebase/functions/test/dispatch_credential_monitor.test.js
          node --test firebase/functions/test/notification_delivery_policy.test.js

      - name: Strict Dart analyzer
        run: dart analyze --fatal-infos --fatal-warnings lib test

      - name: Dispatch quote planner contract
        shell: bash
        run: |
          set -euo pipefail
          if [ -f test/dispatch_quote_planner_source_map_units_contract_test.dart ]; then
            flutter test test/dispatch_quote_planner_source_map_units_contract_test.dart
          fi

      - name: Dispatch Phase 3 profile privacy and persistence contracts
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          for file in \
            test/marketplace_dispatch_company_profile_test.dart \
            test/marketplace_dispatch_company_profile_persistence_contract_test.dart \
            test/marketplace_dispatch_geography_test.dart \
            test/marketplace_dispatch_service_area_persistence_contract_test.dart \
            test/service_area_geocoder_classification_test.dart \
            test/marketplace_dispatch_credentials_test.dart \
            test/marketplace_dispatch_credentials_privacy_contract_test.dart \
            test/marketplace_dispatch_credential_intelligence_test.dart
          do
            if [ -f "$file" ]; then tests+=("$file"); fi
          done
          if [ ${#tests[@]} -gt 0 ]; then
            flutter test "${tests[@]}"
          fi

      - name: Startup/auth control contracts
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          for file in \
            test/marketplace_root_auth_control_contract_test.dart \
            test/startup_auth_loading_surface_contract_test.dart \
            test/dispatch_auth_reactivity_contract_test.dart \
            test/marketplace_dispatch_navigation_test.dart
          do
            if [ -f "$file" ]; then tests+=("$file"); fi
          done
          if [ ${#tests[@]} -gt 0 ]; then
            flutter test "${tests[@]}"
          fi
