name: Trigger Release 3 production deploy

on:
  push:
    branches:
      - ops/deploy-release3-f980358c
    paths:
      - .github/workflows/trigger-release3-production-deploy-20260901.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch protected production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml \
            --repo Hunting-Fishing/pipeapp \
            --ref main \
            -f environment=production \
            -f commit_sha=f980358ca136202daca5617c94fa8fff7f3c64d0 \
            -f app_check_mode=enforce
