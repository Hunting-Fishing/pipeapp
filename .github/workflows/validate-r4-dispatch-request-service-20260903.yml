name: Validate R4 Dispatch Request Service

on:
  push:
    branches:
      - codex/r4-dispatch-request-service
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r4-dispatch-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: R4 protected validation
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out exact R4 source
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install Java 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Restore Flutter dependencies without lock drift
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum pubspec.lock | awk '{print $1}')"
          flutter pub get
          after="$(sha256sum pubspec.lock | awk '{print $1}')"
          if [[ "$before" != "$after" ]]; then
            git diff -- pubspec.lock
            echo "::error::flutter pub get changed pubspec.lock. Commit an exact reviewed lockfile before release."
            exit 1
          fi

      - name: Analyze application and tests
        run: dart analyze lib test

      - name: Run focused R4 Flutter contracts
        run: >
          flutter test
          test/marketplace_dispatch_request_flow_test.dart
          test/marketplace_dispatch_request_service_contract_test.dart
          test/marketplace_dispatch_request_cancellation_contract_test.dart
          test/marketplace_dispatch_direct_request_privacy_contract_test.dart

      - name: Run full Flutter test suite
        run: flutter test

      - name: Restore and validate Firebase Functions
        run: |
          npm ci --prefix firebase/functions
          npm run lint --prefix firebase/functions
          npm run check --prefix firebase/functions
          npm ci --prefix firebase/agent-functions
          npm run lint --prefix firebase/agent-functions
          npm run check --prefix firebase/agent-functions

      - name: Test release and Function parity controls
        run: |
          node --test tool/release_manifest_test.mjs
          node --test tool/function_parity_test.mjs

      - name: Restore Firebase rules tests
        run: npm ci --prefix firebase/rules-tests

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.25.0 --no-audit --no-fund

      - name: Test Firestore and Storage security rules
        run: >
          firebase emulators:exec
          --project demo-pipe-buyer-r4-rules
          --config firebase.json
          --only firestore,storage
          "npm test --prefix firebase/rules-tests"

      - name: Test authenticated callable workflows and retries
        env:
          PIPE_ENFORCE_APP_CHECK: "false"
        run: >
          firebase emulators:exec
          --project demo-pipe-buyer-r4-integration
          --config firebase.json
          --only auth,firestore,functions,storage
          "node firebase/functions/integration/callable_integration.mjs"

      - name: Build R4 web release candidate
        run: >
          flutter build web
          --release
          --dart-define=PIPE_ENV=verification
          --dart-define=PIPE_RELEASE_SHA=${{ github.sha }}

      - name: Confirm verification did not mutate tracked source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            git status --short
            echo "::error::R4 verification modified tracked repository source."
            exit 1
          fi
