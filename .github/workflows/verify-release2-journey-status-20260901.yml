# Verification guard includes formatter output from the two new bounded Dart files.
name: Verify Release 2 marketplace journey status

on:
  push:
    branches:
      - feature/release-2-marketplace-journey-status-20260901
    paths:
      - .github/workflows/verify-release2-journey-status-20260901.yml

permissions:
  contents: write

jobs:
  verify:
    name: Build and verify Marketplace journey status slice
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FUNCTIONS_DISCOVERY_TIMEOUT: "30000"

    steps:
      - name: Check out Release 2 branch
        uses: actions/checkout@v7.0.0
        with:
          ref: feature/release-2-marketplace-journey-status-20260901
          fetch-depth: 0

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install Functions Node runtime
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            firebase/functions/package-lock.json
            firebase/agent-functions/package-lock.json

      - name: Apply guarded Release 2 integration
        run: python3 tool/apply_release2_journey_status_20260901.py

      - name: Format only new bounded Release 2 files
        run: >
          dart format
          lib/marketplace/marketplace_journey_status.dart
          test/marketplace_journey_status_test.dart

      - name: Verify integration mutation scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          allowed=(
            lib/marketplace/marketplace_journey_status.dart
            test/marketplace_journey_status_test.dart
            lib/marketplace/marketplace_messages_page.dart
            lib/marketplace/marketplace_auction_settlement.dart
          )
          for path in "${changed[@]}"; do
            permitted=false
            for candidate in "${allowed[@]}"; do
              if [[ "$path" == "$candidate" ]]; then
                permitted=true
                break
              fi
            done
            if [[ "$permitted" != true ]]; then
              echo "Unexpected Release 2 mutation: $path"
              exit 1
            fi
          done
          for required in \
            lib/marketplace/marketplace_messages_page.dart \
            lib/marketplace/marketplace_auction_settlement.dart; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$required" || {
              echo "Missing required integration change: $required"
              exit 1
            }
          done

      - name: Restore Flutter dependencies
        run: flutter pub get

      - name: Analyze application and tests
        run: dart analyze lib test

      - name: Run focused journey tests
        run: >
          flutter test
          test/marketplace_journey_status_test.dart
          test/marketplace_offer_commerce_summary_test.dart
          test/marketplace_offer_schedule_test.dart
          test/marketplace_secure_payment_review_policy_test.dart
          test/marketplace_timed_buying_presentation_test.dart
          test/marketplace_timed_buying_trust_test.dart

      - name: Run full Flutter regression
        run: >
          flutter test
          --dart-define=PIPE_ENV=continuous-integration
          --dart-define=PIPE_RELEASE_SHA=${{ github.sha }}

      - name: Run repository release-contract tests
        run: >
          node --test
          tool/oauth_branding_test.mjs
          tool/release_manifest_test.mjs
          tool/function_parity_test.mjs
          tool/phase1_acceptance_test.mjs
          tool/prepare_phase1_acceptance_test.mjs
          tool/configure_firebase_messaging_worker_test.mjs

      - name: Restore Functions dependencies
        run: |
          npm ci --prefix firebase/functions
          npm ci --prefix firebase/agent-functions

      - name: Validate Functions
        run: |
          npm run lint --prefix firebase/functions
          npm run check --prefix firebase/functions
          npm run lint --prefix firebase/agent-functions
          npm run check --prefix firebase/agent-functions

      - name: Check source diff formatting
        run: git diff --check

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pipe Buyer Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            lib/marketplace/marketplace_journey_status.dart \
            test/marketplace_journey_status_test.dart \
            lib/marketplace/marketplace_messages_page.dart \
            lib/marketplace/marketplace_auction_settlement.dart
          if git diff --cached --quiet; then
            echo "::error::Release 2 verification produced no source changes to commit."
            exit 1
          fi
          git commit -m 'Release 2: surface Marketplace next actions'
          git push origin HEAD:feature/release-2-marketplace-journey-status-20260901
