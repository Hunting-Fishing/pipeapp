name: Complete Stripe Live Alignment Custom Header 2026-08-29

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/complete-stripe-live-alignment-custom-header-2026-08-29.yml"

permissions:
  contents: read

concurrency:
  group: pipe-buyer-stripe-live-alignment-custom-header-2026-08-29
  cancel-in-progress: false

jobs:
  complete:
    name: Activate billing and publish verified policy hashes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_PROJECT_ID: flutter-flow-pipe
      EXPECTED_STRIPE_ACCOUNT: acct_1U2QmKDkO07WMXyR
      STRIPE_WEBHOOK_URL: https://us-central1-flutter-flow-pipe.cloudfunctions.net/stripeMarketplaceWebhook
      ACTIVATION_URL: https://us-central1-flutter-flow-pipe.cloudfunctions.net/productionBillingActivation
      POLICY_PUBLISH_URL: https://us-central1-flutter-flow-pipe.cloudfunctions.net/productionPolicyPublication
      TERMS_URL: https://www.pipebuyer.com/terms
      PRIVACY_URL: https://www.pipebuyer.com/privacy

    steps:
      - name: Check out exact completion source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Confirm completion source is current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Checked-out source does not match the completion SHA."
            exit 1
          fi
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "::error::Completion workflow only runs for current main."
            exit 1
          fi

      - name: Install Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Validate Functions and install Firebase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix firebase/functions
          npm audit --omit=dev --audit-level=high --prefix firebase/functions
          npm run lint --prefix firebase/functions
          npm run check --prefix firebase/functions
          npm install --global firebase-tools@15.25.0 --no-audit --no-fund

      - name: Verify live Pipe Buyer Stripe account and webhook
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          firebase functions:secrets:access STRIPE_SECRET_PRODUCTION \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" | tail -n 1 > .stripe-key
          firebase functions:secrets:get STRIPE_WEBHOOK_SECRET \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --json > /dev/null
          node <<'NODE'
          const fs = require('node:fs');
          const key = fs.readFileSync('.stripe-key', 'utf8').trim();
          const expected = process.env.EXPECTED_STRIPE_ACCOUNT;
          const webhookUrl = process.env.STRIPE_WEBHOOK_URL;
          async function stripe(path) {
            const response = await fetch(`https://api.stripe.com${path}`, {
              headers: {Authorization: `Bearer ${key}`},
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(`Stripe validation failed (${response.status}).`);
            return payload;
          }
          (async () => {
            const [account, balance, endpoints] = await Promise.all([
              stripe('/v1/account'),
              stripe('/v1/balance'),
              stripe('/v1/webhook_endpoints?limit=100'),
            ]);
            if (String(account.id || '') !== expected || balance.livemode !== true) {
              throw new Error('Pipe Buyer live Stripe account validation failed.');
            }
            const endpoint = (endpoints.data || []).find((item) =>
              item.url === webhookUrl && item.status === 'enabled' && item.livemode === true);
            if (!endpoint) throw new Error('Verified Pipe Buyer live webhook is not enabled.');
            console.log('Pipe Buyer live Stripe account and webhook verified.');
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Verify live Terms and Privacy exactly match source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$TERMS_URL" -o /tmp/pipebuyer-terms-live.html
          curl --fail --silent --show-error --location "$PRIVACY_URL" -o /tmp/pipebuyer-privacy-live.html
          source_terms_sha="$(sha256sum web/terms.html | awk '{print $1}')"
          source_privacy_sha="$(sha256sum web/privacy.html | awk '{print $1}')"
          live_terms_sha="$(sha256sum /tmp/pipebuyer-terms-live.html | awk '{print $1}')"
          live_privacy_sha="$(sha256sum /tmp/pipebuyer-privacy-live.html | awk '{print $1}')"
          if [[ "$source_terms_sha" != "$live_terms_sha" ]]; then
            echo "::error::Live Terms content does not match completion source."
            exit 1
          fi
          if [[ "$source_privacy_sha" != "$live_privacy_sha" ]]; then
            echo "::error::Live Privacy content does not match completion source."
            exit 1
          fi
          printf '%s' "$source_terms_sha" > .terms-sha
          printf '%s' "$source_privacy_sha" > .privacy-sha
          echo "Live Terms and Privacy exactly match source bytes."

      - name: Prepare one-time billing activation token
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 32 > .activation-token
          firebase functions:secrets:set PIPE_BILLING_ACTIVATION_TOKEN \
            --data-file .activation-token \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive > /dev/null

      - name: Build temporary billing activator with custom application header
        shell: bash
        run: |
          set -euo pipefail
          cat > firebase/functions/production_billing_activation_temp.js <<'EOF'
          "use strict";

          const crypto = require("node:crypto");

          function safeTokenMatch(provided, expected) {
            const left = Buffer.from(String(provided || ""));
            const right = Buffer.from(String(expected || ""));
            return left.length === right.length &&
              left.length > 0 && crypto.timingSafeEqual(left, right);
          }

          function createProductionBillingActivation(admin) {
            const db = admin.firestore();
            const FieldValue = admin.firestore.FieldValue;
            return async (req, res) => {
              try {
                if (req.method !== "POST") {
                  res.status(405).send("Method not allowed");
                  return;
                }
                const expected = String(process.env.PIPE_BILLING_ACTIVATION_TOKEN || "");
                const provided = String(req.get("x-pipebuyer-activation-token") || "");
                if (!safeTokenMatch(provided, expected)) {
                  res.status(403).send("Forbidden");
                  return;
                }
                const readinessRef = db.collection("platform_configuration")
                    .doc("payment_provider_readiness");
                const phaseRef = db.collection("platform_configuration")
                    .doc("phase1_features");
                const auditRef = db.collection("payment_readiness_audit").doc();
                const result = await db.runTransaction(async (transaction) => {
                  const [readinessSnapshot, phaseSnapshot] = await Promise.all([
                    transaction.get(readinessRef),
                    transaction.get(phaseRef),
                  ]);
                  const currentReadiness = readinessSnapshot.exists ?
                    readinessSnapshot.data() : {};
                  const currentPhase = phaseSnapshot.exists ? phaseSnapshot.data() : {};
                  const readinessRevision = Math.max(
                    0, Number(currentReadiness.revision || 0),
                  ) + 1;
                  const phaseRevision = Math.max(
                    0, Number(currentPhase.revision || 0),
                  ) + 1;
                  const readiness = {
                    stripeMode: "production",
                    stripeConnectOnboardingEnabled: true,
                    stripeCheckoutEnabled: false,
                    stripeFeeBillingEnabled: true,
                    stripeSubscriptionsEnabled: true,
                    stripeWebhookVerified: true,
                    stripeTaxReady: false,
                    stripeTaxRegistrationPending: true,
                    stripeReconciliationReady: true,
                    affiliatePayoutsEnabled: false,
                    marketplaceFinancialResolutionEnabled: false,
                    marketplaceDisputeAutomationEnabled: false,
                    marketplaceDisputeEvidenceEnabled: false,
                    platformFundedRefundOverrideEnabled: false,
                    connectReturnUrl: "https://www.pipebuyer.com/?connect=return",
                    connectRefreshUrl: "https://www.pipebuyer.com/?connect=refresh",
                    checkoutSuccessUrl: "https://www.pipebuyer.com/?payment=success",
                    checkoutCancelUrl: "https://www.pipebuyer.com/?payment=cancel",
                    revision: readinessRevision,
                    lastChangedByUid: "system:github-production-activation",
                    lastChangeReason:
                      "Live Pipe Buyer billing enabled while CRA GST/HST registration is pending.",
                    updatedAt: FieldValue.serverTimestamp(),
                  };
                  transaction.set(readinessRef, readiness, {merge: false});
                  transaction.set(phaseRef, {
                    marketplace: true,
                    offers: true,
                    dispatch: true,
                    paidFeatures: true,
                    revision: phaseRevision,
                    updatedAt: FieldValue.serverTimestamp(),
                  }, {merge: true});
                  transaction.create(auditRef, {
                    administratorUid: "system:github-production-activation",
                    reason:
                      "Authorized live billing launch while Canadian tax registration is pending.",
                    revision: readinessRevision,
                    previous: currentReadiness,
                    next: readiness,
                    createdAt: FieldValue.serverTimestamp(),
                  });
                  return {
                    readinessRevision,
                    phaseRevision,
                    stripeMode: readiness.stripeMode,
                    stripeConnectOnboardingEnabled:
                      readiness.stripeConnectOnboardingEnabled,
                    stripeFeeBillingEnabled: readiness.stripeFeeBillingEnabled,
                    stripeSubscriptionsEnabled: readiness.stripeSubscriptionsEnabled,
                    stripeWebhookVerified: readiness.stripeWebhookVerified,
                    stripeCheckoutEnabled: readiness.stripeCheckoutEnabled,
                    stripeTaxRegistrationPending:
                      readiness.stripeTaxRegistrationPending,
                    stripeTaxReady: readiness.stripeTaxReady,
                  };
                });
                res.status(200).json({ok: true, result});
              } catch (error) {
                console.error("Production billing activation failed", error);
                res.status(500).json({ok: false});
              }
            };
          }

          module.exports = {createProductionBillingActivation};
          EOF
          cat >> firebase/functions/production_bootstrap.js <<'EOF'

          // Temporary release endpoint. Cloud infrastructure accepts invocation,
          // while a one-time custom application header authorizes the exact write.
          const {onRequest: onRequestActivation} = require("firebase-functions/v2/https");
          const {createProductionBillingActivation} = require("./production_billing_activation_temp");
          exports.productionBillingActivation = onRequestActivation(
              {
                secrets: ["PIPE_BILLING_ACTIVATION_TOKEN"],
                invoker: "public",
              },
              createProductionBillingActivation(createAdminRuntime()),
          );
          EOF
          node --check firebase/functions/production_billing_activation_temp.js
          node --check firebase/functions/production_bootstrap.js

      - name: Deploy one-time billing activator
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --config firebase.json \
            --only functions:marketplace:productionBillingActivation \
            --message "Pipe Buyer custom-header billing activation $GITHUB_SHA" \
            --force \
            --non-interactive

      - name: Activate and verify tax-pending billing profile
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat .activation-token)"
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 4 --retry-all-errors \
            -X POST \
            -H "X-PipeBuyer-Activation-Token: $token" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$ACTIVATION_URL" > activation-result.json
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('activation-result.json', 'utf8'));
          const result = payload && payload.result || {};
          if (payload.ok !== true ||
              result.stripeMode !== 'production' ||
              result.stripeConnectOnboardingEnabled !== true ||
              result.stripeFeeBillingEnabled !== true ||
              result.stripeSubscriptionsEnabled !== true ||
              result.stripeWebhookVerified !== true ||
              result.stripeCheckoutEnabled !== false ||
              result.stripeTaxRegistrationPending !== true ||
              result.stripeTaxReady !== false) {
            throw new Error('Production billing activation did not match the authorized pending-tax profile.');
          }
          console.log('Pipe Buyer production billing profile activated and verified.');
          NODE

      - name: Remove temporary billing activation endpoint
        if: always()
        shell: bash
        run: |
          firebase functions:delete productionBillingActivation \
            --region us-central1 \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --force || true
          rm -f .activation-token activation-result.json

      - name: Prepare one-time policy publication token
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl rand -hex 32 > .policy-publication-token
          firebase functions:secrets:set PIPE_POLICY_PUBLICATION_TOKEN \
            --data-file .policy-publication-token \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive > /dev/null

      - name: Build temporary exact-policy publisher with custom application header
        shell: bash
        run: |
          set -euo pipefail
          cat > firebase/functions/production_policy_publication_temp.js <<'EOF'
          "use strict";

          const crypto = require("node:crypto");

          function safeTokenMatch(provided, expected) {
            const left = Buffer.from(String(provided || ""));
            const right = Buffer.from(String(expected || ""));
            return left.length === right.length &&
              left.length > 0 && crypto.timingSafeEqual(left, right);
          }

          function validSha(value) {
            return /^[0-9a-f]{64}$/.test(String(value || ""));
          }

          function createProductionPolicyPublication(admin) {
            const db = admin.firestore();
            const FieldValue = admin.firestore.FieldValue;
            const Timestamp = admin.firestore.Timestamp;
            return async (req, res) => {
              try {
                if (req.method !== "POST") {
                  res.status(405).send("Method not allowed");
                  return;
                }
                const expected = String(process.env.PIPE_POLICY_PUBLICATION_TOKEN || "");
                const provided = String(req.get("x-pipebuyer-policy-token") || "");
                if (!safeTokenMatch(provided, expected)) {
                  res.status(403).send("Forbidden");
                  return;
                }
                const termsSha = String(req.body && req.body.termsSha || "").trim();
                const privacySha = String(req.body && req.body.privacySha || "").trim();
                if (!validSha(termsSha) || !validSha(privacySha)) {
                  res.status(400).json({ok: false, error: "Invalid policy hash."});
                  return;
                }
                const version = "2026-08-29";
                const actor = "system:github-stripe-live-alignment";
                const effectiveAt = Timestamp.fromDate(new Date("2026-08-29T00:00:00Z"));
                const publications = [
                  {
                    policyId: "terms_of_service",
                    title: "Terms of Service",
                    summary: "Pipe Buyer marketplace, Dispatch, subscription, payment, seller payout, refund and dispute terms.",
                    documentUrl: "https://www.pipebuyer.com/terms",
                    contentSha256: termsSha,
                  },
                  {
                    policyId: "privacy_notice",
                    title: "Privacy Notice",
                    summary: "Pipe Buyer privacy notice including Stripe Billing, Checkout, Connect and financial metadata boundaries.",
                    documentUrl: "https://www.pipebuyer.com/privacy",
                    contentSha256: privacySha,
                  },
                ];
                const results = [];
                for (const publication of publications) {
                  const policyRef = db.collection("platform_policies").doc(publication.policyId);
                  const eventRef = db.collection("policy_publication_events")
                      .doc(`${publication.policyId}-${version}-stripe-live-alignment`);
                  const result = await db.runTransaction(async (transaction) => {
                    const current = await transaction.get(policyRef);
                    const currentData = current.exists ? current.data() : {};
                    if (currentData.version === version &&
                        currentData.contentSha256 === publication.contentSha256 &&
                        currentData.documentUrl === publication.documentUrl &&
                        currentData.status === "published") {
                      return {
                        policyId: publication.policyId,
                        version,
                        revision: Number(currentData.revision || 1),
                        unchanged: true,
                      };
                    }
                    const revision = Number(currentData.revision || 0) + 1;
                    transaction.set(policyRef, {
                      policyId: publication.policyId,
                      title: publication.title,
                      version,
                      summary: publication.summary,
                      documentUrl: publication.documentUrl,
                      contentSha256: publication.contentSha256,
                      effectiveAt,
                      status: "published",
                      required: true,
                      revision,
                      publishedByUid: actor,
                      publishedAt: FieldValue.serverTimestamp(),
                      updatedAt: FieldValue.serverTimestamp(),
                    }, {merge: false});
                    transaction.set(eventRef, {
                      policyId: publication.policyId,
                      version,
                      contentSha256: publication.contentSha256,
                      documentUrl: publication.documentUrl,
                      effectiveAt,
                      approvalNote:
                        "Published after exact live-byte verification in the Stripe live-alignment release.",
                      revision,
                      actorUid: actor,
                      event: "published",
                      createdAt: FieldValue.serverTimestamp(),
                    }, {merge: false});
                    return {
                      policyId: publication.policyId,
                      version,
                      revision,
                      unchanged: false,
                    };
                  });
                  results.push(result);
                }
                res.status(200).json({ok: true, results});
              } catch (error) {
                console.error("Production policy publication failed", error);
                res.status(500).json({ok: false});
              }
            };
          }

          module.exports = {createProductionPolicyPublication};
          EOF
          cat >> firebase/functions/production_bootstrap.js <<'EOF'

          // Temporary release endpoint. Public infrastructure invocation is
          // separated from the one-time custom application-header authorization.
          const {onRequest: onRequestPolicyPublication} = require("firebase-functions/v2/https");
          const {createProductionPolicyPublication} = require("./production_policy_publication_temp");
          exports.productionPolicyPublication = onRequestPolicyPublication(
              {
                secrets: ["PIPE_POLICY_PUBLICATION_TOKEN"],
                invoker: "public",
              },
              createProductionPolicyPublication(createAdminRuntime()),
          );
          EOF
          node --check firebase/functions/production_policy_publication_temp.js
          node --check firebase/functions/production_bootstrap.js

      - name: Deploy one-time exact-policy publisher
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --config firebase.json \
            --only functions:marketplace:productionPolicyPublication \
            --message "Pipe Buyer custom-header policy publication $GITHUB_SHA" \
            --force \
            --non-interactive

      - name: Publish and verify exact live Terms and Privacy versions
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat .policy-publication-token)"
          terms_sha="$(cat .terms-sha)"
          privacy_sha="$(cat .privacy-sha)"
          payload="$(node -e 'console.log(JSON.stringify({termsSha: process.argv[1], privacySha: process.argv[2]}))' "$terms_sha" "$privacy_sha")"
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 4 --retry-all-errors \
            -X POST \
            -H "X-PipeBuyer-Policy-Token: $token" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$POLICY_PUBLISH_URL" > policy-publication-result.json
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('policy-publication-result.json', 'utf8'));
          const ids = new Set((payload.results || []).map((entry) => entry.policyId));
          if (payload.ok !== true ||
              !ids.has('terms_of_service') ||
              !ids.has('privacy_notice')) {
            throw new Error('Exact-release legal policy publication was not verified.');
          }
          console.log('Exact live Terms and Privacy policy versions published and verified.');
          NODE

      - name: Remove temporary policy publication endpoint
        if: always()
        shell: bash
        run: |
          firebase functions:delete productionPolicyPublication \
            --region us-central1 \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --force || true
          rm -f \
            .policy-publication-token \
            .terms-sha \
            .privacy-sha \
            .stripe-key \
            policy-publication-result.json \
            /tmp/pipebuyer-terms-live.html \
            /tmp/pipebuyer-privacy-live.html

      - name: Record verified completion
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "## Pipe Buyer Stripe live alignment complete"
            echo ""
            echo "- Stripe account/webhook: verified live"
            echo "- Dispatch subscriptions: enabled"
            echo "- Stripe Connect seller onboarding: enabled"
            echo "- Marketplace fee billing: enabled"
            echo "- Signed webhook/reconciliation profile: enabled"
            echo "- Full buyer-to-seller Checkout: intentionally disabled pending Canadian tax readiness"
            echo "- Terms and Privacy live bytes: matched source exactly"
            echo "- Exact Terms/Privacy policy hashes: published and verified"
            echo "- Temporary release endpoints: deleted by cleanup steps"
          } >> "$GITHUB_STEP_SUMMARY"
