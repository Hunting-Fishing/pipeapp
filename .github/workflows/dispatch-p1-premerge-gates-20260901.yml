name: Dispatch canonical P1 premerge gates 2026-09-01

on:
  push:
    branches:
      - feature/p1-user-blocking-build-plan-20260901

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-p1-premerge-gates-20260901
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch repository manual validation gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact-branch quality and callable-safety workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          reason="P1 Marketplace user-blocking premerge validation for ${GITHUB_SHA}"
          gh workflow run quality.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f reason="$reason"
          gh workflow run callable-safety.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f reason="$reason"
          {
            echo "Dispatched canonical manual gates for branch: $GITHUB_REF_NAME"
            echo "Dispatcher commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
