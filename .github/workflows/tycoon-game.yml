name: Oil & Gas Tycoon — Manual Validation

on:
  workflow_dispatch:
    inputs:
      build_android_profile:
        description: Build an Android profile APK for local device testing
        required: true
        type: boolean
        default: true
      build_ios_unsigned:
        description: Compile an unsigned iOS app on macOS (no store submission)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tycoon-game-manual-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: games/oil_gas_tycoon

jobs:
  verify_web:
    name: Game analysis, tests, and offline web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install Node for offline preparation
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Restore game dependencies
        run: flutter pub get

      - name: Analyze game
        run: flutter analyze --no-pub

      - name: Run game tests
        run: flutter test --no-pub --reporter expanded

      - name: Build web release with local renderer assets
        run: flutter build web --release --no-pub --no-web-resources-cdn --pwa-strategy=none

      - name: Prepare offline web bundle
        run: node tool/prepare_offline_web.mjs

      - name: Upload web bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: oil-gas-tycoon-web-${{ github.sha }}
          path: games/oil_gas_tycoon/build/web/
          if-no-files-found: error
          retention-days: 14

  android_profile:
    name: Android local test APK
    needs: verify_web
    if: ${{ inputs.build_android_profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Install Java toolchain
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android platforms required by app and plugins
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;36.0.0"

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Restore game dependencies
        run: flutter pub get

      - name: Build profile APK for local testing
        run: flutter build apk --profile --no-pub

      - name: Upload local test APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: oil-gas-tycoon-android-profile-${{ github.sha }}
          path: games/oil_gas_tycoon/build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: error
          retention-days: 14

  ios_unsigned:
    name: Unsigned iOS compilation
    needs: verify_web
    if: ${{ inputs.build_ios_unsigned }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Restore game dependencies
        run: flutter pub get

      - name: Compile unsigned iOS app
        run: flutter build ios --release --no-codesign --no-pub

      - name: Archive unsigned app with bundle metadata
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/oil-gas-tycoon-ios-unsigned.zip

      - name: Upload unsigned iOS compilation artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: oil-gas-tycoon-ios-unsigned-${{ github.sha }}
          path: games/oil_gas_tycoon/build/ios/oil-gas-tycoon-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 14
