name: Oil & Gas Tycoon — Validation

on:
  pull_request:
    paths:
      - 'games/oil_gas_tycoon/**'
      - '.github/workflows/tycoon-game.yml'
  workflow_dispatch:
    inputs:
      build_android_profile:
        description: Build an Android profile APK for local device testing
        required: true
        type: boolean
        default: true
      build_ios_unsigned:
        description: Compile an unsigned iOS app on macOS (no store submission)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tycoon-game-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: games/oil_gas_tycoon

jobs:
  verify_web:
    name: Game analysis, tests, and offline web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install Node for offline preparation
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Restore game dependencies
        run: flutter pub get

      - name: Analyze game
        run: flutter analyze --no-pub

      - name: Run game tests
        run: flutter test --no-pub --reporter expanded

      - name: Check deterministic expansion economics
        run: dart run tool/verify_expansion.dart

      - name: Build web release with local renderer assets
        run: flutter build web --release --no-pub --no-web-resources-cdn --pwa-strategy=none

      - name: Prepare offline web bundle
        run: node tool/prepare_offline_web.mjs

      - name: Upload web bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: oil-gas-tycoon-web-${{ github.sha }}
          path: games/oil_gas_tycoon/build/web/
          # The offline cache includes .last_build_id; preserve it in downloads.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  android_profile:
    name: Android local test APK
    needs: verify_web
    if: ${{ github.event_name == 'pull_request' || inputs.build_android_profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Install Java toolchain
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android platforms required by app and plugins
        run: |
          sdkmanager_bin=""
          for android_sdk_dir in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}"; do
            if [[ -z "$android_sdk_dir" ]]; then
              continue
            fi
            for candidate in "$android_sdk_dir/cmdline-tools/latest/bin/sdkmanager" "$android_sdk_dir"/cmdline-tools/*/bin/sdkmanager; do
              if [[ -x "$candidate" ]]; then
                sdkmanager_bin="$candidate"
                break 2
              fi
            done
          done
          if [[ -z "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$sdkmanager_bin" ]]; then
            echo "::error::Android sdkmanager was not found in the runner SDK or PATH."
            exit 1
          fi
          "$sdkmanager_bin" "platforms;android-35" "platforms;android-36" "build-tools;36.0.0"

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Restore game dependencies
        run: flutter pub get

      - name: Build ARM64 profile APK for local testing
        run: flutter build apk --profile --target-platform android-arm64 --split-per-abi --no-pub

      - name: Upload local test APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: oil-gas-tycoon-android-arm64-profile-${{ github.sha }}
          path: games/oil_gas_tycoon/build/app/outputs/flutter-apk/app-arm64-v8a-profile.apk
          if-no-files-found: error
          retention-days: 14

  ios_unsigned:
    name: Unsigned iOS compilation
    needs: verify_web
    if: ${{ inputs.build_ios_unsigned }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Restore game dependencies
        run: flutter pub get

      - name: Compile unsigned iOS app
        run: flutter build ios --release --no-codesign --no-pub

      - name: Archive unsigned app with bundle metadata
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/oil-gas-tycoon-ios-unsigned.zip

      - name: Upload unsigned iOS compilation artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: oil-gas-tycoon-ios-unsigned-${{ github.sha }}
          path: games/oil_gas_tycoon/build/ios/oil-gas-tycoon-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 14
