name: Dispatch Release 3 Provider Detail Production

on:
  push:
    branches:
      - ops/deploy-release3-provider-detail-62cf3075
    paths:
      - .github/workflows/dispatch-release3-provider-detail-production-20260902.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical protected production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/deploy-payload.json <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "environment": "production",
              "commit_sha": "62cf3075f53725ffafdd34e12c9d3875bfc53078",
              "app_check_mode": "enforce"
            }
          }
          JSON
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            --input /tmp/deploy-payload.json
