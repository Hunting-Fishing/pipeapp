name: Complete Marketplace Payment Activation 2026-08-29

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/complete-marketplace-payment-activation-20260829.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: pipe-buyer-marketplace-payment-activation-20260829
  cancel-in-progress: false

jobs:
  activate:
    name: Activate verified marketplace payments
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_PROJECT_ID: flutter-flow-pipe
      EXPECTED_STRIPE_ACCOUNT: acct_1U2QmKDkO07WMXyR
      STRIPE_WEBHOOK_URL: https://us-central1-flutter-flow-pipe.cloudfunctions.net/stripeMarketplaceWebhook
      ACTIVATION_URL: https://us-central1-flutter-flow-pipe.cloudfunctions.net/productionBillingActivation
      VERIFIED_RELEASE_SHA: 63b8c56c9a5f47f6a78e1ef68a23a25c226bb3fc
      VERIFIED_RELEASE_RUN: "33238533449"

    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prove runtime source matches verified release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git cat-file -e "$VERIFIED_RELEASE_SHA^{commit}"
          git diff --quiet "$VERIFIED_RELEASE_SHA" "$GITHUB_SHA" -- \
            firebase lib web firebase.json pubspec.yaml pubspec.lock
          echo "Runtime source is unchanged from verified production release $VERIFIED_RELEASE_SHA."

      - name: Prove verified release completed successfully
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const runId = process.env.VERIFIED_RELEASE_RUN;
          const expectedSha = process.env.VERIFIED_RELEASE_SHA;
          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          (async () => {
            const response = await fetch(`https://api.github.com/repos/${repo}/actions/runs/${runId}`, {
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/vnd.github+json',
              },
            });
            const run = await response.json();
            if (!response.ok || run.conclusion !== 'success' || run.head_sha !== expectedSha) {
              throw new Error('Verified Firebase production release evidence is missing or does not match the expected SHA.');
            }
            console.log(`Verified production release ${runId} succeeded for ${expectedSha}.`);
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Install Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Validate payment Functions and install Firebase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix firebase/functions
          npm audit --omit=dev --audit-level=high --prefix firebase/functions
          npm run lint --prefix firebase/functions
          npm run check --prefix firebase/functions
          npm install --global firebase-tools@15.25.0 --no-audit --no-fund

      - name: Verify live Pipe Buyer Stripe account and webhook
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          firebase functions:secrets:access STRIPE_SECRET_PRODUCTION \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" | tail -n 1 > .stripe-key
          firebase functions:secrets:get STRIPE_WEBHOOK_SECRET \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --json > /dev/null
          node <<'NODE'
          const fs = require('node:fs');
          const key = fs.readFileSync('.stripe-key', 'utf8').trim();
          async function stripe(path) {
            const response = await fetch(`https://api.stripe.com${path}`, {
              headers: {Authorization: `Bearer ${key}`},
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(`Stripe validation failed (${response.status}).`);
            return payload;
          }
          (async () => {
            const [account, balance, endpoints] = await Promise.all([
              stripe('/v1/account'),
              stripe('/v1/balance'),
              stripe('/v1/webhook_endpoints?limit=100'),
            ]);
            if (String(account.id || '') !== process.env.EXPECTED_STRIPE_ACCOUNT || balance.livemode !== true) {
              throw new Error('Pipe Buyer live Stripe account validation failed.');
            }
            const endpoint = (endpoints.data || []).find((item) =>
              item.url === process.env.STRIPE_WEBHOOK_URL && item.status === 'enabled' && item.livemode === true);
            if (!endpoint) throw new Error('Verified Pipe Buyer live webhook is not enabled.');
            console.log('Pipe Buyer live Stripe account and webhook verified.');
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Prepare newline-free one-time activation token
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          token="$(openssl rand -hex 32)"
          if [[ ! "$token" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Activation token must be exactly 64 lowercase hex characters."
            exit 1
          fi
          printf '%s' "$token" > .activation-token
          test "$(wc -c < .activation-token | tr -d ' ')" = "64"
          firebase functions:secrets:set PIPE_BILLING_ACTIVATION_TOKEN \
            --data-file .activation-token \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive > /dev/null

      - name: Build temporary custom-header activator
        shell: bash
        run: |
          set -euo pipefail
          cat > firebase/functions/production_billing_activation_temp.js <<'EOF'
          "use strict";
          const crypto = require("node:crypto");

          function safeTokenMatch(provided, expected) {
            const left = Buffer.from(String(provided || ""));
            const right = Buffer.from(String(expected || ""));
            return left.length === right.length && left.length === 64 &&
              crypto.timingSafeEqual(left, right);
          }

          function createProductionBillingActivation(admin) {
            const db = admin.firestore();
            const FieldValue = admin.firestore.FieldValue;
            return async (req, res) => {
              try {
                if (req.method !== "POST") return res.status(405).send("Method not allowed");
                const expected = String(process.env.PIPE_BILLING_ACTIVATION_TOKEN || "");
                const provided = String(req.get("x-pipebuyer-activation-token") || "");
                if (!safeTokenMatch(provided, expected)) return res.status(403).send("Forbidden");

                const readinessRef = db.collection("platform_configuration")
                    .doc("payment_provider_readiness");
                const phaseRef = db.collection("platform_configuration")
                    .doc("phase1_features");
                const auditRef = db.collection("payment_readiness_audit").doc();

                const result = await db.runTransaction(async (transaction) => {
                  const [readinessSnapshot, phaseSnapshot] = await Promise.all([
                    transaction.get(readinessRef), transaction.get(phaseRef),
                  ]);
                  const currentReadiness = readinessSnapshot.exists ? readinessSnapshot.data() : {};
                  const currentPhase = phaseSnapshot.exists ? phaseSnapshot.data() : {};
                  const readinessRevision = Math.max(0, Number(currentReadiness.revision || 0)) + 1;
                  const phaseRevision = Math.max(0, Number(currentPhase.revision || 0)) + 1;
                  const readiness = {
                    stripeMode: "production",
                    stripeConnectOnboardingEnabled: true,
                    stripeCheckoutEnabled: true,
                    stripeFeeBillingEnabled: true,
                    stripeSubscriptionsEnabled: true,
                    stripeWebhookVerified: true,
                    stripeTaxReady: false,
                    stripeTaxRegistrationPending: true,
                    marketplaceTaxCollectionDeferredApproved: true,
                    stripeReconciliationReady: true,
                    affiliatePayoutsEnabled: false,
                    marketplaceFinancialResolutionEnabled: false,
                    marketplaceDisputeAutomationEnabled: false,
                    marketplaceDisputeEvidenceEnabled: false,
                    platformFundedRefundOverrideEnabled: false,
                    connectReturnUrl: "https://www.pipebuyer.com/?connect=return",
                    connectRefreshUrl: "https://www.pipebuyer.com/?connect=refresh",
                    checkoutSuccessUrl: "https://www.pipebuyer.com/?payment=success",
                    checkoutCancelUrl: "https://www.pipebuyer.com/?payment=cancel",
                    revision: readinessRevision,
                    lastChangedByUid: "system:github-production-activation",
                    lastChangeReason:
                      "Marketplace payments and Dispatch subscriptions activated; Stripe automatic tax remains disabled while Canadian registration is pending and tax is handled manually by the platform.",
                    updatedAt: FieldValue.serverTimestamp(),
                  };
                  transaction.set(readinessRef, readiness, {merge: false});
                  transaction.set(phaseRef, {
                    marketplace: true,
                    offers: true,
                    auctions: true,
                    dispatch: true,
                    paidFeatures: true,
                    revision: phaseRevision,
                    updatedAt: FieldValue.serverTimestamp(),
                  }, {merge: true});
                  transaction.create(auditRef, {
                    administratorUid: "system:github-production-activation",
                    reason:
                      "Authorized live marketplace and subscription launch with Stripe automatic tax disabled pending Canadian registration.",
                    revision: readinessRevision,
                    previous: currentReadiness,
                    next: readiness,
                    createdAt: FieldValue.serverTimestamp(),
                  });
                  return {
                    readinessRevision,
                    phaseRevision,
                    stripeMode: readiness.stripeMode,
                    stripeConnectOnboardingEnabled: readiness.stripeConnectOnboardingEnabled,
                    stripeCheckoutEnabled: readiness.stripeCheckoutEnabled,
                    stripeFeeBillingEnabled: readiness.stripeFeeBillingEnabled,
                    stripeSubscriptionsEnabled: readiness.stripeSubscriptionsEnabled,
                    stripeWebhookVerified: readiness.stripeWebhookVerified,
                    stripeTaxRegistrationPending: readiness.stripeTaxRegistrationPending,
                    marketplaceTaxCollectionDeferredApproved:
                      readiness.marketplaceTaxCollectionDeferredApproved,
                    stripeTaxReady: readiness.stripeTaxReady,
                  };
                });
                return res.status(200).json({ok: true, result});
              } catch (error) {
                console.error("Production billing activation failed", error);
                return res.status(500).json({ok: false});
              }
            };
          }

          module.exports = {createProductionBillingActivation};
          EOF

          cat >> firebase/functions/production_bootstrap.js <<'EOF'

          // One-time production activator. A dedicated header is used because the
          // Authorization header is reserved by the Google/Firebase HTTP layer.
          // The endpoint is deleted immediately after the verified write.
          const {onRequest: onRequestPaymentActivation} = require("firebase-functions/v2/https");
          const {createProductionBillingActivation: createPaymentActivation} = require("./production_billing_activation_temp");
          exports.productionBillingActivation = onRequestPaymentActivation(
              {secrets: ["PIPE_BILLING_ACTIVATION_TOKEN"], invoker: "public"},
              createPaymentActivation(createAdminRuntime()),
          );
          EOF
          node --check firebase/functions/production_billing_activation_temp.js
          node --check firebase/functions/production_bootstrap.js

      - name: Deploy one-time activator
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --config firebase.json \
            --only functions:marketplace:productionBillingActivation \
            --message "Pipe Buyer final marketplace payment activation $GITHUB_SHA" \
            --force --non-interactive

      - name: Prove activator handler is reachable
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error -o handler-probe.txt -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -d '{}' "$ACTIVATION_URL")"
          if [[ "$status" != "403" || "$(cat handler-probe.txt)" != "Forbidden" ]]; then
            echo "::error::Temporary activator is not reaching the application handler."
            cat handler-probe.txt || true
            exit 1
          fi
          echo "Application handler reachability and missing-token rejection verified."

      - name: Activate and verify marketplace payments
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat .activation-token)"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            -X POST \
            -H "X-PipeBuyer-Activation-Token: $token" \
            -H "Content-Type: application/json" \
            -d '{}' "$ACTIVATION_URL" > activation-result.json
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('activation-result.json', 'utf8'));
          const r = payload && payload.result || {};
          if (payload.ok !== true ||
              r.stripeMode !== 'production' ||
              r.stripeConnectOnboardingEnabled !== true ||
              r.stripeCheckoutEnabled !== true ||
              r.stripeFeeBillingEnabled !== true ||
              r.stripeSubscriptionsEnabled !== true ||
              r.stripeWebhookVerified !== true ||
              r.stripeTaxRegistrationPending !== true ||
              r.marketplaceTaxCollectionDeferredApproved !== true ||
              r.stripeTaxReady !== false) {
            throw new Error('Production payment readiness does not match the authorized launch profile.');
          }
          console.log('Pipe Buyer marketplace payments and Dispatch subscriptions are activated.');
          NODE
          {
            echo "## Pipe Buyer payment activation"
            echo ""
            echo "- Marketplace Checkout: enabled"
            echo "- Timed Buying winner Checkout: enabled"
            echo "- Stripe Connect seller onboarding: enabled"
            echo "- Delayed seller release: enabled by deployed lifecycle Functions"
            echo "- Dispatch monthly/yearly subscriptions: enabled"
            echo "- Stripe automatic tax: disabled"
            echo "- Canadian tax registration: pending"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary activation endpoint
        if: always()
        shell: bash
        run: |
          firebase functions:delete productionBillingActivation \
            --region us-central1 \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --force || true
          rm -f .activation-token .stripe-key activation-result.json handler-probe.txt
