name: Finalize payment security foundation

on:
  push:
    branches:
      - phase-1-1-payment-provider-security-foundation
    paths:
      - .github/workflows/finalize-payment-security-foundation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-1-payment-provider-security-foundation
          fetch-depth: 0
      - name: Remove stale fee claims
        run: python tool/finalize_payment_security_foundation.py
      - name: Verify stale fee claims are absent
        run: |
          ! grep -nE '3\.5% company commission earnings|estimated 3\.5% fees|EST\. 3\.5% AUCTION FEES|grossAuctionVolume \* 0\.035' \
            lib/marketplace/marketplace_admin_dashboard.dart
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/marketplace/marketplace_admin_dashboard.dart
          git diff --cached --check
          git commit -m "Remove inactive fee claims from admin analytics"
          git push origin HEAD:phase-1-1-payment-provider-security-foundation
