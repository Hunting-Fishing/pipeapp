name: Merge Release 1 production docs

on:
  push:
    branches:
      - ops/merge-release1-docs-20260901
    paths:
      - .github/workflows/merge-release1-docs-20260901.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Squash merge exact docs PR head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: 9aef0b42ba03f4afc401771bc193e47b1f09acc0
        run: |
          set -euo pipefail
          current_head="$(gh api repos/${{ github.repository }}/pulls/169 --jq .head.sha)"
          if [[ "$current_head" != "$EXPECTED_HEAD" ]]; then
            echo "::error::PR #169 moved from $EXPECTED_HEAD to $current_head"
            exit 1
          fi
          gh api --method PUT repos/${{ github.repository }}/pulls/169/merge \
            -f sha="$EXPECTED_HEAD" \
            -f merge_method=squash \
            -f commit_title='Docs: record Release 1 verified production release (#169)' \
            -f commit_message='Documentation-only bookkeeping. The deployed application SHA remains 996bd3f782a89639aaf12527193cb1ecf4d92f84 and production run remains 33493435243 (#56). Do not report this docs merge as deployed application identity.' \
            --jq '{merged, message, sha}'
