name: R5 Quote V2 B2 backend apply

on:
  push:
    branches:
      - feature/r5-dispatch-provider-inbox-20260911

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/r5-dispatch-provider-inbox-20260911

      - name: Apply guarded backend transform
        run: node tool/apply_r5_quote_validity_backend.mjs

      - name: Syntax check transformed Functions files
        run: |
          node --check firebase/functions/dispatch_command_policy.js
          node --check firebase/functions/dispatch_commands.js
          node --check firebase/functions/index.js

      - name: Run Quote V2 validity policy tests
        run: node --test firebase/functions/test/dispatch_quote_v2_validity_policy.test.js

      - name: Verify patch whitespace
        run: git diff --check

      - name: Commit backend integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase/functions/dispatch_command_policy.js firebase/functions/dispatch_commands.js firebase/functions/index.js lib/marketplace/marketplace_dispatch_repository.dart
          if git diff --cached --quiet; then
            echo "Backend already integrated."
            exit 0
          fi
          git commit -m "Implement Quote V2 B2 server validity and cancellation"
          git push origin HEAD:feature/r5-dispatch-provider-inbox-20260911
