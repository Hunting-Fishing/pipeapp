name: Record P1 production release 2026-09-01

on:
  push:
    branches:
      - docs/record-p1-user-blocking-production-20260901

permissions:
  contents: write

concurrency:
  group: record-p1-production-release-20260901
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: docs/record-p1-user-blocking-production-20260901
          fetch-depth: 0

      - name: Record verified production release in authoritative plans
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          RELEASE_SHA = "0dd8f9c4ab69868b4b8fc8e6cb2c05dbf1ca80de"
          RELEASE_RUN = "33464230471"
          QUALITY_RUN = "33463954448"
          CALLABLE_RUN = "33463955489"
          FIREBASE_ARTIFACT = "firebase-release-evidence-production-0dd8f9c4ab69868b4b8fc8e6cb2c05dbf1ca80de-33464230471"
          FIREBASE_ARTIFACT_ID = "9784473533"
          VISUAL_ARTIFACT = "visual-acceptance-production-33464230471"
          VISUAL_ARTIFACT_ID = "9784489576"
          VISUAL_JOB = "99722538441"
          MARKER = "## 2026-09-01 P1 Marketplace blocking production release"

          docs = {
              "docs/PHASE_1_LAUNCH_FINALIZATION_PLAN.md": f'''{MARKER}\n\nMarketplace conversation user block/unblock is **production deployed and verified**. The deployed application identity is `main` at `{RELEASE_SHA}` via protected Firebase production run `{RELEASE_RUN}` (#55) with App Check `enforce`. Pre-merge Quality run `{QUALITY_RUN}` and Callable Safety run `{CALLABLE_RUN}` both passed. The production workflow then passed Flutter analysis/tests, release-manifest and Function-parity controls, both Functions codebase validation, Firestore security rules, authenticated callable workflows/retries, exact web build, Firebase deployment, post-deploy Function parity, release-identity recording, and responsive production visual acceptance (job `{VISUAL_JOB}`).\n\nThe two new production callables are `readMarketplaceUserBlockStatus` and `setMarketplaceUserBlocked`. Release inventory remains generated from `firebase.json` and exported Functions; there is no static Function allowlist to maintain. Deployment evidence is retained as `{FIREBASE_ARTIFACT}` (artifact `{FIREBASE_ARTIFACT_ID}`) and `{VISUAL_ARTIFACT}` (artifact `{VISUAL_ARTIFACT_ID}`).\n\nRepair record: review found a client-only reciprocal-block defect where a user could not establish their own durable block if the other party had blocked first. Server directional/mutual blocking was already correct. The client restriction was removed, a regression contract test was added, and the canonical Quality + authenticated callable gates passed before production deployment. Existing messages and Trust & Safety evidence remain preserved.\n\nAny later documentation-only merge records this evidence only; it is **not** a redeployment and must not replace `{RELEASE_SHA}` as the production application SHA.\n''',
              "docs/PHASE_1_PROGRESS_AUDIT.md": f'''{MARKER}\n\nThe P1 Marketplace user-blocking slice moved from source/emulator acceptance to **verified production** on `{RELEASE_SHA}`. Protected production run `{RELEASE_RUN}` (#55) used App Check `enforce` and passed exact-source checkout, Flutter tests, release-manifest/parity tests, Functions validation, Firestore security rules, authenticated callable workflows/retries, exact web build, Firebase deployment, post-deploy Function parity, release identity, and production visual acceptance (job `{VISUAL_JOB}`). Pre-merge Quality `{QUALITY_RUN}` and Callable Safety `{CALLABLE_RUN}` were also green.\n\nProduction evidence: `{FIREBASE_ARTIFACT}` (artifact `{FIREBASE_ARTIFACT_ID}`) and `{VISUAL_ARTIFACT}` (artifact `{VISUAL_ARTIFACT_ID}`). New exported callables `readMarketplaceUserBlockStatus` and `setMarketplaceUserBlocked` are discovered by the generated release manifest; no static allowlist entry is required.\n\nThe accepted repair was narrowly client-side: reciprocal blocking was originally disabled when the other member had blocked first. That restriction was removed so either party can create an independent directional block, and a regression contract test now preserves the rule. Server send enforcement, retained conversation history, and retained moderation evidence were unchanged.\n\nThis production record supersedes historical statements below that App Check, exact committed-candidate deployment, or Function parity were still pending for this release. Historical July percentages remain historical rather than being recomputed.\n''',
              "docs/PIPEBUYER_ACTIVE_BUILD_HANDOFF.md": f'''{MARKER}\n\nP1 Marketplace conversation blocking is **complete in production**. The deployed app remains `main` at `{RELEASE_SHA}`, released by protected Firebase run `{RELEASE_RUN}` (#55) with App Check `enforce`. Pre-merge acceptance: Quality `{QUALITY_RUN}` = SUCCESS; Callable Safety `{CALLABLE_RUN}` = SUCCESS. Production also passed Firestore security rules, authenticated callable workflows/retries, exact web build, Firebase deployment, post-deploy Function parity, release identity, and responsive production visual acceptance (job `{VISUAL_JOB}`).\n\nEvidence retained:\n- `{FIREBASE_ARTIFACT}` — artifact `{FIREBASE_ARTIFACT_ID}`\n- `{VISUAL_ARTIFACT}` — artifact `{VISUAL_ARTIFACT_ID}`\n\nNew production callables: `readMarketplaceUserBlockStatus` and `setMarketplaceUserBlocked`. Function inventory is generated from `firebase.json` plus exported entrypoints; do not add or resurrect a static Function allowlist.\n\nPermanent repair lesson: the reciprocal-block defect was a client permission check, not a backend block-model defect. When the other party had already blocked first, the UI incorrectly prevented the viewer from placing their own durable block. Remove only that client restriction; preserve directional/mutual server blocks, message history, and Trust & Safety evidence. The regression contract test records this so the same repair is not repeated.\n\nA documentation-only merge after this release must be recorded separately. It does not change the deployed application identity `{RELEASE_SHA}` and does not justify another Firebase deployment.\n''',
              "docs/PIPE_BUYER_LAUNCH_READINESS_AUDIT_2026-08-30.md": f'''{MARKER}\n\nThe current verified production application is `main` at `{RELEASE_SHA}`, deployed by `Deploy verified Firebase release` run `{RELEASE_RUN}` (#55) with App Check `enforce`. Pre-merge Quality run `{QUALITY_RUN}` and Callable Safety run `{CALLABLE_RUN}` passed. The production run then passed Flutter analysis/tests, generated release-manifest controls, Function-parity tests, both Functions codebase validation, Firestore security rules, authenticated callable workflows/retries, exact web build, notification-worker verification, Firebase deployment, post-deploy Function parity, release identity, and responsive production visual acceptance (job `{VISUAL_JOB}`).\n\nRetained evidence: `{FIREBASE_ARTIFACT}` (artifact `{FIREBASE_ARTIFACT_ID}`) and `{VISUAL_ARTIFACT}` (artifact `{VISUAL_ARTIFACT_ID}`). The release includes `readMarketplaceUserBlockStatus` and `setMarketplaceUserBlocked`; the release manifest discovers them from the configured Firebase codebases/exports, so no static Function allowlist exists to reconcile.\n\nTrust repair closed during review: reciprocal blocking must remain independently available to either party even if the other party blocked first. The backend already supported directional/mutual blocks; the client-only restriction was removed and locked by a regression contract test. Existing conversation history and Trust & Safety reports/evidence remain retained. A two-ordinary-account production-safe human UX pass remains useful acceptance evidence, but it is no longer a deployment blocker or evidence that the feature is absent.\n\nAny subsequent documentation-only merge SHA is bookkeeping and must not be reported as the deployed application SHA.\n''',
          }

          replacements = {
              "docs/PHASE_1_LAUNCH_FINALIZATION_PLAN.md": [
                  (
                      "The current P1 trust slice is user block/unblock for Marketplace conversations. It is being implemented server-authoritatively so blocked parties cannot exchange new direct messages while existing messages and moderation/report evidence remain stored.",
                      "The current P1 trust slice, Marketplace conversation user block/unblock, is production deployed and server-authoritative. Either party's active directional block prevents new direct messages while existing messages and moderation/report evidence remain stored."
                  ),
                  ("Status: In progress  ", "Status: Production release verified; remaining P1 acceptance continues  "),
                  ("Baseline branch: `main` (`b34387a`; current completion candidate contains reviewed working-tree changes)", f"Production baseline: `main` at `{RELEASE_SHA}` — deployed and verified in run `{RELEASE_RUN}`")
              ],
              "docs/PHASE_1_PROGRESS_AUDIT.md": [
                  ("Branch: `main` (working-tree completion candidate)", "Branch: `main`"),
                  ("Audited commit baseline: `main` at `b34387a`; exact release identity requires committing the reviewed candidate", f"Current verified production release: `main` at `{RELEASE_SHA}` via run `{RELEASE_RUN}`; the July audit below remains historical")
              ],
              "docs/PIPEBUYER_ACTIVE_BUILD_HANDOFF.md": [
                  ("**Current production baseline before this P1 slice:** `7c5398dc22ef42844058f17e2ee70882bb72e987`", f"**Current deployed production baseline:** `{RELEASE_SHA}` (verified run `{RELEASE_RUN}`)"),
                  ("**Current implementation branch:** `feature/p1-user-blocking-build-plan-20260901`", f"**Completed P1 release:** PR #166 merged to `main` at `{RELEASE_SHA}`"),
                  ("Controlled North American web launch is in late P1 acceptance. Current autonomous engineering priority: server-authoritative Marketplace user block/unblock, preserving conversation and moderation evidence. Remaining P1 acceptance after that includes ordinary-user buyer/seller/Timed Buying/report-admin/Dispatch journeys, physical mobile push/deep-link validation for native launch, and representative Dispatch provider data/privacy acceptance.",
                   "Controlled North American web launch remains in late P1 acceptance. Marketplace user block/unblock is now production deployed and verified. Remaining P1 acceptance includes ordinary-user buyer/seller/Timed Buying/report-admin/Dispatch journeys, physical mobile push/deep-link validation for native launch, and representative Dispatch provider data/privacy acceptance.")
              ],
              "docs/PIPE_BUYER_LAUNCH_READINESS_AUDIT_2026-08-30.md": [
                  ("- Production source / release pointer: `7c5398dc22ef42844058f17e2ee70882bb72e987`", f"- Production source / release pointer: `{RELEASE_SHA}`"),
                  ("- Latest protected Marketplace hero production run: `33428641770` — **success**", f"- Latest protected Firebase production run: `{RELEASE_RUN}` (#55) — **success**, App Check `enforce`"),
                  ("| User block / mute | **GREEN/YELLOW** | The 2026-09-01 P1 slice adds server-authoritative conversation block/unblock state, block/unblock controls in the chat safety menu, and send enforcement in Cloud Functions. Existing conversation history and Trust & Safety evidence are retained. | This closes the earlier “no clear implementation” finding. | Validate the block/unblock journey with two ordinary production-safe accounts after deployment. A separate notification-only mute preference can remain P2 unless user feedback shows it is needed. |",
                   f"| User block / mute | **GREEN/YELLOW** | Server-authoritative block/unblock is production deployed on `{RELEASE_SHA}`. Either party's directional block prevents new direct messages; existing conversation history and Trust & Safety evidence are retained. Production release/parity and authenticated callable gates passed. | This closes the earlier ‘no clear implementation’ finding and records the reciprocal-block regression repair. | Run a final two-ordinary-account production-safe UX confirmation as human acceptance evidence. A separate notification-only mute preference can remain P2 unless user feedback shows it is needed. |"),
                  ("Before broad paid promotion, close or explicitly accept the remaining P1 items: a fresh ordinary-user end-to-end acceptance pass, physical-device notification testing if mobile web/app is promoted, provider Directory data/privacy acceptance, a deliberate block/mute product decision, and current legal/tax review for the exact launch jurisdictions/payment types.",
                   "Before broad paid promotion, close or explicitly accept the remaining P1 items: a fresh ordinary-user end-to-end acceptance pass including a two-account block/unblock UX confirmation, physical-device notification testing if mobile web/app is promoted, provider Directory data/privacy acceptance, and current legal/tax review for the exact launch jurisdictions/payment types.")
              ],
          }

          changed = []
          for path_str, block in docs.items():
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              if MARKER in text:
                  raise SystemExit(f"marker already present unexpectedly: {path}")
              for old, new in replacements[path_str]:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"expected exactly one anchor in {path}: {old[:90]!r}; found {count}")
                  text = text.replace(old, new, 1)
              first_nl = text.find("\n")
              if first_nl < 0:
                  raise SystemExit(f"missing title newline: {path}")
              text = text[:first_nl + 1] + "\n" + block + "\n" + text[first_nl + 1:]
              path.write_text(text, encoding="utf-8")
              changed.append(path_str)

          expected = set(docs)
          if set(changed) != expected:
              raise SystemExit("unexpected document scope")
          print("Updated exactly:")
          for path in changed:
              print(path)
          PY

          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            docs/PHASE_1_LAUNCH_FINALIZATION_PLAN.md \
            docs/PHASE_1_PROGRESS_AUDIT.md \
            docs/PIPEBUYER_ACTIVE_BUILD_HANDOFF.md \
            docs/PIPE_BUYER_LAUNCH_READINESS_AUDIT_2026-08-30.md | sort)"
          if [[ "$changed" != "$expected" ]]; then
            echo "::error::Unexpected documentation scope before cleanup."
            printf 'Changed:\n%s\nExpected:\n%s\n' "$changed" "$expected"
            exit 1
          fi

      - name: Commit four-doc release record and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/record-p1-production-release-20260901.yml
          git add \
            docs/PHASE_1_LAUNCH_FINALIZATION_PLAN.md \
            docs/PHASE_1_PROGRESS_AUDIT.md \
            docs/PIPEBUYER_ACTIVE_BUILD_HANDOFF.md \
            docs/PIPE_BUYER_LAUNCH_READINESS_AUDIT_2026-08-30.md
          git diff --cached --check
          git commit -m "Record verified P1 Marketplace blocking production release"
          git push origin HEAD:docs/record-p1-user-blocking-production-20260901
