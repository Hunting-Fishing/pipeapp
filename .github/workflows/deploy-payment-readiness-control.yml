name: Deploy Payment Readiness Control

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-payment-readiness-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy readiness admin callables
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_PROJECT_ID: flutter-flow-pipe

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0

      - name: Install Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Restore and validate marketplace Functions
        run: |
          npm ci --prefix firebase/functions
          npm run lint --prefix firebase/functions
          npm run check --prefix firebase/functions

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.25.0 --no-audit --no-fund

      - name: Deploy readiness controller only
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_TOKEN:-}" ]]; then
            echo "::error::FIREBASE_TOKEN is not configured."
            exit 1
          fi
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --config firebase.json \
            --only functions:getPaymentProviderReadiness,functions:setPaymentProviderReadiness \
            --message "Pipe Buyer payment readiness control $GITHUB_SHA" \
            --non-interactive

      - name: Verify deployed readiness functions
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --json > deployed-functions.json
          node <<'NODE'
          const fs = require('node:fs');
          const raw = JSON.parse(fs.readFileSync('deployed-functions.json', 'utf8'));
          const entries = Array.isArray(raw) ? raw : (raw.result || raw.functions || []);
          const names = new Set(entries.map((entry) => String(
            entry.id || entry.name || entry.function || entry.entryPoint || ''
          ).split('/').pop()));
          for (const name of ['getPaymentProviderReadiness', 'setPaymentProviderReadiness']) {
            if (!names.has(name)) throw new Error(`${name} was not deployed.`);
          }
          NODE
