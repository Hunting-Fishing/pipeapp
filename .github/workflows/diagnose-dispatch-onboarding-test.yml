name: Diagnose Dispatch onboarding widget test

on:
  push:
    branches:
      - ops/diagnose-dispatch-onboarding-test
    paths:
      - .github/workflows/diagnose-dispatch-onboarding-test.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/diagnose-dispatch-onboarding-test
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run complete suite and retain output
        id: flutter_tests
        continue-on-error: true
        shell: pwsh
        run: |
          flutter test --reporter expanded *>&1 | Tee-Object -FilePath full-flutter-test.log
          exit $LASTEXITCODE
      - name: Upload complete Flutter test log
        uses: actions/upload-artifact@v4
        with:
          name: full-flutter-test-log
          path: full-flutter-test.log
          retention-days: 1
      - name: Preserve test result
        if: steps.flutter_tests.outcome == 'failure'
        run: exit 1
