name: Apply Dispatch open signup migration

on:
  push:
    branches:
      - feat/dispatch-open-signup-membership-pilot
    paths:
      - ".github/workflows/apply-dispatch-open-signup.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: feat/dispatch-open-signup-membership-pilot
          fetch-depth: 0
      - name: Apply deterministic migration
        run: python3 tool/apply_dispatch_open_signup_patch.py
      - name: Validate patch whitespace
        run: git diff --check
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Pipe Buyer CI"
          git config user.email "103216816+Hunting-Fishing@users.noreply.github.com"
          git add firebase lib test .github tool
          if git diff --cached --quiet; then
            echo "No migration changes were produced."
            exit 0
          fi
          git commit -m "feat: open Dispatch signup and require paid bidding membership"
          git push origin HEAD:feat/dispatch-open-signup-membership-pilot
