name: Production Payment Readiness Audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-readiness-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: flutter-flow-pipe
  EXPECTED_STRIPE_ACCOUNT: acct_1U2QmKDkO07WMXyR
  STRIPE_WEBHOOK_URL: https://us-central1-flutter-flow-pipe.cloudfunctions.net/stripeMarketplaceWebhook

jobs:
  audit:
    name: Audit production payment prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.0

      - name: Install Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.25.0 --no-audit --no-fund

      - name: Validate Firebase production credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_TOKEN:-}" ]]; then
            echo "::error::FIREBASE_TOKEN is not configured in the production GitHub Environment."
            exit 1
          fi

      - name: Check Stripe Secret Manager metadata
        id: secrets
        shell: bash
        run: |
          set -uo pipefail
          missing=0
          for secret in STRIPE_SECRET_PRODUCTION STRIPE_WEBHOOK_SECRET; do
            if firebase functions:secrets:get "$secret" \
              --project "$FIREBASE_PROJECT_ID" \
              --token "$FIREBASE_TOKEN" \
              --json > /dev/null 2>&1; then
              echo "$secret: configured" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$secret: MISSING" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::$secret is not configured in Firebase Secret Manager."
              missing=1
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Validate live Stripe account, Dispatch webhook events, and Billing Portal
        id: stripe
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          firebase functions:secrets:access STRIPE_SECRET_PRODUCTION \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" | tail -n 1 > .stripe-key
          node <<'NODE'
          const fs = require('node:fs');
          const key = fs.readFileSync('.stripe-key', 'utf8').trim();
          async function stripe(path) {
            const response = await fetch(`https://api.stripe.com${path}`, {
              headers: {Authorization: `Bearer ${key}`},
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(`Stripe credential validation failed (${response.status}).`);
            return payload;
          }
          (async () => {
            const [account, balance, endpoints, portalConfigurations] = await Promise.all([
              stripe('/v1/account'),
              stripe('/v1/balance'),
              stripe('/v1/webhook_endpoints?limit=100'),
              stripe('/v1/billing_portal/configurations?limit=100'),
            ]);
            const accountMatch = String(account.id || '') === process.env.EXPECTED_STRIPE_ACCOUNT;
            const live = balance.livemode === true;
            const endpoint = (endpoints.data || []).find((item) =>
              item.url === process.env.STRIPE_WEBHOOK_URL &&
              item.status === 'enabled' && item.livemode === true);
            const requiredSubscriptionEvents = [
              'invoice.paid',
              'invoice.payment_failed',
              'customer.subscription.updated',
              'customer.subscription.deleted',
            ];
            const enabledEvents = new Set(endpoint && endpoint.enabled_events || []);
            const receivesAllEvents = enabledEvents.has('*');
            const missingSubscriptionEvents = receivesAllEvents ? [] :
              requiredSubscriptionEvents.filter((event) => !enabledEvents.has(event));
            const activePortalConfigurations = (portalConfigurations.data || [])
              .filter((item) => item.active !== false);
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              [
                `Stripe production account match: **${accountMatch ? 'YES' : 'NO'}**`,
                `Stripe production API mode: **${live ? 'LIVE' : 'TEST'}**`,
                `Production webhook endpoint: **${endpoint ? 'ENABLED' : 'MISSING'}**`,
                `Dispatch subscription lifecycle events: **${missingSubscriptionEvents.length === 0 ? 'VERIFIED' : 'INCOMPLETE'}**`,
                `Missing lifecycle events: ${missingSubscriptionEvents.length === 0 ? 'none' : missingSubscriptionEvents.join(', ')}`,
                `Live Billing Portal configurations: **${activePortalConfigurations.length}**`,
                `Portal configuration IDs: ${activePortalConfigurations.length === 0 ? 'none' : activePortalConfigurations.map((item) => item.id).join(', ')}`,
                '',
              ].join('\n'),
            );
            if (!accountMatch) throw new Error('Firebase STRIPE_SECRET_PRODUCTION belongs to a different Stripe account.');
            if (!live) throw new Error('Firebase STRIPE_SECRET_PRODUCTION is not live mode.');
            if (!endpoint) throw new Error('Pipe Buyer production webhook endpoint is not enabled.');
            if (missingSubscriptionEvents.length > 0) {
              throw new Error(`Dispatch subscription webhook events are incomplete: ${missingSubscriptionEvents.join(', ')}`);
            }
            if (activePortalConfigurations.length === 0) {
              throw new Error('No live Stripe Billing Portal configuration exists for Dispatch billing management.');
            }
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
          rm -f .stripe-key

      - name: Check deployed payment functions
        id: functions
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --json > deployed-functions.json
          node <<'NODE'
          const fs = require('node:fs');
          const raw = JSON.parse(fs.readFileSync('deployed-functions.json', 'utf8'));
          const entries = Array.isArray(raw) ? raw : (raw.result || raw.functions || []);
          const names = new Set(entries.map((entry) => String(
            entry.id || entry.name || entry.function || entry.entryPoint || ''
          ).split('/').pop()));
          const required = [
            'stripeMarketplaceWebhook',
            'ensureStripeSellerAccount',
            'createMarketplaceCheckout',
            'createDispatchSubscriptionCheckout',
            'executeMarketplaceRefund',
            'stageMarketplaceDisputeEvidence',
            'processEligibleAffiliatePayouts',
            'getPaymentProviderReadiness',
            'setPaymentProviderReadiness',
          ];
          let missing = 0;
          for (const name of required) {
            const present = names.has(name);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${name}: ${present ? 'deployed' : 'NOT DEPLOYED'}\n`);
            if (!present) missing = 1;
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `missing=${missing}\n`);
          NODE

      - name: Readiness result
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.secrets.outputs.missing }}" != "0" ]]; then
            echo "::error::Production Stripe secrets are not fully configured."
            exit 1
          fi
          if [[ "${{ steps.functions.outputs.missing }}" != "0" ]]; then
            echo "::error::Production payment functions are not fully deployed."
            exit 1
          fi
          echo "Production payment infrastructure prerequisites are present." >> "$GITHUB_STEP_SUMMARY"
