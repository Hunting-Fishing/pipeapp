name: Repair staging onTagRequestCreated trigger drift

on:
  push:
    branches:
      - ops/run-staging-protect-auction-reserve
    paths:
      - .github/workflows/repair-staging-protect-auction-reserve.yml
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA containing the reviewed repair contract
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-staging-trigger-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Repair staging trigger identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      PIPE_RELEASE_SHA: ${{ inputs.commit_sha || '051be3626a650f2e716cf654fc8d740e5a932635' }}
      PIPE_REPAIR_FUNCTION_ID: onTagRequestCreated
      PIPE_FIREBASE_PROJECT_ID: ${{ vars.PIPE_FIREBASE_PROJECT_ID }}
      PIPE_DEPLOY_ENVIRONMENT_GUARD: ${{ secrets.PIPE_DEPLOY_ENVIRONMENT_GUARD }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FUNCTIONS_DISCOVERY_TIMEOUT: "30000"

    steps:
      - name: Validate staging-only repair boundary
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PIPE_RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::commit_sha must be a full 40-character Git SHA."
            exit 1
          fi
          if [[ "$PIPE_DEPLOY_ENVIRONMENT_GUARD" != "staging" ]]; then
            echo "::error::Protected environment guard must be exactly staging."
            exit 1
          fi
          if [[ "$PIPE_FIREBASE_PROJECT_ID" != "pipebuyer-5c77f" ]]; then
            echo "::error::This one-time repair is allowlisted only for staging project pipebuyer-5c77f."
            exit 1
          fi
          if [[ "$PIPE_FIREBASE_PROJECT_ID" == "flutter-flow-pipe" ]]; then
            echo "::error::Production project is forbidden for this repair."
            exit 1
          fi
          if [[ "$PIPE_REPAIR_FUNCTION_ID" != "onTagRequestCreated" ]]; then
            echo "::error::This ops run is hard-limited to onTagRequestCreated."
            exit 1
          fi
          if [[ -z "${FIREBASE_TOKEN:-}" ]]; then
            echo "::error::FIREBASE_TOKEN is not configured in the staging environment."
            exit 1
          fi

      - name: Check out exact repair commit
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ env.PIPE_RELEASE_SHA }}
          fetch-depth: 0

      - name: Prove exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$PIPE_RELEASE_SHA" ]]; then
            echo "::error::Checked out $actual_sha instead of $PIPE_RELEASE_SHA."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$PIPE_RELEASE_SHA" origin/main; then
            echo "::error::Repair commits must already be contained in origin/main."
            exit 1
          fi

      - name: Install Functions Node runtime
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Test staging trigger repair contract
        run: node --test tool/staging_trigger_repair_test.mjs

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.25.0

      - name: Inventory staging function before repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          firebase functions:list \
            --project "$PIPE_FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --json > build/staging-functions-before-repair.json
          node tool/staging_trigger_repair.mjs \
            assess "$PIPE_REPAIR_FUNCTION_ID" build/staging-functions-before-repair.json \
            > build/staging-trigger-repair-assessment.json
          cat build/staging-trigger-repair-assessment.json

      - name: Delete only proven stale HTTPS resource
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:delete "$PIPE_REPAIR_FUNCTION_ID" \
            --region us-central1 \
            --project "$PIPE_FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --force

      - name: Prove stale identity is absent
        shell: bash
        run: |
          set -euo pipefail
          firebase functions:list \
            --project "$PIPE_FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --json > build/staging-functions-after-repair.json
          node tool/staging_trigger_repair.mjs \
            assert-absent "$PIPE_REPAIR_FUNCTION_ID" build/staging-functions-after-repair.json \
            > build/staging-trigger-repair-result.json
          cat build/staging-trigger-repair-result.json

      - name: Record repair evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: staging-on-tag-request-created-trigger-repair-${{ env.PIPE_RELEASE_SHA }}-${{ github.run_id }}
          path: |
            build/staging-functions-before-repair.json
            build/staging-trigger-repair-assessment.json
            build/staging-functions-after-repair.json
            build/staging-trigger-repair-result.json
          if-no-files-found: warn
          retention-days: 30
