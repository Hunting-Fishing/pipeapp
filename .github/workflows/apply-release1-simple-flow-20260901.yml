name: Apply Release 1 simple flow

on:
  push:
    branches:
      - feature/release-1-simple-flow-20260901
    paths:
      - ".github/workflows/apply-release1-simple-flow-20260901.yml"

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build and verify simple entry flow
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7.0.0
        with:
          ref: feature/release-1-simple-flow-20260901
          fetch-depth: 0

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Apply bounded Release 1 source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/prepatch_release1_profile_labels_20260901.py
          python3 tool/apply_release1_simple_flow_20260901.py

      - name: Format Release 1 Dart files
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/marketplace/marketplace_navigation.dart \
            lib/marketplace/marketplace_home_welcome.dart \
            lib/marketplace/oil_gas_marketplace.dart \
            test/marketplace_home_hero_responsive_test.dart \
            test/marketplace_adaptive_shell_test.dart \
            test/marketplace_navigation_test.dart

      - name: Restore Flutter dependencies
        run: flutter pub get

      - name: Analyze application and tests
        run: flutter analyze lib test

      - name: Run focused Release 1 tests
        run: >-
          flutter test
          test/marketplace_navigation_test.dart
          test/marketplace_home_hero_responsive_test.dart
          test/marketplace_adaptive_shell_test.dart

      - name: Run full Flutter regression
        run: >-
          flutter test
          --dart-define=PIPE_ENV=continuous-integration
          --dart-define=PIPE_RELEASE_SHA=${{ github.sha }}

      - name: Verify bounded changed-file scope
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(lib/marketplace/marketplace_navigation.dart|lib/marketplace/marketplace_home_welcome.dart|lib/marketplace/oil_gas_marketplace.dart|test/marketplace_home_hero_responsive_test.dart|test/marketplace_adaptive_shell_test.dart|test/marketplace_navigation_test.dart|docs/PIPEBUYER_ACTIVE_PRODUCT_BUILD_PLAN_2026-09-01.md)$'
          git diff --check
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit verified Release 1 slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pipe Buyer Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            lib/marketplace/marketplace_navigation.dart \
            lib/marketplace/marketplace_home_welcome.dart \
            lib/marketplace/oil_gas_marketplace.dart \
            test/marketplace_home_hero_responsive_test.dart \
            test/marketplace_adaptive_shell_test.dart \
            test/marketplace_navigation_test.dart \
            docs/PIPEBUYER_ACTIVE_PRODUCT_BUILD_PLAN_2026-09-01.md
          git commit -m 'Release 1: simplify Pipe Buyer entry flow'
          git push origin HEAD:feature/release-1-simple-flow-20260901
