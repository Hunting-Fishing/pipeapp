name: Dispatch Release 1 production

on:
  push:
    branches:
      - ops/deploy-release1-996bd3f7
    paths:
      - .github/workflows/dispatch-release1-production-20260901.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch canonical protected production release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy.yml for exact Release 1 SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 996bd3f782a89639aaf12527193cb1ecf4d92f84
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches \
            -f ref=main \
            -f 'inputs[environment]=production' \
            -f "inputs[commit_sha]=$RELEASE_SHA" \
            -f 'inputs[app_check_mode]=enforce'
          echo "Dispatched canonical production release for $RELEASE_SHA"
