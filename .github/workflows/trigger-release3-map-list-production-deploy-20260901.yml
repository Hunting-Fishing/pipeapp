name: Trigger Release 3 Map List production deploy

on:
  push:
    branches:
      - ops/deploy-release3-map-list-5f3875cb
    paths:
      - .github/workflows/trigger-release3-map-list-production-deploy-20260901.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch protected production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml \
            --repo Hunting-Fishing/pipeapp \
            --ref main \
            -f environment=production \
            -f commit_sha=5f3875cb57a0629c180e19db36c2b9c21b0ce6ea \
            -f app_check_mode=enforce
