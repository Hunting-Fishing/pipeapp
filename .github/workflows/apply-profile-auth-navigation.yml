name: Apply profile auth navigation patch

on:
  push:
    branches:
      - phase-1-1-profile-auth-navigation
    paths:
      - .github/workflows/apply-profile-auth-navigation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-1-1-profile-auth-navigation
          fetch-depth: 0
      - name: Apply isolated source patch
        run: python tool/apply_profile_auth_navigation.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/marketplace/marketplace_adaptive_shell.dart \
            lib/marketplace/oil_gas_marketplace.dart \
            test/marketplace_adaptive_shell_test.dart
          git diff --cached --check
          git commit -m "Improve profile and web authentication navigation"
          git push origin HEAD:phase-1-1-profile-auth-navigation
