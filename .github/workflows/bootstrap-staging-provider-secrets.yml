name: Bootstrap staging provider secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Prepare disabled staging provider secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      PIPE_FIREBASE_PROJECT_ID: ${{ vars.PIPE_FIREBASE_PROJECT_ID }}
      EXPECTED_STAGING_PROJECT_ID: pipebuyer-5c77f

    steps:
      - name: Validate protected staging target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_TOKEN:-}" ]]; then
            echo "::error::FIREBASE_TOKEN is not configured in the staging GitHub Environment."
            exit 1
          fi
          if [[ "$PIPE_FIREBASE_PROJECT_ID" != "$EXPECTED_STAGING_PROJECT_ID" ]]; then
            echo "::error::Refusing to bootstrap provider placeholders outside $EXPECTED_STAGING_PROJECT_ID."
            exit 1
          fi
          if [[ "$PIPE_FIREBASE_PROJECT_ID" == "flutter-flow-pipe" ]]; then
            echo "::error::Production must never receive staging provider placeholders."
            exit 1
          fi

      - name: Install Node 22
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.25.0 --no-audit --no-fund

      - name: Ensure disabled staging Stripe secret bindings exist
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work_dir="$(mktemp -d)"
          cleanup() {
            rm -rf "$work_dir"
          }
          trap cleanup EXIT

          ensure_placeholder_secret() {
            local name="$1"
            local value_file="$work_dir/$name"

            if firebase functions:secrets:access "$name" \
              --project "$PIPE_FIREBASE_PROJECT_ID" \
              --token "$FIREBASE_TOKEN" > /dev/null 2>&1; then
              echo "$name already has an accessible staging version; leaving it unchanged." >> "$GITHUB_STEP_SUMMARY"
              return
            fi

            # These values exist only so Firebase can bind secret-backed functions in
            # staging while Stripe remains disabled. They are random and never logged.
            openssl rand -hex 48 > "$value_file"
            firebase functions:secrets:set "$name" \
              --data-file "$value_file" \
              --project "$PIPE_FIREBASE_PROJECT_ID" \
              --token "$FIREBASE_TOKEN" \
              --non-interactive > /dev/null

            if ! firebase functions:secrets:access "$name" \
              --project "$PIPE_FIREBASE_PROJECT_ID" \
              --token "$FIREBASE_TOKEN" > /dev/null 2>&1; then
              echo "::error::$name was created but its latest version is not accessible."
              exit 1
            fi

            echo "$name received a random disabled-staging placeholder version." >> "$GITHUB_STEP_SUMMARY"
          }

          ensure_placeholder_secret STRIPE_SECRET_PRODUCTION
          ensure_placeholder_secret STRIPE_WEBHOOK_SECRET

          {
            echo ""
            echo "Staging project: \`$PIPE_FIREBASE_PROJECT_ID\`"
            echo "Production project \`flutter-flow-pipe\` was not modified."
            echo "No Stripe credential value was printed or stored in GitHub."
          } >> "$GITHUB_STEP_SUMMARY"
