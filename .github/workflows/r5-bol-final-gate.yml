name: R5 BOL final engineering gate

on:
  push:
    branches:
      - feature/r5-dispatch-provider-inbox-20260911

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact R5 branch
        uses: actions/checkout@v7.0.0
        with:
          ref: feature/r5-dispatch-provider-inbox-20260911

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install Functions Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Restore dependencies
        run: |
          flutter pub get
          npm ci --prefix firebase/functions

      - name: Parse and apply guarded R5 BOL transform
        run: |
          node --check tool/apply_r5_bol.mjs
          node tool/apply_r5_bol.mjs

      - name: Format durable Dart changes
        run: dart format lib/marketplace/marketplace_dispatch_repository.dart lib/marketplace/marketplace_dispatch_transaction.dart test/dispatch_r5_bol_contract_test.dart

      - name: Validate Functions syntax and full Functions regressions
        run: |
          node --check firebase/functions/dispatch_command_policy.js
          node --check firebase/functions/dispatch_commands.js
          npm --prefix firebase/functions test

      - name: Run focused R5 contracts
        run: |
          node --test firebase/functions/test/dispatch_r5_bol_policy.test.js firebase/functions/test/dispatch_quote_v2_validity_policy.test.js
          flutter test test/dispatch_r5_bol_contract_test.dart test/dispatch_provider_inbox_state_test.dart test/dispatch_quote_v2_validity_test.dart

      - name: Analyze all application and tests
        run: dart analyze lib test

      - name: Run complete Flutter regression suite
        run: flutter test

      - name: Verify patch whitespace
        run: git diff --check

      - name: Commit durable R5 BOL implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase/functions/dispatch_command_policy.js firebase/functions/dispatch_commands.js lib/marketplace/marketplace_dispatch_repository.dart lib/marketplace/marketplace_dispatch_transaction.dart
          if git diff --cached --quiet; then
            echo "R5 BOL implementation already applied."
            exit 0
          fi
          git commit -m "Complete R5 bill of lading workflow"
          git push origin HEAD:feature/r5-dispatch-provider-inbox-20260911
