name: Apply Dispatch and admin integration batch

on:
  push:
    branches:
      - phase-1-1-dispatch-onboarding-admin-status
    paths:
      - .github/workflows/apply-dispatch-admin-batch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: phase-1-1-dispatch-onboarding-admin-status
          fetch-depth: 0

      - name: Apply verified source transformations
        run: python tool/apply_dispatch_admin_batch.py

      - name: Remove temporary transformation assets
        run: |
          rm tool/apply_dispatch_admin_batch.py
          rm .github/workflows/apply-dispatch-admin-batch.yml

      - name: Commit integrated application batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/marketplace/marketplace_dispatch_dashboard.dart \
            lib/marketplace/marketplace_dispatch_page.dart \
            lib/marketplace/marketplace_account_hub.dart \
            tool/apply_dispatch_admin_batch.py \
            .github/workflows/apply-dispatch-admin-batch.yml
          git diff --cached --check
          git commit -m "Integrate Dispatch onboarding and admin access status"
          git push origin HEAD:phase-1-1-dispatch-onboarding-admin-status
