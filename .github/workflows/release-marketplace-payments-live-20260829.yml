name: Release Marketplace Payments Live 2026-08-29
# Release trigger: authenticated paid-completion gate repaired and validated 2026-08-29.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-marketplace-payments-live-20260829.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: pipe-buyer-marketplace-payments-live-2026-08-29
  cancel-in-progress: false

jobs:
  launch:
    name: Launch verified marketplace payment release
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Dispatch existing Stripe live alignment orchestrator
        shell: bash
        run: |
          set -euo pipefail
          marker="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run release-stripe-live-alignment-2026-08-29.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

          run_id=""
          for attempt in $(seq 1 90); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release-stripe-live-alignment-2026-08-29.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"$RELEASE_SHA\" and .createdAt >= \"$marker\") | .databaseId" | head -n 1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$run_id" ]]; then
            echo "::error::Verified Stripe live alignment orchestrator did not start for $RELEASE_SHA."
            exit 1
          fi

          echo "Waiting for marketplace payment release orchestrator run $run_id."
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Record one-shot release completion
        shell: bash
        run: |
          {
            echo "## Marketplace payment release launcher"
            echo ""
            echo "- Release SHA: \`$RELEASE_SHA\`"
            echo "- Existing verified Stripe/Firebase orchestrator completed successfully"
            echo "- Checkout activation is controlled by the deferred-tax production profile"
          } >> "$GITHUB_STEP_SUMMARY"
