name: Reconcile build plans 2026-09-01

on:
  push:
    branches:
      - feature/p1-user-blocking-build-plan-20260901
    paths:
      - 'tool/reconcile_build_plans_20260901.mjs'
      - '.github/workflows/reconcile-build-plans-20260901.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: feature/p1-user-blocking-build-plan-20260901
          fetch-depth: 0
      - name: Reconcile planning documents
        run: node tool/reconcile_build_plans_20260901.mjs
      - name: Commit reconciled plans
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Build plans already reconciled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE_1_LAUNCH_FINALIZATION_PLAN.md docs/PHASE_1_PROGRESS_AUDIT.md docs/PIPEBUYER_ACTIVE_BUILD_HANDOFF.md docs/PIPE_BUYER_LAUNCH_READINESS_AUDIT_2026-08-30.md
          git commit -m "Reconcile build plans with current production state"
          git push origin HEAD:feature/p1-user-blocking-build-plan-20260901
