name: Verify Release 3 Provider Detail Surface

on:
  push:
    branches:
      - feature/release-3-provider-detail-surface-20260902
    paths:
      - .github/workflows/verify-release3-provider-detail-surface-20260902.yml

permissions:
  contents: write

jobs:
  verify:
    name: Verify provider detail storefront integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FUNCTIONS_DISCOVERY_TIMEOUT: "30000"

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v7.0.0
        with:
          ref: feature/release-3-provider-detail-surface-20260902
          fetch-depth: 0

      - name: Syntax-check temporary patch tools before mutation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in (
              'tool/apply_release3_provider_detail_surface_20260902.py',
              'tool/run_release3_provider_detail_anchor_repair_20260902.py',
          ):
              compile(Path(path).read_text(encoding='utf-8'), path, 'exec')
          PY

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Install Functions Node runtime
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            firebase/functions/package-lock.json
            firebase/agent-functions/package-lock.json

      - name: Apply guarded provider detail integration
        run: python3 tool/run_release3_provider_detail_anchor_repair_20260902.py

      - name: Verify exact durable mutation scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          allowed=(
            docs/DISPATCH_RELEASE3_PROVIDER_DETAIL_SURFACE.md
            lib/marketplace/marketplace_dispatch_public_detail.dart
            lib/marketplace/marketplace_public_profile_page.dart
            test/marketplace_dispatch_public_detail_test.dart
          )
          if [[ ${#changed[@]} -ne ${#allowed[@]} ]]; then
            printf 'Unexpected provider-detail changes:\n%s\n' "${changed[*]}"
            exit 1
          fi
          for required in "${allowed[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$required" || {
              echo "Missing expected provider-detail change: $required"
              exit 1
            }
          done

      - name: Require formatted changed Dart source
        run: >
          dart format --output=none --set-exit-if-changed
          lib/marketplace/marketplace_dispatch_public_detail.dart
          lib/marketplace/marketplace_public_profile_page.dart
          test/marketplace_dispatch_public_detail_test.dart

      - name: Restore Flutter dependencies with one infrastructure retry
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get || {
            echo 'First pub get failed; retrying once for registry/advisory transport errors.'
            sleep 5
            flutter pub get
          }

      - name: Analyze application and tests
        run: dart analyze lib test

      - name: Run focused provider detail tests
        run: flutter test test/marketplace_dispatch_public_detail_test.dart

      - name: Run full Flutter regression
        run: >
          flutter test
          --dart-define=PIPE_ENV=continuous-integration
          --dart-define=PIPE_RELEASE_SHA=${{ github.sha }}

      - name: Run repository release-contract tests
        run: >
          node --test
          tool/oauth_branding_test.mjs
          tool/release_manifest_test.mjs
          tool/function_parity_test.mjs
          tool/phase1_acceptance_test.mjs
          tool/prepare_phase1_acceptance_test.mjs
          tool/configure_firebase_messaging_worker_test.mjs

      - name: Restore and validate Marketplace Functions
        run: |
          npm ci --prefix firebase/functions
          npm run lint --prefix firebase/functions
          npm run check --prefix firebase/functions

      - name: Restore and validate administrative Functions
        run: |
          npm ci --prefix firebase/agent-functions
          npm run lint --prefix firebase/agent-functions
          npm run check --prefix firebase/agent-functions

      - name: Check source diff formatting
        run: git diff --check

      - name: Commit verified provider detail slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Pipe Buyer Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            docs/DISPATCH_RELEASE3_PROVIDER_DETAIL_SURFACE.md \
            lib/marketplace/marketplace_dispatch_public_detail.dart \
            lib/marketplace/marketplace_public_profile_page.dart \
            test/marketplace_dispatch_public_detail_test.dart
          if git diff --cached --quiet; then
            echo '::error::Provider-detail verification produced no durable changes.'
            exit 1
          fi
          git commit -m 'Release 3: add Dispatch provider detail surface'
          git push origin HEAD:feature/release-3-provider-detail-surface-20260902
