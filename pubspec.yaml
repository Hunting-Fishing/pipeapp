flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: 'tool/brand/pipe_buyer_app_icon_master_v1.png'
    background_color: '#061D49'
    theme_color: '#0878E8'
  windows:
    generate: true
    image_path: 'tool/brand/pipe_buyer_app_icon_master_v1.png'
    icon_size: 48
  macos:
    generate: true
    image_path: 'tool/brand/pipe_buyer_app_icon_master_v1.png'
  image_path: 'tool/brand/pipe_buyer_app_icon_master_v1.png'

flutter_native_splash:
  color: '#061D49'
  image: 'tool/brand/pipe_buyer_app_icon_master_v1.png'
  android: true
  ios: true
  web: true
  android_12:
    color: '#061D49'
    image: 'tool/brand/pipe_buyer_app_icon_master_v1.png'
    icon_background_color: '#061D49'


