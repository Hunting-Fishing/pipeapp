<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pipe Buyer">
  <meta name="google-signin-client_id" content="426221783223-07jigk5gpa3qb7i9d0dcr1rp8uuc75ee.apps.googleusercontent.com">
  <meta name="google-site-verification" content="googled8be046fc034f0b2">
  <meta name="robots" content="index, follow">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Pipe Buyer</title>
  <meta name="description" content="Pipe Buyer is a B2B industrial marketplace, Timed Buying platform, and trucking dispatch network for oil and gas pipe, OCTG, equipment, buildings, vehicles, and heavy machinery across the United States and Canada.">
  <meta property="og:title" content="Pipe Buyer">
  <meta property="og:description" content="Buy and sell industrial pipe, OCTG, equipment, buildings and heavy machinery with Timed Buying and freight Dispatch across the United States and Canada.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.pipebuyer.com/">
  <meta property="og:image" content="https://www.pipebuyer.com/assets/assets/images/pipe_buyer_logo.png">
  <meta name="twitter:title" content="Pipe Buyer">
  <meta name="twitter:description" content="Industrial marketplace, Timed Buying and freight Dispatch for pipe, OCTG, equipment and heavy machinery.">
  <meta name="twitter:image" content="https://www.pipebuyer.com/assets/assets/images/pipe_buyer_logo.png">
  <meta name="twitter:card" content="summary_large_image">

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#ffffff">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Pipe Buyer",
    "alternateName": "Pipe Buyer Marketplace",
    "url": "https://www.pipebuyer.com",
    "description": "Pipe Buyer is a B2B industrial marketplace, Timed Buying platform, and trucking freight Dispatch network serving the United States and Canada.",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "All"
  }
  </script>

  <style>
    :root {
      --pipe-orange: #ff5a00;
      --pipe-ink: #061d49;
      --pipe-muted: #64748b;
      --pipe-line: #e2e8f0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
      color: var(--pipe-ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, Helvetica, sans-serif;
    }

    #pipe-startup {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 28px;
      background: #ffffff;
    }

    .pipe-startup-content {
      width: min(760px, 92vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .pipe-startup-logo {
      display: block;
      width: min(680px, 84vw);
      max-height: 52vh;
      object-fit: contain;
    }

    #pipe-startup-status {
      margin-top: 24px;
      color: var(--pipe-ink);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .1px;
    }

    .pipe-startup-track {
      width: min(360px, 68vw);
      height: 5px;
      margin-top: 13px;
      overflow: hidden;
      border-radius: 999px;
      background: #edf1f5;
    }

    #pipe-startup-progress {
      width: 4%;
      height: 100%;
      border-radius: inherit;
      background: var(--pipe-orange);
      transition: width 240ms ease-out;
    }

    .pipe-startup-label {
      margin-top: 10px;
      color: var(--pipe-muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .25px;
      text-transform: uppercase;
    }

    #pipe-startup-error {
      display: none;
      max-width: 520px;
      margin-top: 14px;
      padding: 10px 12px;
      box-sizing: border-box;
      border: 1px solid #fecaca;
      border-radius: 10px;
      background: #fff1f2;
      color: #991b1b;
      font-size: 12px;
      line-height: 1.4;
    }

    @media (max-width: 600px) {
      #pipe-startup { padding: 18px; }
      .pipe-startup-logo { width: min(94vw, 620px); }
      #pipe-startup-status { margin-top: 18px; font-size: 14px; }
    }
  </style>

  <script>
    let pipeStartupProgress = 4;

    function updatePipeStartup(percent, status) {
      pipeStartupProgress = Math.max(pipeStartupProgress, Math.min(96, percent));
      const bar = document.getElementById('pipe-startup-progress');
      const label = document.getElementById('pipe-startup-status');
      if (bar) bar.style.width = `${pipeStartupProgress}%`;
      if (label && status) label.textContent = status;
    }

    function removePipeStartup() {
      const startup = document.getElementById('pipe-startup');
      if (startup) startup.remove();
      document.body.style.overflow = '';
    }

    window.addEventListener('flutter-first-frame', () => {
      updatePipeStartup(96, 'Opening Pipe Buyer');
      requestAnimationFrame(removePipeStartup);
    }, { once: true });
  </script>
</head>
<body>
  <div id="pipe-startup" role="status" aria-live="polite" aria-label="Pipe Buyer is starting">
    <div class="pipe-startup-content">
      <img
        class="pipe-startup-logo"
        src="assets/assets/images/pipe_buyer_logo.png"
        alt="Pipe Buyer"
        onerror="this.onerror=null;this.src='splash/img/light-4x.png';">
      <div id="pipe-startup-status">Preparing Pipe Buyer</div>
      <div class="pipe-startup-track" role="progressbar" aria-label="Application startup progress" aria-valuemin="0" aria-valuemax="100">
        <div id="pipe-startup-progress"></div>
      </div>
      <div class="pipe-startup-label">Industrial Marketplace · Dispatch · Timed Buying</div>
      <div id="pipe-startup-error"></div>
    </div>
  </div>

  <script>
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
    }
  </script>

  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    updatePipeStartup(10, 'Loading Pipe Buyer');

    _flutter.loader.load({
      onEntrypointLoaded: async function(engineInitializer) {
        updatePipeStartup(34, 'Preparing application services');
        const appRunner = await engineInitializer.initializeEngine();
        updatePipeStartup(62, 'Starting secure services');
        await appRunner.runApp();
        updatePipeStartup(90, 'Opening marketplace');
      }
    }).catch(function(error) {
      const failure = document.getElementById('pipe-startup-error');
      updatePipeStartup(pipeStartupProgress, 'Pipe Buyer could not start');
      if (failure) {
        failure.style.display = 'block';
        failure.textContent = 'The application could not start. Refresh the page and try again. If the problem continues, copy the browser console error for support.';
      }
      console.error('Pipe Buyer Flutter loader failed', error);
    });
  </script>
</body>
</html>
