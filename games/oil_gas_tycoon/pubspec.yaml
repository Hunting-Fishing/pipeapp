name: oil_gas_tycoon
description: An offline oil and gas production, equipment trading, and company management game.
publish_to: none
version: 1.2.0+3

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: 2.5.3
  audioplayers: 6.8.1
  cupertino_icons: 1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE.txt
    - assets/art/
    - assets/audio/
    - assets/licenses/
  fonts:
    - family: TycoonSans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900
    # CanvasKit's fallback also looks for this canonical family name.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900
